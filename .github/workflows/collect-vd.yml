# 平日早上在 GitHub 的機器上跑 VD 收集程式，結果存成 Actions 的 artifact（保留 30 天），不進 git。
# 需要在 repo 的 Settings → Secrets and variables → Actions 新增 TDX_CLIENT_ID、TDX_CLIENT_SECRET。
name: collect-vd

on:
  schedule:
    - cron: '30 22 * * 0-4'  # 台北時間週一到週五 06:30 啟動，等到 07:00 開始收
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect 07:00–10:30
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 data/fetch/collect_vd.py --today
      - name: Upload raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vd-raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
