# 平日早上在 GitHub 的機器上跑 VD 收集程式，結果存成 Actions 的 artifact（保留 30 天），不進 git。
# 需要在 repo 的 Settings → Secrets and variables → Actions 新增 TDX_CLIENT_ID、TDX_CLIENT_SECRET。
name: collect-vd

on:
  schedule:
    # GitHub 排程常延遲（10/20 的 06:30 排程 09:07 才啟動），所以從 05:07 起排 4 次，
    # 避開整點尖峰；同時只會有一個在跑，其餘排隊，等到 10:30 後啟動會直接結束。
    - cron: '7 21 * * 0-4'   # 台北 05:07
    - cron: '37 21 * * 0-4'  # 台北 05:37
    - cron: '7 22 * * 0-4'   # 台北 06:07
    - cron: '37 22 * * 0-4'  # 台北 06:37
  workflow_dispatch:

concurrency:
  group: collect-vd
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 05:07 啟動到 10:30 約 325 分鐘
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect 07:00–10:30
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 data/fetch/collect_vd.py --today
      - name: Upload raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vd-raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
