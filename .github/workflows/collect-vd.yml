# 平日早上與傍晚在 GitHub 的機器上跑 VD 收集程式，結果存成 Actions 的 artifact（保留 30 天），不進 git。
# 手動執行（Actions → collect-vd → Run workflow）可以填開始、結束時間，例如臨時要收今晚。
# 這支只收臺北市交工處的 VDLive，**不需要任何金鑰**。
# TDX 國道資料：本專案的免費額度已於 2026-10-24 用完、金鑰失效，所以不再抓；
# 國 1 內湖交流道在畫面上維持模擬值（assumed／sim: true）。詳見 data/SOURCES.md。
# repo 已於 10/24 轉為公開，公開 repo 的 Actions 分鐘數不計費，但仍不整天收（對來源客氣）。
name: collect-vd

on:
  # 10/23 收集結束，排程已停用；要再收時到 Actions → collect-vd → Run workflow 手動執行並填時段。
  # 原本的排程：早上台北 05:07／05:37／06:07／06:37（收 07:00–10:30），傍晚 15:37／16:07（收 16:30–20:30）
  workflow_dispatch:
    inputs:
      start:
        description: '開始時間（台北，HH:MM）；空白＝依現在時間自動選早上或傍晚'
        required: false
        default: ''
      end:
        description: '結束時間（台北，HH:MM）'
        required: false
        default: ''

concurrency:
  group: collect-vd
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 05:07 啟動到 10:30 約 325 分鐘；GitHub 單一工作最長 6 小時
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pick window
        id: w
        env:
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
        run: |
          if [ -n "$IN_START" ] && [ -n "$IN_END" ]; then s="$IN_START"; e="$IN_END"
          elif [ "$(TZ=Asia/Taipei date +%H)" -lt 12 ]; then s=07:00; e=10:30
          else s=16:30; e=20:30; fi
          echo "start=$s" >> "$GITHUB_OUTPUT"; echo "end=$e" >> "$GITHUB_OUTPUT"
          echo "收集時段：$s–$e（台北）"
      # 不抓 TDX（免費額度已用完，見下方註解）。臺北市 VDLive 不需要金鑰。
      - name: Collect
        run: python3 data/fetch/collect_vd.py --today --start ${{ steps.w.outputs.start }} --end ${{ steps.w.outputs.end }}
      - name: Upload raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vd-raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
