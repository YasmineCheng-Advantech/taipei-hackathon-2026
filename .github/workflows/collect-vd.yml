# 平日早上與傍晚在 GitHub 的機器上跑 VD 收集程式，結果存成 Actions 的 artifact（保留 30 天），不進 git。
# 手動執行（Actions → collect-vd → Run workflow）可以填開始、結束時間，例如臨時要收今晚。
# 注意：repo 是私人的，Actions 每月免費 2,000 分鐘，等待時間也算，所以不整天收。
# 需要在 repo 的 Settings → Secrets and variables → Actions 新增 TDX_CLIENT_ID、TDX_CLIENT_SECRET。
name: collect-vd

on:
  schedule:
    # GitHub 排程常延遲（10/20 的 06:30 排程 09:07 才啟動），所以從 05:07 起排 4 次，
    # 避開整點尖峰；同時只會有一個在跑，其餘排隊，等到 10:30 後啟動會直接結束。
    - cron: '7 21 * * 0-4'   # 台北 05:07
    - cron: '37 21 * * 0-4'  # 台北 05:37
    - cron: '7 22 * * 0-4'   # 台北 06:07
    - cron: '37 22 * * 0-4'  # 台北 06:37
    # 傍晚下班：同樣多排一次防延遲，收 16:30–20:30
    - cron: '37 7 * * 1-5'   # 台北 15:37
    - cron: '7 8 * * 1-5'    # 台北 16:07
  workflow_dispatch:
    inputs:
      start:
        description: '開始時間（台北，HH:MM）；空白＝依現在時間自動選早上或傍晚'
        required: false
        default: ''
      end:
        description: '結束時間（台北，HH:MM）'
        required: false
        default: ''

concurrency:
  group: collect-vd
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # 05:07 啟動到 10:30 約 325 分鐘；GitHub 單一工作最長 6 小時
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pick window
        id: w
        env:
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
        run: |
          if [ -n "$IN_START" ] && [ -n "$IN_END" ]; then s="$IN_START"; e="$IN_END"
          elif [ "$(TZ=Asia/Taipei date +%H)" -lt 12 ]; then s=07:00; e=10:30
          else s=16:30; e=20:30; fi
          echo "start=$s" >> "$GITHUB_OUTPUT"; echo "end=$e" >> "$GITHUB_OUTPUT"
          echo "收集時段：$s–$e（台北）"
      - name: Collect
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: python3 data/fetch/collect_vd.py --today --start ${{ steps.w.outputs.start }} --end ${{ steps.w.outputs.end }}
      - name: Upload raw data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vd-raw-${{ github.run_id }}
          path: data/raw/
          retention-days: 30
