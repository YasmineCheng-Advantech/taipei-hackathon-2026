<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>無法錯峰的理由</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.card{background:#FFFFFF;border-radius:24px;box-shadow:0 10px 30px rgba(214,110,50,.14)}
.chip{appearance:none;border:0;border-radius:10px;background:#DBDBDB;color:#4C4C4C;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;cursor:pointer;position:relative;overflow:hidden;box-shadow:0 2px 4px rgba(0,0,0,.05)}
.chip.on{background:linear-gradient(180deg,#F6A86A 0%,#F28A52 45%,#F2693B 100%);color:#FFFFFF;box-shadow:0 0 0 1.5px #FFE3B8,0 4px 10px rgba(226,88,42,.22)}
.chip.on::before{content:'';position:absolute;left:5px;right:5px;top:3px;height:40%;border-radius:9px;background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,.06));pointer-events:none}
.chip > span{position:relative}
.box{width:15px;height:15px;border-radius:4px;box-sizing:border-box;border:1.5px solid #5A5A5A;background:#FFFFFF;flex:none;display:grid;place-items:center;color:transparent}
.chip.on .box{border:1.5px solid #FFFFFF;color:#E2582A}
.other{appearance:none;border:0;border-radius:10px;background:#DBDBDB;height:46px;width:100%;box-sizing:border-box;padding:0 16px 0 21px;font:700 14px/1 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.04em;color:#3A2418;box-shadow:0 2px 4px rgba(0,0,0,.05)}
.other::placeholder{color:#4C4C4C;opacity:1}
.other:focus{outline:none;background:#FFFFFF;box-shadow:inset 0 0 0 2px #F28A52}
.cta{position:relative;height:58px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(180deg,#56E3FA 0%,#2BD5F6 50%,#1CC3EC 100%);box-shadow:0 6px 0 #2C8FB2,0 14px 24px rgba(20,140,180,.22);color:#1E4A5E;font:900 19px/1 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.13em;text-decoration:none;overflow:hidden}
.cta::before{content:'';position:absolute;left:12px;right:12px;top:5px;height:22px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.14));pointer-events:none}
.cta span{position:relative}
.cta:hover{color:#1E4A5E;filter:brightness(1.04)}
.tab{display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:.1em;color:#4F4F4F;text-decoration:none}
.tab+.tab{box-shadow:inset 1px 0 0 #ECE7E3}
.tab.on{color:#F07848}
.tab:hover{color:#F07848}
</style>
</helmet>
<div class="screen has-tabs" style="position: relative; font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei', system-ui, sans-serif; color: #4A4846; background: radial-gradient(190px 120px at 50% 672px, rgba(239,137,62,.95) 0%, rgba(239,137,62,.5) 45%, rgba(239,137,62,0) 100%), radial-gradient(240px 300px at 50% 560px, rgba(244,165,105,.5), rgba(244,165,105,0) 100%), linear-gradient(180deg, #FFFFFF 0px, #FFFFFF 50px, #FEF9F5 150px, #FFF4EE 200px, #FBE8D9 300px, #FADCC4 400px, #F8D5B9 450px, #F8CFB1 500px, #F8CDAB 550px, #F9CEAE 600px, #F9D6BA 650px, #FCE3CF 700px, #FEF5EE 750px, #FFFFFF 800px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 21px 15px 0 22px">
    <a href="Setup.dc.html" aria-label="回上一步" style="width: 44px; height: 44px; display: grid; place-items: center; color: #F07848">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 10px rgba(0,0,0,.08); display: grid; place-items: center">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5L4.5 7 9 11.5"></path></svg>
      </span>
    </a>
    <a href="Menu.dc.html" aria-label="開啟選單" style="width: 48px; height: 48px; display: grid; place-items: center; color: #F07848">
      <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 2h22M2 12h22M2 22h22"></path></svg>
    </a>
  </div>

  <div style="padding: 8px 17px 0; display: flex; flex-direction: column; gap: 13px">
    <div style="margin-left: 12px; display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap">
      <h1 style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.06em; color: #4C4C4C">無法錯峰的理由</h1>
      <span style="font-size: 12px; letter-spacing: 0.04em; color: #75716E">可以複選，也可以跳過</span>
    </div>

    <div class="card" style="box-sizing: border-box; padding: 20px 20px 20px 19px; display: flex; flex-direction: column; gap: 8.5px">
      <sc-for list="{{items}}" as="c" hint-placeholder-count="5">
        <button type="button" class="chip {{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.toggle}}" style="min-height: 46px; flex: none; padding: 8px 12px 8px 21px; display: flex; align-items: center; gap: 21px; text-align: left">
          <span class="box" aria-hidden="true"><svg width="11" height="11" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 7.5l3 3 6-7"></path></svg></span>
          <span style="font-size: 14px; font-weight: 700; letter-spacing: 0.02em; line-height: 1.4">{{c.label}}</span>
        </button>
      </sc-for>
      <label style="display: block; flex: none">
        <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">其他原因（最多 40 字）</span>
        <input class="other" type="text" maxlength="40" placeholder="其他：點選自填原因" value="{{other}}" onChange="{{onOther}}">
      </label>
    </div>

    <div style="box-sizing: border-box; padding: 14px 19px; border-radius: 22px; background: #FFF6EF; box-shadow: 0 6px 18px rgba(214,110,50,.08); display: flex; flex-direction: column; gap: 5px">
      <p style="margin: 0; font-size: 12.5px; font-weight: 700; letter-spacing: 0.06em; color: #3A1A10">會送出的資料：</p>
      <p style="margin: 0; font-size: 12px; line-height: 1.6; letter-spacing: 0.04em; color: #C8423C">入口、最晚到、時間彈性、勾選與自填原因、日期</p>
      <p style="margin: 0; font-size: 12px; line-height: 1.6; letter-spacing: 0.04em; color: #75716E">不會送出：姓名、電話、帳號、GPS 位置、住址，或任何可以認出你的東西。自填原因請不要寫個人資料。</p>
    </div>

    <a class="cta" href="Loading.dc.html" style="margin: 6px 23px 0"><span>產生今日推薦</span></a>
  </div>

  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #FFFFFF; box-shadow: 0 -1px 0 #ECE7E3, 0 -6px 16px rgba(120,60,20,.04); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <a class="tab on" href="Today.dc.html">今日</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // 同意提供資料的開關移到「我的設定與資料」，這一頁不再問（v2 改版）
  state = { on: {}, other: '', ...app.load('Reasons') };
  save(p) { this.setState(p); app.save('Reasons', { ...this.state, ...p }); }
  renderVals() {
    // 「為什麼沒辦法錯峰」的選項來自題目 JSON（decide.setup.constraints），對應 city.actions
    const list = D.setup.constraints || [];
    const on = this.state.on;
    return {
      other: this.state.other || '',
      // 最多 40 字，前後空白去掉；空字串當作沒填
      onOther: (e) => this.save({ other: String(e.target.value || '').slice(0, 40).trim() }),
      items: list.map((c) => ({
        ...c,
        cls: on[c.id] ? 'on' : '',
        on: on[c.id] ? 'true' : 'false',
        toggle: () => this.save({ on: { ...on, [c.id]: !on[c.id] } })
      })),
    };
  }
}
</script>
</body>
</html>
