<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>Traffic Gem 首頁</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.hero-img{-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 6%,#000 80%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 6%,#000 80%,transparent 100%)}
.cta{display:flex;align-items:center;justify-content:center;height:64px;border-radius:999px;background:linear-gradient(180deg,#6BEBFA 0%,#2AD4F0 42%,#14B8E2 100%);box-shadow:inset 0 7px 0 rgba(255,255,255,.32),0 7px 0 #1C8DB3,0 18px 28px rgba(20,140,180,.25);color:#0B3A4A;font:900 22px/1 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.16em;text-decoration:none}
.cta:hover{color:#0B3A4A;filter:brightness(1.04)}
</style>
</helmet>
<div class="screen" style="position: relative; display: flex; flex-direction: column; padding-bottom: calc(28px + env(safe-area-inset-bottom)); font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei', system-ui, sans-serif; color: #3A2418; background: radial-gradient(80% 300px at 50% 640px, rgba(240,130,60,.42), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FDF1E8 180px, #F9DCC6 420px, #F6C9A6 600px, #FBE2CF 760px, #FFF6EF 844px)">
  <a href="Menu.dc.html" aria-label="開啟選單" style="position: absolute; top: 22px; right: 18px; width: 48px; height: 48px; display: grid; place-items: center; color: #D2532A">
    <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 2h26M2 12h26M2 22h26"></path></svg>
  </a>
  <h1 style="position: relative; z-index: 1; margin: clamp(64px, 12vh, 104px) 0 0 42px; font-family: 'Grandstander', 'Noto Sans TC','PingFang TC','Microsoft JhengHei', sans-serif; font-weight: 800; font-size: 68px; line-height: 0.98; letter-spacing: 0.01em; color: #E0592C">Traffic<br>Gem</h1>
  <div style="position: relative; flex: 1 1 auto; min-height: 250px; max-height: 420px; margin-top: -28px">
  <img class="hero-img" src="/_blob/9ec09c185edb5019891596a830757aa8" alt="被捲起來的橘色道路上，三台玩具車" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover">
  <p style="position: absolute; top: 40px; left: 44px; margin: 0; font-size: 14px; font-weight: 500; line-height: 1.75; letter-spacing: 0.22em; color: #A63C16">把塞車捲起來，<br>挑出比較順的那 15 分鐘。</p>
  </div>
  <p style="position: relative; margin: -12px 16px 0; text-align: center; font-size: 21px; font-weight: 900; line-height: 1.65; letter-spacing: 0.12em; color: #5A2410">告訴我們你的通勤需求<br>{{tagline}}</p>
  <a class="cta" href="Setup.dc.html" style="margin: 22px 40px 0">準備出門</a>
  <p style="margin: 22px 0 0; text-align: center; font-size: 15px; letter-spacing: 0.14em; color: #A63C16">免註冊，只要 30 秒！</p>
  <p class="live-bar {{liveCls}}" aria-live="polite" style="margin: 14px 24px 0; justify-content: center"><span class="dot" aria-hidden="true"></span><span>{{liveText}}</span></p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  usesLive = true;
  renderVals() {
    const live = D.live;
    const here = D.rows.map((r) => ({ r, e: D.liveAt(r.id) })).filter((x) => x.e);
    // 首頁放一行即時摘要；取不到就不吹噓，直接說取不到
    const text = live.state === 'ok' && here.length
      ? `現在 ${D.hhmm(live.updated_at)}・` + here.slice(0, 3).map((x) => `${x.r.name} ${x.e.speed}`).join('、') + ' km/h'
      : live.state === 'loading' ? '正在取得即時路況…' : '暫時取不到即時路況';
    return {
      tagline: D.meta.title + '・幫你挑一個比較不塞的時段',
      liveText: text,
      liveCls: live.state === 'ok' && here.length ? (live.stale ? 'is-stale' : '') : 'is-error',
    };
  }
}
</script>
</body>
</html>
