<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>選單</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.sec{margin:0;padding-bottom:9px;border-bottom:1.5px solid #F4C4B4;font-size:15px;font-weight:900;letter-spacing:.1em;color:#4E1408}
.item{display:flex;align-items:center;min-height:48px;box-sizing:border-box;margin-left:16px;border-bottom:1px solid #F1DDD4;font-size:17px;letter-spacing:.18em;color:#4E1408;text-decoration:none}
.item:hover{color:#F07848}
.item.on{color:#F07848}
.pro{margin-right:10px}
.tab{display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:.1em;color:#4F4F4F;text-decoration:none}
.tab+.tab{box-shadow:inset 1px 0 0 #ECE7E3}
.tab:hover{color:#F07848}
</style>
</helmet>
<div class="screen has-tabs" style="position: relative; display: flex; flex-direction: column; padding-top: 20px; font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei', system-ui, sans-serif; color: #4A4846; background: linear-gradient(180deg, #FFFFFF 0px, #FEF4EC 150px, #F9D2B4 330px, #F3B587 440px, #F6C49E 600px, #FBE3CF 720px, #FFFFFF 800px)">
  <div style="flex: 1 1 auto; margin-left: 41px; box-sizing: border-box; padding: 26px 20px 28px 29px; background: #FFFFFF; border-radius: 44px 0 0 44px; box-shadow: -10px 6px 30px rgba(170,80,30,.16)">
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 24px">
      <a href="Main.dc.html" aria-label="Traffic Gem 首頁" style="display: block; margin-top: 2px">
        <img src="/_blob/44c89e170dc4e362d7299d4fcb996db2" alt="Traffic Gem" style="display: block; width: 140px; height: 18px">
      </a>
      <a href="#back" aria-label="關閉選單" style="width: 44px; height: 44px; margin-right: -12px; display: grid; place-items: center; color: #F07848">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M2 2l16 16M18 2L2 18"></path></svg>
      </a>
    </div>
    <p style="margin: 14px 0 0; font-size: 13px; letter-spacing: 0.1em; color: #5E5A57">{{subtitle}}</p>

    <nav aria-label="數據依據" style="margin-top: 30px">
      <h2 class="sec">數據依據</h2>
      <a class="item" href="City.dc.html">目標</a>
      <a class="item" href="Commute.dc.html">民眾提供的通勤資料</a>
      <a class="item" href="Changes.dc.html">數據指向哪些改變</a>
    </nav>
    <nav aria-label="給市府與企業" style="margin-top: 26px">
      <h2 class="sec">給市府與企業</h2>
      <a class="item pro" href="Heatmap.dc.html">熱力圖</a>
      <a class="item pro" href="Scenario.dc.html">錯峰情境</a>
      <a class="item pro" href="Sensitivity.dc.html">哪個假設最影響結論</a>
      <a class="item pro" href="EntryMap.dc.html">入口地圖</a>
      <a class="item pro" href="Ranking.dc.html">哪個入口最塞</a>
      <a class="item pro" href="DayCurve.dc.html">一個入口的早上</a>
      <a class="item pro" href="Reliability.dc.html">{{reliabilityLabel}}</a>
      <a class="item pro" href="CumCurve.dc.html">排隊是怎麼來的</a>
      <a class="item pro" href="Tradeoff.dc.html" style="border-bottom: 0">少塞幾分 vs 早到幾分</a>
    </nav>
    <p style="margin: 22px 0 0; font-size: 12px; line-height: 1.6; color: #6B4A3A">資料來源：{{sources}}。部分數字為模擬資料，畫面上會標示。</p>
  </div>

  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #FFFFFF; box-shadow: 0 -1px 0 #ECE7E3, 0 -6px 16px rgba(120,60,20,.04); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <a class="tab" href="Today.dc.html">今日</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const p = app.profile();
    const d = new Date();
    const first = D.cell('speed', 0, 0);
    return {
      // 設計稿是「10/24・堤頂大道・08:30前到」；日期與設定都取當下的，不寫死
      subtitle: `${d.getMonth() + 1}/${d.getDate()}・${p.entry}・${p.deadline} 前到`,
      // 「幾天裡有幾天會塞」的天數會隨資料長大，從格子讀，不寫死
      reliabilityLabel: first.days ? `${first.days} 天裡有幾天會塞` : '有幾天會塞',
      sources: (D.meta.sources || []).map((x) => x.name).join('、'),
    };
  }
}
</script>
</body>
</html>
