<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>排隊從哪裡來</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.sim{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE;white-space:nowrap}
.card{background:#FFFFFF;border-radius:26px;box-shadow:0 12px 32px rgba(214,100,40,.13)}
.seg{appearance:none;border:0;border-radius:14px;min-height:44px;background:#DEDCDA;color:#3F3935;font:500 14px/1.3 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.04em;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.seg.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;font-weight:700;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 2px rgba(255,214,170,.75)}
.hit{appearance:none;border:0;padding:0;background:transparent;position:absolute;top:0;bottom:0;cursor:pointer}
.hit:focus-visible{outline:2px solid #0B3A4A}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
</style>
</helmet>
<div class="screen has-tabs" style="position: relative; font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 220px at 50% 600px, rgba(240,130,60,.22), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF5EE 160px, #FBE4D3 460px, #F8D6BD 760px, #FFF8F3 960px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 12px">
    <a href="Menu.dc.html" style="width: 34px; height: 34px; margin: 7px 0 0 15px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 10px rgba(0,0,0,.08); display: grid; place-items: center; font-size: 0; color: #F07848; text-decoration: none">
      <svg width="16" height="16" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4l-6 6 6 6"></path></svg>選單
    </a>
    <span class="sim">程式計算・含模擬資料</span>
  </div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="margin: 0 0 0 14px; display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.08em; color: #5A2410">排隊是怎麼來的</h1>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #6B4A3A">{{subtitle}}</p>
    </div>
    <div role="group" aria-label="情境" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button type="button" class="seg {{m.cls}}" aria-pressed="{{m.on}}" onClick="{{m.pick}}">{{m.label}}</button>
      </sc-for>
    </div>
    <section class="card" aria-label="累積車輛曲線" style="padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 12px; flex-wrap: wrap; padding: 0 4px; font-size: 12px; color: #6B4A3A">
        <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 16px; height: 3px; border-radius: 2px; background: #C93A22"></i>累計來到入口</span>
        <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 16px; height: 3px; border-radius: 2px; background: #0E6F84"></i>累計通過入口</span>
        <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 14px; height: 10px; border-radius: 3px; background: #F7B48C"></i>兩線之間＝排隊</span>
      </div>
      <div style="position: relative; width: 330px; height: 230px">
        <svg viewBox="0 0 330 230" width="330" height="230" aria-hidden="true" style="position: absolute; inset: 0; overflow: visible">
          <line x1="40" y1="20" x2="322" y2="20" stroke="#F1E6DE"></line>
          <line x1="40" y1="70" x2="322" y2="70" stroke="#F1E6DE"></line>
          <line x1="40" y1="120" x2="322" y2="120" stroke="#F1E6DE"></line>
          <line x1="40" y1="170" x2="322" y2="170" stroke="#F1E6DE"></line>
          <line x1="40" y1="220" x2="322" y2="220" stroke="#D9C8BC"></line>
          <sc-for list="{{yaxis}}" as="y" hint-placeholder-count="5">
            <text x="34" y="{{y.y}}" text-anchor="end" font-size="10" fill="#6B4A3A">{{y.label}}</text>
          </sc-for>
          <path d="{{area}}" fill="#F7B48C"></path>
          <path d="{{dep}}" fill="none" stroke="#0E6F84" stroke-width="2.5" stroke-linejoin="round"></path>
          <path d="{{arr}}" fill="none" stroke="#C93A22" stroke-width="2.5" stroke-linejoin="round"></path>
          <line x1="{{selX}}" y1="14" x2="{{selX}}" y2="220" stroke="#3A2418" stroke-width="1"></line>
        </svg>
        <sc-for list="{{hits}}" as="h" hint-placeholder-count="9">
          <button type="button" class="hit" style="left: {{h.left}}px; width: 34px" aria-label="{{h.aria}}" onClick="{{h.pick}}"></button>
        </sc-for>
      </div>
      <div style="position: relative; height: 16px; font-size: 11px; color: #6B4A3A; font-variant-numeric: tabular-nums">
        <sc-for list="{{xlabels}}" as="x" hint-placeholder-count="3">
          <span style="position: absolute; left: {{x.left}}px; transform: translateX(-50%)">{{x.label}}</span>
        </sc-for>
      </div>
      <p aria-live="polite" style="margin: 4px 4px 0; padding-top: 10px; border-top: 2px dotted #F1DCCD; font-size: 14px; line-height: 1.65">{{readout}}</p>
    </section>
    <section class="card" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.06em">怎麼讀</h2>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.7; color: #5A3A2A">{{how}}</p>
    </section>
  </div>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #FFFFFF; box-shadow: 0 -1px 0 #ECE7E3, 0 -6px 16px rgba(120,60,20,.04); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <a href="Today.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0.1em; text-decoration: none; color: #4F4F4F">今日</a>
    <a href="Settings.dc.html" style="display: flex; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 0.1em; text-decoration: none; color: #4F4F4F; box-shadow: inset 1px 0 0 #ECE7E3">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  // 累積曲線也是排隊模型離線算好的（scenario.baseline 與 results[].cum_arrive / cum_depart）
  state = { m: 0, c: null };

  renderVals() {
    const S = this.state;
    const sc = D.scenario;
    const cols = sc.cols || [];
    const baseline = sc.baseline || {};
    const target = (sc.targets || [])[0] || {};

    // 現在 + 這個目標時段的前兩個刻度，作為三個對照情境
    const shifts = (sc.results || [])
      .filter((r) => r.target === target.id && r.shift > 0)
      .map((r) => r.shift)
      .sort((a, b) => a - b)
      .slice(0, 2);
    const M = [{ label: '現在', r: baseline }].concat(
      shifts.map((s) => ({ label: `${target.label ? '移出' : ''} ${s}${(sc.slider || {}).unit || '%'}`.trim(), r: D.result(target.id, s) }))
    ).filter((x) => x.r && x.r.cum_arrive);

    if (!M.length) {
      return { subtitle: '', modes: [], arr: '', dep: '', area: '', selX: 0, hits: [], yaxis: [], xlabels: [],
        readout: '這個題目沒有累積曲線的資料。', how: '' };
    }

    const mi = Math.min(S.m, M.length - 1);
    const m = M[mi];
    const a = m.r.cum_arrive || [];
    const d = m.r.cum_depart || [];
    const n = Math.min(a.length, d.length, cols.length);
    const ci = S.c != null ? Math.min(S.c, n - 1)
      : Math.max(0, a.map((v, i) => v - d[i]).indexOf(Math.max(...a.map((v, i) => v - d[i]))));

    // 軸依資料的實際範圍，不寫死 2,000–10,000
    const all = a.slice(0, n).concat(d.slice(0, n));
    const lo = Math.floor(Math.min(...all) / 1000) * 1000;
    const hi = Math.ceil(Math.max(...all) / 1000) * 1000;
    const span = Math.max(1, hi - lo);
    const xs = Array.from({ length: n }, (_, i) => 40 + i * (282 / Math.max(1, n - 1)));
    const Y = (v) => 220 - ((v - lo) / span) * 200;
    const pts = (arr) => arr.slice(0, n).map((v, i) => xs[i].toFixed(1) + ' ' + Y(v).toFixed(1));

    const fmt = (v) => Number(v).toLocaleString('en-US');
    const q = (a[ci] || 0) - (d[ci] || 0);
    const cap = D.num(sc.capacity);

    return {
      subtitle: `${D.scenario.place || ''}・從 ${(cols[0] || {}).label || ''} 起累計，來了幾輛、過了幾輛`,
      modes: M.map((x, i) => ({
        label: x.label, cls: i === mi ? 'on' : '', on: i === mi ? 'true' : 'false',
        pick: () => this.setState({ m: i, c: null }),
      })),
      arr: 'M' + pts(a).join(' L'),
      dep: 'M' + pts(d).join(' L'),
      area: 'M' + pts(a).join(' L') + ' L' + pts(d).reverse().join(' L') + ' Z',
      selX: xs[ci],
      yaxis: [0, 1, 2, 3, 4].map((k) => ({ y: 24 + k * 50, label: fmt(Math.round(hi - (span * k) / 4)) })),
      xlabels: cols.slice(0, n).map((c, i) => ({ left: Math.round(xs[i]), label: c.label.endsWith(':00') ? c.label : '' })).filter((x) => x.label),
      hits: cols.slice(0, n).map((c, i) => ({
        left: xs[i] - 17,
        aria: `${c.label}：來了 ${a[i]} 輛，過了 ${d[i]} 輛`,
        pick: () => this.setState({ c: i }),
      })),
      readout: `${cols[ci] ? cols[ci].label : ''} 為止：來了 ${fmt(a[ci] || 0)} 輛，過了 ${fmt(d[ci] || 0)} 輛，`
        + (q > 0 ? `還有 ${fmt(q)} 輛在排隊。` : '沒有排隊。'),
      how: `入口每 15 分鐘大約只能過 ${cap.text} ${cap.unit || ''}（${D.labelText(cap.label)}），所以藍線斜率有上限。`
        + '紅線比藍線陡的時候，車就開始排隊；把一部分車移走，紅線變平，兩線之間的面積就變小。',
    };
  }
}
</script>
</body>
</html>
