<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>入口、最晚到、彈性</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.chip{appearance:none;border:0;border-radius:16px;background:#DEDCDA;color:#3F3935;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.chip.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 2px rgba(255,214,170,.75)}
.chip .sub{color:#5E5650}.chip.on .sub{color:#FFFFFF}
.radio{width:26px;height:26px;border-radius:50%;box-sizing:border-box;border:2px solid #4A4440;background:#FFFFFF;flex:none;display:grid;place-items:center}
.chip.on .radio{border:3px solid #FFFFFF;background:transparent}
.radio i{width:12px;height:12px;border-radius:50%;background:transparent}
.chip.on .radio i{background:#FFFFFF}
/* 最晚到達是三個獨立滾輪：上午下午 2 格、時 12 格、分 60 格，各自上下滑動。
   卡片中間畫一條固定的橘色選取條，列在底下捲過去。 */
.wheel-card{position:relative;background:#FFFFFF;border-radius:26px;box-shadow:0 12px 32px rgba(214,100,40,.13);padding:6px 12px}
.wheel-sel{position:absolute;left:12px;right:12px;top:34px;height:28px;border-radius:12px;background:linear-gradient(180deg,#F6A46C 0%,#EE7A40 55%,#E2582A 100%);box-shadow:inset 0 3px 0 rgba(255,255,255,.3);pointer-events:none}
.wheels{position:relative;z-index:1;display:grid;grid-template-columns:2fr 0.9fr 0.3fr 0.9fr 0.9fr;align-items:center}
/* touch-action:none：觸控交給下面的 pointer 事件自己處理，瀏覽器不要同時捲。
   滑鼠滾輪還是走原生捲動（overflow-y:auto），停下來再由程式對齊格子。 */
.wheel{height:84px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;touch-action:none;-webkit-user-select:none;user-select:none}
.wheel::-webkit-scrollbar{display:none}
.wheel-pad{height:28px}
.wheel-row{appearance:none;border:0;background:transparent;width:100%;height:28px;padding:0;display:flex;align-items:center;justify-content:center;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;font-size:18px;letter-spacing:.1em;color:#EE9A6E;cursor:pointer;font-variant-numeric:tabular-nums}
.wheel-row.on{color:#FFFFFF;font-weight:700}
.wheel-colon{text-align:center;font-size:18px;font-weight:700;color:#FFFFFF;letter-spacing:.1em}
.cta{position:relative;height:58px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(180deg,#56E3FA 0%,#2BD5F6 50%,#1CC3EC 100%);box-shadow:0 6px 0 #2C8FB2,0 14px 24px rgba(20,140,180,.22);color:#1E4A5E;font:900 19px/1 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.13em;text-decoration:none;overflow:hidden}
.cta::before{content:'';position:absolute;left:12px;right:12px;top:5px;height:22px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.14));pointer-events:none}
.cta:hover{color:#0B3A4A;filter:brightness(1.04)}
.tab{display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:.1em;color:#4F4F4F;text-decoration:none}
.tab+.tab{box-shadow:inset 1px 0 0 #ECE7E3}
.tab.on{color:#F07848}
.tab:hover{color:#F07848}
</style>
</helmet>
<div class="screen has-tabs" style="position: relative; font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei', system-ui, sans-serif; color: #3A2418; background: radial-gradient(190px 120px at 50% 672px, rgba(239,137,62,.95) 0%, rgba(239,137,62,.5) 45%, rgba(239,137,62,0) 100%), radial-gradient(240px 300px at 50% 560px, rgba(244,165,105,.5), rgba(244,165,105,0) 100%), linear-gradient(180deg, #FFFFFF 0px, #FFFFFF 50px, #FEF9F5 150px, #FFF4EE 200px, #FBE8D9 300px, #FADCC4 400px, #F8D5B9 450px, #F8CFB1 500px, #F8CDAB 550px, #F9CEAE 600px, #F9D6BA 650px, #FCE3CF 700px, #FEF5EE 750px, #FFFFFF 800px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 30px">
    <p style="margin: 0; font-size: 14px; letter-spacing: 0.14em; color: #8A3A18">第 1 步，共 2 步</p>
    <a href="Menu.dc.html" aria-label="開啟選單" style="width: 48px; height: 48px; display: grid; place-items: center; color: #F07848">
      <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 2h22M2 12h22M2 22h22"></path></svg>
    </a>
  </div>
  <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0 0 0 14px; font-size: 18px; font-weight: 500; letter-spacing: 0.14em; color: #3A2A22">你從哪裡進內湖</h2>
    <div style="background: #FFFFFF; border-radius: 26px; box-shadow: 0 12px 32px rgba(214,100,40,.13); padding: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <button type="button" class="chip {{r.cls}}" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="height: 46px; font-size: 17px; letter-spacing: 0.14em">{{r.label}}</button>
      </sc-for>
    </div>
    <h2 style="margin: 8px 0 0 14px; font-size: 18px; font-weight: 500; letter-spacing: 0.14em; color: #3A2A22">最晚幾點要到公司</h2>
    <div class="wheel-card">
      <div class="wheel-sel" aria-hidden="true"></div>
      <div class="wheels">
        <div class="wheel" id="w-ap" role="listbox" aria-label="上午或下午">
          <div class="wheel-pad" aria-hidden="true"></div>
          <sc-for list="{{apCol}}" as="o" hint-placeholder-count="2">
            <button type="button" class="wheel-row {{o.cls}}" role="option" aria-selected="{{o.on}}" onClick="{{o.pick}}">{{o.text}}</button>
          </sc-for>
          <div class="wheel-pad" aria-hidden="true"></div>
        </div>
        <div class="wheel" id="w-h" role="listbox" aria-label="幾點">
          <div class="wheel-pad" aria-hidden="true"></div>
          <sc-for list="{{hCol}}" as="o" hint-placeholder-count="3">
            <button type="button" class="wheel-row {{o.cls}}" role="option" aria-selected="{{o.on}}" onClick="{{o.pick}}">{{o.text}}</button>
          </sc-for>
          <div class="wheel-pad" aria-hidden="true"></div>
        </div>
        <span class="wheel-colon" aria-hidden="true">:</span>
        <div class="wheel" id="w-m" role="listbox" aria-label="幾分">
          <div class="wheel-pad" aria-hidden="true"></div>
          <sc-for list="{{mCol}}" as="o" hint-placeholder-count="2">
            <button type="button" class="wheel-row {{o.cls}}" role="option" aria-selected="{{o.on}}" onClick="{{o.pick}}">{{o.text}}</button>
          </sc-for>
          <div class="wheel-pad" aria-hidden="true"></div>
        </div>
        <span></span>
      </div>
      <p class="sr-only" aria-live="polite" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap">{{dlAria}}</p>
    </div>
    <h2 style="margin: 8px 0 0 14px; font-size: 18px; font-weight: 500; letter-spacing: 0.14em; color: #3A2A22">你的時間有多少彈性</h2>
    <div style="background: #FFFFFF; border-radius: 26px; box-shadow: 0 12px 32px rgba(214,100,40,.13); padding: 12px 18px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{flex}}" as="f" hint-placeholder-count="4">
        <button type="button" class="chip {{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="min-height: 52px; padding: 6px 16px; display: flex; align-items: center; gap: 16px; text-align: left">
          <span class="radio" aria-hidden="true"><i></i></span>
          <span style="display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 17px; font-weight: 500; letter-spacing: 0.14em">{{f.label}}</span>
            <span class="sub" style="font-size: 11.5px; letter-spacing: 0.08em">{{f.note}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>
  <div class="cta-bar sticky"><a class="cta" href="Reasons.dc.html">下一步</a></div>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #FFFFFF; box-shadow: 0 -1px 0 #ECE7E3, 0 -6px 16px rgba(120,60,20,.04); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <a class="tab on" href="Today.dc.html">今日</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // 入口、最晚到達、彈性三組選項全部來自題目 JSON（decide.setup），換題不用改這裡
  state = {
    row: (D.setup.rows || [])[0],
    dl: 0,
    flex: ((D.setup.flex || [])[0] || {}).id,
    ...app.load('Setup')
  };
  save(p) { this.setState(p); app.save('Setup', { ...this.state, ...p }); }

  // ---- 最晚到達：三個獨立滾輪（上午下午 2 格、時 12 格、分 60 格）----
  // 滑動一律自己接 pointer 事件，手指和滑鼠走同一套：按住就 1:1 跟著走，放開才對齊最近一格。
  // 原生捲動只留給滑鼠滾輪（touch-action: none 讓瀏覽器不要插手觸控）。
  ROW = 28;
  WHEELS = ['w-ap', 'w-h', 'w-m'];
  LEN = { 'w-ap': 2, 'w-h': 12, 'w-m': 60 };
  el(id) { return typeof document === 'object' && document.getElementById ? document.getElementById(id) : null; }
  // 自動檢查是在 Node 裡跑的，沒有 DOM 也沒有 rAF
  next(fn) { if (typeof requestAnimationFrame === 'function') requestAnimationFrame(fn); }

  /** 'HH:MM' → 當天第幾分鐘 */
  mins(t) { const [h, m] = String(t).split(':').map(Number); return h * 60 + m; }

  /**
   * 使用者挑的時間 → 要用哪一份 plan。
   * 取「不晚於使用者設定」的最後一個時段：寧可算得保守，也不要讓人遲到。
   * 比所有時段都早（資料給不出建議）時退回最早的那一個。
   */
  dlFor(at) {
    const dls = D.setup.deadlines || [];
    if (!dls.length) return 0;
    const x = this.mins(at);
    let best = -1;
    dls.forEach((t, i) => { if (this.mins(t) <= x && (best < 0 || this.mins(t) > this.mins(dls[best]))) best = i; });
    return best < 0 ? 0 : best;
  }

  /** 三欄的格子位置 → 'HH:MM' */
  timeOf(idx) {
    const h = (idx['w-h'] + 1) % 12 + (idx['w-ap'] === 1 ? 12 : 0);
    return String(h).padStart(2, '0') + ':' + String(idx['w-m']).padStart(2, '0');
  }

  /** 拖動途中即時把中間那一列標白，不用等重畫 */
  paint(el, i) {
    const rows = el.querySelectorAll('.wheel-row');
    for (let k = 0; k < rows.length; k++) rows[k].classList.toggle('on', k === i);
  }

  /** 把某一欄停在第 i 格並存起來 */
  land(id, i) {
    const el = this.el(id);
    const n = this.LEN[id];
    i = Math.max(0, Math.min(n - 1, i));
    if (el) {
      this.paint(el, i);
      if (Math.abs(el.scrollTop - i * this.ROW) > 1) el.scrollTo({ top: i * this.ROW, behavior: 'smooth' });
    }
    if (i === this.idx[id]) return;
    const idx = { ...this.idx, [id]: i };
    const at = this.timeOf(idx);
    this.save({ at, dl: this.dlFor(at) });
  }

  /** 其他欄捲到該在的位置（正在被拖的那一欄不要動它） */
  syncWheels(skip) {
    this.WHEELS.forEach((id) => {
      if (id === skip) return;
      const el = this.el(id);
      if (!el) return;
      const want = (this.idx[id] || 0) * this.ROW;
      if (Math.abs(el.scrollTop - want) > 1) el.scrollTop = want;
    });
  }

  componentDidMount() {
    if (!this.el('w-ap')) return;
    this.next(() => this.syncWheels(null));
    this.WHEELS.forEach((id) => {
      const el = this.el(id);
      if (!el) return;
      const st = { down: false, moved: 0, y0: 0, top0: 0, lastY: 0, lastT: 0, v: 0 };
      const now = () => (typeof performance === 'object' ? performance.now() : Date.now());

      el.addEventListener('pointerdown', (e) => {
        st.down = true; st.moved = 0; st.v = 0;
        st.y0 = e.clientY; st.top0 = el.scrollTop;
        st.lastY = e.clientY; st.lastT = now();
        try { el.setPointerCapture(e.pointerId); } catch (err) { /* 舊瀏覽器 */ }
      });
      el.addEventListener('pointermove', (e) => {
        if (!st.down) return;
        const dy = e.clientY - st.y0;
        if (Math.abs(dy) > st.moved) st.moved = Math.abs(dy);
        el.scrollTop = st.top0 - dy;                      // 拖多少走多少，沒有門檻也不會彈回
        const t = now(), dt = t - st.lastT;
        if (dt > 0) st.v = (e.clientY - st.lastY) / dt;   // px/ms，正值＝往下
        st.lastY = e.clientY; st.lastT = t;
        this.paint(el, Math.round(el.scrollTop / this.ROW));
      });
      const end = (e) => {
        if (!st.down) return;
        st.down = false;
        try { el.releasePointerCapture(e.pointerId); } catch (err) { /* 已經放掉了 */ }
        const fling = Math.max(-220, Math.min(220, -st.v * 110));   // 甩一下多走一點，上限約 8 格
        this.land(id, Math.round((el.scrollTop + fling) / this.ROW));
        this.next(() => this.syncWheels(id));
      };
      el.addEventListener('pointerup', end);
      el.addEventListener('pointercancel', end);
      // 拖超過 4px 就不算點擊，免得放開時誤選到手指下面那一列
      el.addEventListener('click', (e) => {
        if (st.moved > 4) { e.preventDefault(); e.stopPropagation(); }
      }, true);

      // 滑鼠滾輪走原生捲動，停下來再對齊
      let t = null;
      el.addEventListener('scroll', () => {
        if (st.down) return;
        this.paint(el, Math.round(el.scrollTop / this.ROW));
        clearTimeout(t);
        t = setTimeout(() => { if (!st.down) this.land(id, Math.round(el.scrollTop / this.ROW)); }, 110);
      }, { passive: true });
    });
  }

  /** 直接點某一格 */
  pickCell(id, i) { this.land(id, i); this.next(() => this.syncWheels(id)); }

  renderVals() {
    const S = this.state;
    const rows = (D.setup.rows || []).map((id) => ({ id, label: (D.rowById(id) || {}).name || id }));
    const dls = D.setup.deadlines || [];
    const flex = D.setup.flex || [];
    // 三個滾輪欄位：上午下午 2 格、時 12 格、分 60 格。
    // S.at 是使用者在滾輪上挑的時間；S.dl 仍然是 decide.setup.deadlines 的索引，
    // 由 dlFor() 從 S.at 推出來，所以其他畫面的讀法完全不用動。
    const at = S.at || dls[Math.min(Math.max(0, S.dl | 0), Math.max(0, dls.length - 1))] || '08:30';
    const [H24, MM] = at.split(':').map(Number);
    this.idx = { 'w-ap': H24 < 12 ? 0 : 1, 'w-h': (H24 % 12 || 12) - 1, 'w-m': MM };
    const mark = (i, sel) => ({ cls: i === sel ? 'on' : '', on: i === sel ? 'true' : 'false' });
    const apCol = ['上午', '下午'].map((t, i) => ({ text: t, ...mark(i, this.idx['w-ap']), pick: () => this.pickCell('w-ap', i) }));
    const hCol = Array.from({ length: 12 }, (_, i) => ({ text: String(i + 1).padStart(2, '0'), ...mark(i, this.idx['w-h']), pick: () => this.pickCell('w-h', i) }));
    const mCol = Array.from({ length: 60 }, (_, i) => ({ text: String(i).padStart(2, '0'), ...mark(i, this.idx['w-m']), pick: () => this.pickCell('w-m', i) }));
    const dlAria = (H24 < 12 ? '上午 ' : '下午 ') + at + ' 前到';

    const sel = (cur, id, fn) => ({ cls: cur === id ? 'on' : '', on: cur === id ? 'true' : 'false', pick: fn });
    return {
      rows: rows.map((r) => ({ ...r, ...sel(S.row, r.id, () => this.save({ row: r.id })) })),
      apCol, hCol, mCol, dlAria,
      flex: flex.map((f) => ({ ...f, ...sel(S.flex, f.id, () => this.save({ flex: f.id })) }))
    };
  }
}
</script>
</body>
</html>
