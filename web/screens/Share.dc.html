<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>邀同事一起避開塞車</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.chip{appearance:none;border:0;border-radius:16px;background:#DEDCDA;color:#3F3935;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.chip.off{background:#F4F2F0;color:#8A837E;cursor:not-allowed}
.chip.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 2px rgba(255,214,170,.75)}
.sim{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE;white-space:nowrap}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:62px;border-radius:999px;background:linear-gradient(180deg,#6BEBFA 0%,#2AD4F0 42%,#14B8E2 100%);box-shadow:inset 0 7px 0 rgba(255,255,255,.32),0 7px 0 #1C8DB3,0 18px 28px rgba(20,140,180,.25);color:#0B3A4A;font:900 21px/1 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.14em;text-decoration:none;border:0;cursor:pointer;width:100%}
.ghost{appearance:none;border:0;background:transparent;height:44px;font:500 15px/1 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.12em;color:#8A3A18;cursor:pointer}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
.tab.on{color:#C8481F;font-weight:500}
</style>
</helmet>
<div class="screen has-tabs" style="position: relative; font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 200px at 50% 300px, rgba(240,130,60,.26), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF5EE 160px, #FBE4D3 460px, #F8D6BD 680px, #FFF8F3 844px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 12px">
    <a href="Today.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 15px; letter-spacing: 0.1em; color: #8A3A18; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"></path></svg>今日
    </a>
    <a href="Menu.dc.html" aria-label="開啟選單" style="width: 48px; height: 48px; display: grid; place-items: center; color: #D2532A">
      <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 2h26M2 12h26M2 22h26"></path></svg>
    </a>
  </div>
  <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0 0 0 14px; font-size: 22px; font-weight: 900; letter-spacing: 0.12em; color: #5A2410">邀同事一起錯峰</h1>
    <div style="aspect-ratio: 1200 / 630; border-radius: 22px; overflow: hidden; position: relative; box-shadow: 0 16px 34px rgba(214,100,40,.22); background: radial-gradient(90% 120% at 100% 100%, #F6B07E 0%, #F7C9A6 45%, #FDF1E8 100%)">
      <div style="position: absolute; inset: 16px 18px; display: flex; flex-direction: column; justify-content: space-between">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-family: 'Grandstander', 'Noto Sans TC','PingFang TC','Microsoft JhengHei', sans-serif; font-weight: 800; font-size: 20px; color: #D2532A">Traffic Gem</span>
          <sc-if value="{{usesSim}}" hint-placeholder-val="{{ true }}"><span class="sim">{{simBadge}}</span></sc-if>
        </div>
        <p style="margin: 0; font-size: 16px; font-weight: 900; line-height: 1.6; letter-spacing: 0.04em; color: #5A2410">{{text}}</p>
        <p style="margin: 0; font-size: 11px; letter-spacing: 0.06em; color: #6B3A20">{{footer}}</p>
      </div>
    </div>
    <h2 style="margin: 4px 0 0 14px; font-size: 16px; font-weight: 500; letter-spacing: 0.14em; color: #3A2A22">選一張卡片</h2>
    <div style="background: #FFFFFF; border-radius: 26px; box-shadow: 0 12px 32px rgba(214,100,40,.13); padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{tpls}}" as="t" hint-placeholder-count="3">
        <button type="button" class="chip {{t.cls}}" aria-pressed="{{t.on}}" disabled="{{t.disabled}}" onClick="{{t.pick}}" style="min-height: 50px; padding: 6px 18px; text-align: left; font-size: 16px; font-weight: 500; letter-spacing: 0.1em">{{t.title}}<span style="display: block; font-size: 11.5px; font-weight: 400; letter-spacing: 0.04em; opacity: .75">{{t.note}}</span></button>
      </sc-for>
    </div>
    <p style="margin: 0 14px; font-size: 12.5px; line-height: 1.6; color: #6B4A3A">{{basis}}</p>
  </div>
  <a href="Menu.dc.html" aria-label="開啟選單" style="position: absolute; top: 21px; right: 15px; width: 48px; height: 48px; display: grid; place-items: center; color: #F07848">
    <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 2h22M2 12h22M2 22h22"></path></svg>
  </a>

  <h1 style="position: absolute; top: 103px; left: 28px; margin: 0; font-size: 21px; font-weight: 900; line-height: 30px; letter-spacing: 0.15em; color: #6b4a3a">邀同事一起避開塞車</h1>

  <figure aria-label="分享卡預覽" style="position: absolute; top: 143px; left: 17px; right: 17px; height: 172px; margin: 0; border-radius: 24px; background: linear-gradient(150deg, #FDF0E7 0%, #FFFCFB 22%, #FFF8F2 48%, #FCE0CB 74%, #F7B585 100%); box-shadow: 0 10px 30px rgba(214,110,50,.16); overflow: hidden">
    <img src="/_blob/3e63621b4ee8957d116141f41b79f155" alt="Traffic Gem" style="position: absolute; top: 15px; left: 20px; width: 140px; height: 27px; mix-blend-mode: multiply">
    <p aria-live="polite" style="position: absolute; top: 60px; left: 40px; right: 16px; margin: 0; font-size: 14.5px; font-weight: 700; line-height: 25px; letter-spacing: 0.02em; color: #2A0100; white-space: pre-line">{{cardText}}</p>
    <p style="position: absolute; right: 27px; bottom: 13px; margin: 0; font-size: 11.5px; letter-spacing: 0.06em; color: #3A1A10">{{pill}}<span style="letter-spacing: 0.69px">・</span>{{route}}</p>
  </figure>

  <h2 style="position: absolute; top: 347px; left: 27px; margin: 0; font-size: 21px; font-weight: 700; line-height: 20px; letter-spacing: 0.06em; color: #6b4a3a">選一張卡片</h2>
  <div role="group" aria-label="選一張卡片" style="position: absolute; top: 383px; left: 17px; right: 17px; height: 195px; box-sizing: border-box; padding: 20px 20px 0 19px; background: #FFFFFF; border-radius: 24px; box-shadow: 0 10px 30px rgba(214,110,50,.14); display: flex; flex-direction: column; gap: 9px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="3">
      <button type="button" class="chip {{c.cls}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="height: 46px; flex: none; padding: 0 21px; display: flex; align-items: center; text-align: left"><span style="font-size: 15px; font-weight: 700; letter-spacing: 0.06em">{{c.label}}</span></button>
    </sc-for>
  </div>
  <p style="position: absolute; top: 589px; left: 29px; right: 24px; margin: 0; font-size: 12px; line-height: 18px; letter-spacing: 0.03em; color: #4A2A20">卡片上不放任何人數。地點與時間來自你的設定：堤頂大道（北向）、平常 07:45 經過。</p>

  <button type="button" class="cta" onClick="{{share}}" style="top: 691px"><span>{{ctaText}}</span></button>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #FFFFFF; box-shadow: 0 -1px 0 #ECE7E3, 0 -6px 16px rgba(120,60,20,.04); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <a class="tab on" href="Today.dc.html">今日</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  // 卡片文字來自 share.templates，{place}{time}{saved}{origin}{constraint} 由設定與今天的建議代入
  state = { t: 0 };

  renderVals() {
    const t = app.today();
    const p = t.profile;
    const base = t.plan && (t.plan.options || []).find((o) => o.id === t.plan.baseline);
    const rec = t.rec;
    const savedNum = rec ? D.num(rec.saved) : null;

    // 地點優先用 share.places 裡對應到這個入口的那一筆（文字比熱力圖的列名完整）
    const place = ((D.share.places || []).find((x) => x.row === p.rowId) || {}).label
      || (p.entry + (p.entrySub ? '（' + p.entrySub + '）' : ''));

    const fills = {
      place,
      time: base ? base.key : '',
      saved: savedNum && !savedNum.pending ? savedNum.text : '',
      origin: p.origin ? p.origin.label : '',
      constraint: p.constraints.length ? (p.constraints[0].share_text || p.constraints[0].label) : '',
    };
    // 今天沒有推薦（建議＝平常）時，不能選「錯峰可以少塞多久」
    if (rec && t.plan && rec.id === t.plan.baseline) fills.saved = '';

    const all = (D.share.templates || []).map((tpl) => {
      const missing = (tpl.needs || []).filter((k) => !fills[k]);
      const text = (tpl.text || '').replace(/\{(\w+)\}/g, (_, k) => fills[k] || '');
      // 卡片用到的數字是不是模擬的（saved 來自 assumed/sim 的欄位）
      const sim = (tpl.needs || []).includes('saved') && !!(rec && rec.saved && rec.saved.sim);
      return { ...tpl, text, sim, missing };
    });
    const usable = all.filter((x) => !x.missing.length);
    const ti = Math.min(this.state.t, Math.max(0, all.length - 1));
    const cur = all[ti] && !all[ti].missing.length ? all[ti] : usable[0];

    return {
      text: cur ? cur.text : '目前的設定還湊不出可以分享的卡片。',
      usesSim: !!(cur && cur.sim),
      simBadge: D.share.sim_badge || '含模擬資料',
      footer: D.share.footer && D.share.footer.indexOf('[') < 0
        ? D.share.footer
        : '內科晨峰・挑一個比較不塞的時段 → ' + location.href.split('#')[0],
      basis: `卡片上不放任何人數。地點與時間來自你的設定：${place}${base ? '、平常 ' + base.key + ' 經過' : ''}。`,
      share: () => cur && app.share(cur.text),
      saveImg: () => cur && app.saveCard(cur.text, cur.sim),
      tpls: all.map((x, i) => ({
        title: x.title,
        // needs 缺欄位就不能選這張（契約規定）
        note: x.missing.length ? '需要先在設定補上：' + x.missing.join('、') : '',
        disabled: x.missing.length > 0,
        cls: cur && x.id === cur.id ? 'on' : x.missing.length ? 'off' : '',
        on: cur && x.id === cur.id ? 'true' : 'false',
        pick: () => { if (!x.missing.length) this.setState({ t: i }); },
      })),
    };
  }
}
</script>
</body>
</html>
