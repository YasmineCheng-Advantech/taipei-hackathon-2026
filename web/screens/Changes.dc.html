<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>數據指向那些改變</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.chg{display:flex;flex-direction:column;gap:9px;box-sizing:border-box;padding:13px 18px 14px 20px;background:#FFFFFF;border-radius:24px;box-shadow:0 10px 30px rgba(214,110,50,.13);text-decoration:none;color:#4C4C4C}
.chg:hover{color:#4C4C4C;box-shadow:0 12px 32px rgba(214,110,50,.22)}
.chg:focus-visible{outline:3px solid #1E4A5E;outline-offset:2px}
.state{padding:2px 9px;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.04em;white-space:nowrap;background:#F1EEEB;color:#6E6A66}
.state.sim{color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE}
.tab{display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:.1em;color:#4F4F4F;text-decoration:none}
.tab+.tab{box-shadow:inset 1px 0 0 #ECE7E3}
.tab.on{color:#F07848}
.tab:hover{color:#F07848}
</style>
</helmet>
<div class="screen has-tabs" style="position: relative; font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei', system-ui, sans-serif; color: #4A4846; background: radial-gradient(190px 120px at 50% 672px, rgba(239,137,62,.95) 0%, rgba(239,137,62,.5) 45%, rgba(239,137,62,0) 100%), radial-gradient(240px 300px at 50% 560px, rgba(244,165,105,.5), rgba(244,165,105,0) 100%), linear-gradient(180deg, #FFFFFF 0px, #FFFFFF 50px, #FEF9F5 150px, #FFF4EE 200px, #FBE8D9 300px, #FADCC4 400px, #F8D5B9 450px, #F8CFB1 500px, #F8CDAB 550px, #F9CEAE 600px, #F9D6BA 650px, #FCE3CF 700px, #FEF5EE 750px, #FFFFFF 800px)">
  <div style="display: flex; align-items: center; gap: 10px; padding: 21px 15px 0 22px">
    <a href="City.dc.html" aria-label="回數據依據" style="flex: none; width: 44px; height: 44px; display: grid; place-items: center; color: #F07848">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 10px rgba(0,0,0,.08); display: grid; place-items: center">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5L4.5 7 9 11.5"></path></svg>
      </span>
    </a>
    <h1 style="flex: 1 1 auto; margin: 0; min-height: 34px; box-sizing: border-box; padding: 0 12px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 3px 12px rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 400; letter-spacing: 0.14em; color: #4C4C4C">{{title}}</h1>
    <a href="Menu.dc.html" aria-label="開啟選單" style="flex: none; width: 48px; height: 48px; display: grid; place-items: center; color: #F07848">
      <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 2h22M2 12h22M2 22h22"></path></svg>
    </a>
  </div>

  <div style="padding: 16px 16px 0 18px; display: flex; flex-direction: column; gap: 10px">
    <sc-for list="{{items}}" as="c" hint-placeholder-count="5">
      <a class="chg" href="{{c.href}}">
        <span style="display: flex; align-items: baseline; flex-wrap: wrap; column-gap: 10px; row-gap: 2px">
          <b style="font-size: 15px; font-weight: 700; line-height: 22px; letter-spacing: 0.05em; color: #4C4C4C">{{c.title}}</b>
          <span style="font-size: 12px; line-height: 18px; letter-spacing: 0.05em; color: #5E5A57">{{c.who}}</span>
          <span class="state {{c.stateCls}}">{{c.state}}</span>
        </span>
        <span style="display: block; padding: 8px 13px; border-radius: 12px; background: #FFF6EF; font-size: 12px; line-height: 18px; letter-spacing: 0.02em; color: #4F4842"><b style="font-weight: 700; color: #4E1408; margin-right: 6px">依據</b>{{c.why}}</span>
      </a>
    </sc-for>
    <p style="margin: 2px 4px 0; font-size: 12px; line-height: 1.7; letter-spacing: 0.02em; color: #75716E">{{disclaimer}}</p>
  </div>

  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #FFFFFF; box-shadow: 0 -1px 0 #ECE7E3, 0 -6px 16px rgba(120,60,20,.04); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <a class="tab" href="Today.dc.html">今日</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    // 政策建議全部來自題目 JSON 的 city.actions，程式不寫死任何一條。
    // 跨縣市那幾條靠「出發地區」才站得住，v2 拿掉出發地區後沒有資料支撐，所以不列。
    const actions = (D.city.actions || []).filter((a) => !a.cross_agency);
    // 每一條配一張能佐證它的分析圖；沒有對應的就回熱力圖
    const PAGE = { flex: 'Scenario', care: 'Tradeoff', shuttle: 'EntryMap', signal: 'Ranking' };

    return {
      title: '數據指向那些改變',
      disclaimer: D.city.disclaimer || '這些是依資料整理出的建議，不代表市府承諾。',
      items: actions.map((a) => {
        const s = D.num(a.support);
        // 「尚無資料」「含模擬資料」依實際資料判斷，不寫死在文字裡
        const state = s.pending ? '尚無資料' : s.sim ? '含模擬資料' : '真實資料';
        return {
          title: a.title,
          who: (a.depts || []).join('・'),
          why: a.why,
          state,
          stateCls: s.sim && !s.pending ? 'sim' : '',
          href: (PAGE[a.id] || 'Heatmap') + '.dc.html',
        };
      }),
    };
  }
}
</script>
</body>
</html>
