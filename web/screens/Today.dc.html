<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>今日推薦</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.sim{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE;white-space:nowrap}
/* 斜線紋路只代表模擬資料（.hatch），不是每一格都有 */
.cell{appearance:none;border:0;padding:0;position:relative;height:26px;border-radius:6px;cursor:pointer;box-shadow:inset 0 0 0 1.5px rgba(255,180,130,.45),inset 0 -2px 0 rgba(0,0,0,.08),inset 0 2px 0 rgba(255,255,255,.18)}
.cell.pick{box-shadow:0 0 0 2.5px #FFFFFF,0 0 0 4px #1E4A5E}
.cell.gap{background:transparent;cursor:default;box-shadow:inset 0 0 0 1.5px rgba(216,198,184,.9)}
.cell:focus-visible{outline:3px solid #1E4A5E;outline-offset:2px}
.go{box-sizing:border-box;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:72px;background:#FFFFFF;border-radius:22px;box-shadow:0 10px 26px rgba(214,110,50,.12);text-decoration:none;color:#4C4C4C}
.go:hover{color:#4C4C4C;box-shadow:0 12px 30px rgba(214,110,50,.2)}
.cta{position:relative;height:58px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(180deg,#56E3FA 0%,#2BD5F6 50%,#1CC3EC 100%);box-shadow:0 6px 0 #2C8FB2,0 14px 24px rgba(20,140,180,.22);color:#1E4A5E;font:900 19px/1 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.13em;text-decoration:none;overflow:hidden}
.cta::before{content:'';position:absolute;left:12px;right:12px;top:5px;height:22px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.14));pointer-events:none}
.cta span{position:relative}
.cta:hover{color:#1E4A5E;filter:brightness(1.04)}
.tab{display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:.1em;color:#4F4F4F;text-decoration:none}
.tab+.tab{box-shadow:inset 1px 0 0 #ECE7E3}
.tab.on{color:#F07848}
.tab:hover{color:#F07848}
</style>
</helmet>
<div class="screen has-tabs" style="position: relative; font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei', system-ui, sans-serif; color: #4A4846; background: linear-gradient(180deg, #FFFFFF 0px, #FFFFFF 90px, #F9D0B0 350px, #FBE0CB 450px, #FDEFE4 550px, #FFF6EF 600px, #FFFFFF 700px)">

  <div style="display: flex; align-items: center; gap: 8px; padding: 22px 15px 0 27px">
    <p style="flex: 1 1 auto; margin: 0; min-height: 34px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 3px 12px rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center; gap: 9px; font-size: 13.5px; letter-spacing: 0.1em; color: #4C4C4C">
      <svg width="12" height="13" viewBox="0 0 12 13" fill="none" stroke="#4C4C4C" stroke-width="1.4" aria-label="已鎖定今天的設定" role="img" style="flex: none"><rect x="1" y="5.5" width="10" height="6.8" rx="1.6"></rect><path d="M3.3 5.5V3.9a2.7 2.7 0 0 1 5.4 0v1.6"></path></svg>
      <span>{{pill}}</span>
    </p>
    <a href="Menu.dc.html" aria-label="開啟選單" style="flex: none; width: 48px; height: 48px; display: grid; place-items: center; color: #F07848">
      <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 2h22M2 12h22M2 22h22"></path></svg>
    </a>
  </div>

  <section aria-label="今天的建議" style="position: relative; margin-top: 24px; padding: 42px 26px 26px; border-radius: 70px 70px 0 0; background: radial-gradient(170px 120px at 50% 0px, rgba(238,128,48,.95), rgba(238,128,48,0) 100%), linear-gradient(180deg, #F3A066 0px, #F4AE7C 110px, #F6BF96 200px, #F8CBA8 280px, rgba(249,208,176,0) 360px)">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <p style="margin: 0; font-size: 17px; font-weight: 700; line-height: 24px; letter-spacing: 0.08em; color: #FFFFFF">{{kicker}}</p>
      <sc-if value="{{heroSim}}"><span class="sim">含模擬資料</span></sc-if>
    </div>
    <div style="margin-top: 2px; display: flex; align-items: baseline; gap: 13px; flex-wrap: wrap">
      <p style="margin: 0; font-family: 'Grandstander', 'Noto Sans TC','PingFang TC','Microsoft JhengHei', sans-serif; font-weight: 800; font-size: 58px; line-height: 64px; letter-spacing: 0.01em; color: #FFFFFF; font-variant-numeric: tabular-nums">{{heroTime}}</p>
      <p style="margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.08em; color: #FFFFFF">經過{{entry}} <span style="font-size: 13px; font-weight: 400">{{entrySub}}</span></p>
    </div>
    <p aria-live="polite" style="margin: 2px 0 0 2px; font-size: 15px; font-weight: 700; line-height: 24px; letter-spacing: 0.03em; color: #3A0A02">{{heroLine}}</p>

    <div role="group" aria-label="點格子看不同時段" style="margin-top: 13px; display: grid; grid-template-columns: repeat({{nCols}}, minmax(0, 1fr)); gap: 4px">
      <sc-for list="{{strip}}" as="c" hint-placeholder-count="10">
        <button type="button" class="cell {{c.cls}}" data-level="{{c.level}}" aria-label="{{c.aria}}" aria-pressed="{{c.on}}" disabled="{{c.disabled}}" onClick="{{c.pick}}"></button>
      </sc-for>
    </div>
    <div aria-hidden="true" style="margin-top: 6px; display: flex; justify-content: space-between; font-size: 11.5px; letter-spacing: 0.04em; color: #440C00; font-variant-numeric: tabular-nums"><span>{{firstCol}}</span><span>{{lastCol}}</span></div>
    <div aria-hidden="true" style="margin-top: 3px; border-top: 1.5px dashed #E86B4F"></div>
    <p style="margin: 5px 0 0; text-align: right; font-size: 12.5px; letter-spacing: 0.1em; color: #3A0A02">格子越深越塞</p>
    <p style="margin: 8px 0 0; font-size: 12.5px; line-height: 1.65; color: #4A1405">{{stripNote}}</p>
    <p class="live-bar {{live.cls}}" aria-live="polite" style="margin-top: 10px"><span class="dot" aria-hidden="true"></span><span>{{live.text}}</span><span class="note">{{live.note}}</span></p>
  </section>

  <div style="padding: 20px 27px 0; display: flex; flex-direction: column; gap: 12px">
    <a class="go" href="City.dc.html">
      <span style="display: flex; flex-direction: column; gap: 3px">
        <b style="font-size: 15.5px; font-weight: 700; letter-spacing: 0.04em">你的資料，變成協商依據</b>
        <span style="font-size: 12px; letter-spacing: 0.03em; color: #6E6E6E">{{claimedText}}</span>
      </span>
      <svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="#F8652F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l6 6-6 6"></path></svg>
    </a>
    <a class="go" href="Share.dc.html">
      <span style="display: flex; flex-direction: column; gap: 3px">
        <b style="font-size: 15.5px; font-weight: 700; letter-spacing: 0.04em">邀請同事一起避開塞車</b>
        <span style="font-size: 12px; letter-spacing: 0.03em; color: #6E6E6E">分享給好朋友也可以 :)</span>
      </span>
      <svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="#F8652F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l6 6-6 6"></path></svg>
    </a>
    <p style="margin: 2px 2px 0; font-size: 12.5px; line-height: 1.6; color: #6E6E6E">不同的人會拿到不同的建議，避免大家擠到同一個時段。<a href="Tradeoff.dc.html">為什麼推薦這個時段 →</a></p>
    <a class="cta" href="Setup.dc.html" style="margin-top: 10px"><span>產生今日推薦</span></a>
  </div>

  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #FFFFFF; box-shadow: 0 -1px 0 #ECE7E3, 0 -6px 16px rgba(120,60,20,.04); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <a class="tab on" href="Today.dc.html" aria-current="page">今日</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1000}}'>
class Component extends DCLogic {
  usesLive = true; // 建議不受即時影響，但下面的「現在」要跟著更新

  constructor() {
    super();
    // 依使用者設定挑一份 plan，並照時間彈性篩掉不能選的時段
    const t = app.today();
    this.t = t;
    // 色條的一格 = 熱力圖的一個時段欄；預設選在建議的那一格
    const recKey = t.rec && t.rec.key;
    const recCol = D.cols.findIndex((c) => c.label === recKey);
    this.state = { sel: recCol >= 0 ? recCol : 0 };
  }

  /** 第 i 欄對應的時段選項（沒有就是沒資料的欄） */
  optAt(i) {
    const label = D.cols[i] && D.cols[i].label;
    return this.t.options.find((o) => o.key === label);
  }

  /** 選到的那一格要顯示的一句話：照實說會早到或晚到，不只講省幾分 */
  lineFor(o) {
    const { profile: p, plan } = this.t;
    if (!o) return '這個時段沒有資料，我們留白，不補數字。';
    if (o.status === 'peak') return `尖峰，${p.deadline} 前可能會遲到`;
    if (o.status === 'late') return `${p.deadline} 前可能會遲到`;
    if (plan && o.id === plan.baseline) return `這是你平常經過的時段，${o.arrive} 到公司`;

    const saved = D.num(o.saved);
    const early = D.num(o.arrive_early);
    const sv = Number(saved.value);
    // saved 可能是負的（比平常慢的時段），不能一律寫成「路上少 N 分」
    const savedText = saved.pending ? '省下的分鐘待補'
      : sv > 0 ? `路上少 ${saved.text} 分`
      : sv < 0 ? `路上多 ${saved.range ? `${-saved.hi}–${-saved.lo}` : -sv} 分`
      : '路上時間和平常差不多';
    const earlyText = early.value > 0 ? `比平常早 ${early.value} 分到公司`
      : early.value < 0 ? `比平常晚 ${-early.value} 分到公司` : '和平常一樣時間到';
    return `${savedText}，${earlyText}`;
  }

  renderVals() {
    const { profile: p, plan } = this.t;
    const layer = D.layerOf(D.collective.layer || 'speed');
    const ri = D.rowIndex(p.rowId);
    const claimed = D.num(D.city.claimed);
    // 日期用使用者裝置的今天；建議一天鎖定一份，不會一直往後延
    const d = new Date();
    const today = `${d.getMonth() + 1}/${d.getDate()}`;
    const pill = `${today}：${p.entry}・${p.deadline} 前到`;

    if (!plan || !this.t.options.length) {
      // 這個入口／最晚到達沒有資料時不要整頁壞掉
      return {
        pill, kicker: '今天沒有建議', heroTime: '—', entry: p.entry, entrySub: p.entrySub,
        heroSim: false, heroLine: '這個入口目前沒有資料，我們留白，不補數字。',
        nCols: D.cols.length, strip: [], firstCol: '', lastCol: '', stripNote: '',
        claimedText: '', live: { cls: 'is-error', text: '', note: '' },
      };
    }

    const sel = this.optAt(this.state.sel);
    const isRec = !!(this.t.rec && sel && sel.id === this.t.rec.id);
    const noBetter = this.t.rec && this.t.rec.id === plan.baseline;
    const recCol = this.t.rec ? D.cols.findIndex((c) => c.label === this.t.rec.key) : -1;
    const baseCol = D.cols.findIndex((c) => {
      const o = this.t.options.find((x) => x.key === c.label);
      return o && o.id === plan.baseline;
    });

    const live = D.live;
    const here = D.liveSpeed(p.rowId);
    // 要比就跟「現在這個時間」的平日平均比；拿被選中那一格的平均來比是兩個不同時段，會誤導
    const nowCol = D.currentColIndex();
    const nowTypical = nowCol >= 0 ? D.cell(layer.id, ri, nowCol) : { gap: true };
    const liveBar = live.state === 'ok' && here
      ? {
          cls: live.stale ? 'is-stale' : '',
          text: `現在 ${D.hhmm(live.updated_at)}・${p.entry} ${here.text}`,
          note: here.caption
            || (!D.isPeakNow() ? `現在不是${D.meta.days || '平日'}晨峰；建議是依${D.meta.days || '平日'}平均算的`
            : !nowTypical.gap ? `${D.cols[nowCol].label} 這一格的${D.meta.days || '平日'}平均是 ${nowTypical.v} km/h` : ''),
        }
      : {
          cls: 'is-error',
          text: live.state === 'loading' ? '正在取得即時路況…' : '暫時取不到即時路況',
          note: '今天的建議是依歷史資料算的，不受影響',
        };

    return {
      pill,
      kicker: noBetter ? '今天照平常時間走就好' : isRec ? '今天建議你' : '你挑的時段',
      heroTime: (D.cols[this.state.sel] && D.cols[this.state.sel].label) || '—',
      entry: p.entry,
      entrySub: p.entrySub,
      heroSim: !!(sel && sel.saved && sel.saved.sim),
      heroLine: this.lineFor(sel),
      nCols: D.cols.length,
      firstCol: D.cols[0] && D.cols[0].label,
      lastCol: D.cols[D.cols.length - 1] && D.cols[D.cols.length - 1].label,
      // 省下的分鐘是「只有你改時間」的估計，每天路況不同，所以給區間（CLAUDE.md）
      stripNote: `色條是${p.entry}${p.entrySub} 的${layer.name}。省下的分鐘是「只有你改時間」的估計，每天路況不同，所以給區間。`,

      strip: D.cols.map((c, i) => {
        const cell = D.cell(layer.id, ri, i);
        const o = this.optAt(i);
        const mark = i === recCol ? '（建議）' : i === baseCol ? '（平常）' : '';
        return {
          level: cell.gap ? false : D.level(layer, cell.v),
          cls: (cell.gap ? 'gap' : '') + (cell.sim ? ' hatch' : '') + (i === this.state.sel ? ' pick' : ''),
          on: i === this.state.sel ? 'true' : 'false',
          disabled: !o,
          aria: c.label + ' 經過' + mark,
          pick: () => { if (o) this.setState({ sel: i }); },
        };
      }),

      live: liveBar,
      // 人數一律向後端拿；沒有就「尚無資料」，不放模擬值
      claimedText: '匿名意向登記：' + (claimed.pending ? '尚無資料' : claimed.text + ' 人'),
    };
  }
}
</script>
</body>
</html>
