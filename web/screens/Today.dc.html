<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>今日推薦</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.sim{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE;white-space:nowrap}
/* 斜線紋路只代表模擬資料（.hatch），不是每一格都有 */
.cell{position:relative;height:30px;border-radius:9px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),inset 0 2px 0 rgba(255,255,255,.45)}
.cell.pick{box-shadow:0 0 0 3px #0E6F84,inset 0 -3px 0 rgba(0,0,0,.06)}
.cell.gap{background:transparent;box-shadow:inset 0 0 0 1.5px #D8C6B8}
.opt{appearance:none;border:0;border-radius:18px;background:#EFEDEB;color:#3A2418;font-family:'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;cursor:pointer;width:100%;text-align:left;box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.opt.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 2px rgba(255,214,170,.75)}
.opt.on .meta{color:#FFFFFF}
.opt.off{background:#F4F2F0;color:#6B6460;cursor:not-allowed}
.meta{color:#5E5650}
.cta{display:flex;align-items:center;justify-content:center;height:62px;border-radius:999px;background:linear-gradient(180deg,#6BEBFA 0%,#2AD4F0 42%,#14B8E2 100%);box-shadow:inset 0 7px 0 rgba(255,255,255,.32),0 7px 0 #1C8DB3,0 18px 28px rgba(20,140,180,.25);color:#0B3A4A;font:900 21px/1 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.14em;text-decoration:none}
.cta:hover{color:#0B3A4A;filter:brightness(1.04)}
.go{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:12px 20px;background:#FFFFFF;border-radius:22px;box-shadow:0 10px 26px rgba(214,100,40,.12);text-decoration:none;color:#3A2418}
.go:hover{color:#3A2418;box-shadow:0 12px 30px rgba(214,100,40,.2)}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
.tab.on{color:#C8481F;font-weight:500}
</style>
</helmet>
<div class="screen has-tabs" style="position: relative; font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 240px at 50% 980px, rgba(240,130,60,.28), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF5EE 160px, #FBE4D3 520px, #F8D6BD 900px, #FBE6D6 1150px, #FFF8F3 1190px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 30px">
    <p style="margin: 0; font-size: 14px; letter-spacing: 0.12em; color: #8A3A18">{{header}}</p>
    <a href="Menu.dc.html" aria-label="開啟選單" style="width: 48px; height: 48px; display: grid; place-items: center; color: #D2532A">
      <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 2h26M2 12h26M2 22h26"></path></svg>
    </a>
  </div>

  <div style="padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <section aria-label="今天的建議" style="background: #FFFFFF; border-radius: 28px; box-shadow: 0 14px 34px rgba(214,100,40,.16); padding: 20px 20px 18px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <p style="margin: 0; font-size: 15px; letter-spacing: 0.12em; color: #6B4A3A">{{kicker}}</p>
        <sc-if value="{{heroSim}}"><span class="sim">含模擬資料</span></sc-if>
      </div>
      <div style="display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap">
        <p style="margin: 0; font-family: 'Grandstander', 'Noto Sans TC','PingFang TC','Microsoft JhengHei', sans-serif; font-weight: 800; font-size: 56px; line-height: 1.05; color: #0E6F84">{{heroTime}}</p>
        <p style="margin: 0; font-size: 18px; font-weight: 700; letter-spacing: 0.06em">經過{{entry}} <span style="font-size: 13px; font-weight: 400; color: #6B4A3A">{{entrySub}}</span></p>
      </div>
      <p style="margin: 0; font-size: 15px; line-height: 1.6">{{heroSaved}}<span style="color: #D9B8A2; margin: 0 8px">•</span>{{heroEarly}}</p>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #6B4A3A">{{reason}}</p>
      <p class="live-bar {{live.cls}}" aria-live="polite" style="margin-top: 8px"><span class="dot" aria-hidden="true"></span><span>{{live.text}}</span><span class="note">{{live.note}}</span></p>
      <div aria-hidden="true" style="margin-top: 30px; display: grid; grid-template-columns: repeat({{nCols}}, minmax(0, 1fr)); gap: 4px">
        <sc-for list="{{strip}}" as="c" hint-placeholder-count="10">
          <div class="cell {{c.cls}}" data-level="{{c.level}}">
            <sc-if value="{{c.isPick}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%); padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: #40CBE2; color: #0B3A4A">建議</span>
            </sc-if>
            <sc-if value="{{c.isUsual}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%); padding: 1px 8px; border-radius: 999px; font-size: 12px; white-space: nowrap; background: #FFFFFF; color: #6B4A3A; box-shadow: inset 0 0 0 1px #E2CDBE">平常</span>
            </sc-if>
          </div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6B4A3A; font-variant-numeric: tabular-nums"><span>{{firstCol}}</span><span>{{lastCol}}</span></div>
      <p style="margin: 6px 0 0; padding-top: 10px; border-top: 2px dotted #F1DCCD; font-size: 13px; line-height: 1.65; color: #6B4A3A">{{stripNote}}</p>
    </section>

    <h2 style="margin: 10px 0 0 14px; font-size: 18px; font-weight: 500; letter-spacing: 0.14em; color: #3A2A22">自己挑一個時段</h2>
    <div style="background: #FFFFFF; border-radius: 26px; box-shadow: 0 12px 32px rgba(214,100,40,.13); padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="6">
        <button type="button" class="opt {{o.cls}}" aria-pressed="{{o.on}}" disabled="{{o.disabled}}" onClick="{{o.pick}}" style="min-height: 60px; padding: 8px 14px; display: grid; grid-template-columns: 64px 1fr auto; align-items: center; gap: 10px">
          <span style="font-family: 'Grandstander', 'Noto Sans TC','PingFang TC','Microsoft JhengHei', sans-serif; font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums">{{o.key}}</span>
          <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
            <span class="meta" style="font-size: 13px; letter-spacing: 0.04em">{{o.meta}}</span>
            <span aria-hidden="true" style="height: 7px; border-radius: 4px; background: rgba(0,0,0,.06); overflow: hidden"><span style="display: block; height: 7px; width: {{o.barW}}%; background: {{o.barColor}}; border-radius: 4px"></span></span>
          </span>
          <span style="padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; background: {{o.tagBg}}; color: {{o.tagFg}}">{{o.tag}}</span>
        </button>
      </sc-for>
    </div>
    <p style="margin: 0 14px; font-size: 13px; line-height: 1.6; color: #6B4A3A">不同的人會拿到不同的建議，避免大家擠到同一個時段。<a href="Tradeoff.dc.html">為什麼推薦這個時段 →</a></p>


    <a class="go" href="City.dc.html">
      <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px; letter-spacing: 0.08em">你的資料，變成協商依據</b><span style="font-size: 13px; color: #6B4A3A">{{claimedText}}</span></span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#C8481F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"></path></svg>
    </a>
    <a class="go" href="Share.dc.html">
      <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 16px; letter-spacing: 0.08em">邀同事一起錯峰</b><span style="font-size: 13px; color: #6B4A3A">做一張分享卡傳到 LINE</span></span>
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="#C8481F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"></path></svg>
    </a>
  </div>

  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #FFFFFF; box-shadow: 0 -1px 0 #F1E4DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="tab on" href="Today.dc.html" aria-current="page">今日</a>
    <a class="tab" href="City.dc.html">數據</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1190}}'>
class Component extends DCLogic {
  usesLive = true; // 建議不受即時影響，但下面的「現在」要跟著更新

  constructor() {
    super();
    // 依使用者設定挑一份 plan，並照時間彈性篩掉不能選的時段
    const t = app.today();
    this.t = t;
    const opts = t.options;
    const recIndex = Math.max(0, opts.findIndex((o) => t.rec && o.id === t.rec.id));
    this.state = { sel: recIndex };
  }

  renderVals() {
    const { profile: p, plan } = this.t;
    const opts = this.t.options;

    if (!plan || !opts.length) {
      // 這個入口／最晚到達沒有資料時不要整頁壞掉
      return {
        header: '今日・' + (p.entry || '') + '・' + p.deadline + ' 前到',
        kicker: '今天沒有建議', heroTime: '—', entry: p.entry, entrySub: p.entrySub,
        heroSim: false, heroSaved: '', heroEarly: '這個入口目前沒有資料，我們留白，不補數字。',
        reason: '', nCols: D.cols.length, strip: [], firstCol: '', lastCol: '',
        stripNote: '', opts: [], claimedText: '', live: { cls: 'is-error', text: '', note: '' },
      };
    }

    const base = opts.find((o) => o.id === plan.baseline);
    const sel = opts[Math.min(this.state.sel, opts.length - 1)];
    const isRec = this.t.rec && sel.id === this.t.rec.id;
    const noBetter = this.t.rec && this.t.rec.id === plan.baseline;

    const saved = D.num(sel.saved);
    const early = D.num(sel.arrive_early);
    const cost = D.num(sel.cost);
    const maxCost = Math.max(...opts.map((o) => (o.cost && o.cost.value) || 0), 1);

    // 省下的分鐘給區間，同時寫出會早到幾分鐘（CLAUDE.md）
    const earlyText = early.value > 0 ? `比平常早 ${early.value} 分到公司`
      : early.value < 0 ? `比平常晚 ${-early.value} 分到公司` : '和平常一樣時間到';
    const savedText = saved.pending ? '省下的分鐘待補'
      : Number(saved.value) > 0 || saved.range ? `路上少 ${saved.text} 分` : '路上時間和平常差不多';

    const tagOf = (o) => {
      if (o.status === 'peak') return { tag: '尖峰', tagBg: '#FCE4D8', tagFg: '#8A2E0B' };
      if (o.status === 'late') return { tag: '可能遲到', tagBg: '#FCE4D8', tagFg: '#8A2E0B' };
      if (this.t.rec && o.id === this.t.rec.id) return { tag: '建議', tagBg: '#40CBE2', tagFg: '#0B3A4A' };
      if (base && o.id === base.id) return { tag: '平常', tagBg: '#FFFFFF', tagFg: '#4A4440' };
      const s = D.num(o.saved);
      return { tag: '少 ' + s.text + ' 分', tagBg: '#DDF4F8', tagFg: '#0B4F60' };
    };

    // 色帶：使用者那個入口的車速，依圖層門檻上色（程式不碰色碼）
    const layer = D.layerOf(D.collective.layer || 'speed');
    const ri = D.rowIndex(p.rowId);
    const selCol = D.cols.findIndex((c) => c.label === sel.key);
    const baseCol = base ? D.cols.findIndex((c) => c.label === base.key) : -1;

    const live = D.live;
    const here = D.liveAt(p.rowId);
    const typical = selCol >= 0 ? D.cell(layer.id, ri, selCol) : { gap: true };
    const liveBar = live.state === 'ok' && here
      ? {
          cls: live.stale ? 'is-stale' : '',
          text: `現在 ${D.hhmm(live.updated_at)}・${p.entry} ${here.speed} km/h`,
          note: here.low_sample ? `這一分鐘只有 ${here.samples} 輛車有車速，測不準`
            : !D.isPeakNow() ? `現在不是${D.meta.days || '平日'}晨峰；建議是依${D.meta.days || '平日'}平均算的`
            : !typical.gap ? `${sel.key} 這一格的${D.meta.days || '平日'}平均是 ${typical.v} km/h` : '',
        }
      : {
          cls: 'is-error',
          text: live.state === 'loading' ? '正在取得即時路況…' : '暫時取不到即時路況',
          note: '今天的建議是依歷史資料算的，不受影響',
        };

    const claimed = D.num(D.city.claimed);

    return {
      header: '今日・' + p.entry + '・' + p.deadline + ' 前到',
      kicker: noBetter ? '今天照平常時間走就好' : isRec ? '今天建議你' : '你挑的時段',
      heroTime: sel.key,
      entry: p.entry,
      entrySub: p.entrySub,
      heroSim: !!(sel.saved && sel.saved.sim),
      heroSaved: savedText,
      heroEarly: earlyText,
      reason: isRec ? plan.reason || '' : '',
      nCols: D.cols.length,
      firstCol: D.cols[0] && D.cols[0].label,
      lastCol: D.cols[D.cols.length - 1] && D.cols[D.cols.length - 1].label,
      stripNote: `格子越深越塞（${p.entry}${p.entrySub} 的${layer.name}）。省下的分鐘是「只有你改時間」的估計，每天路況不同，所以給區間。`,

      strip: D.cols.map((c, i) => {
        const cell = D.cell(layer.id, ri, i);
        return {
          level: cell.gap ? false : D.level(layer, cell.v),
          cls: (cell.gap ? 'gap' : '') + (cell.sim ? ' hatch' : '') + (i === selCol ? ' pick' : ''),
          isPick: i === selCol,
          isUsual: i === baseCol && i !== selCol,
        };
      }),

      opts: opts.map((o, i) => {
        const off = o.status === 'peak' || o.status === 'full';
        const on = i === this.state.sel;
        const c = D.num(o.cost);
        return {
          key: o.key,
          meta: `${o.arrive} 到公司・路上 ${c.text} 分`,
          barW: Math.round((((o.cost && o.cost.value) || 0) / maxCost) * 100),
          barColor: `var(--ramp-${D.level({ thresholds: [maxCost * 0.35, maxCost * 0.5, maxCost * 0.65, maxCost * 0.85, maxCost], direction: 'high_is_bad' }, (o.cost && o.cost.value) || 0)})`,
          cls: off ? 'off' : on ? 'on' : '', on: on ? 'true' : 'false', disabled: off,
          pick: () => { if (!off) this.setState({ sel: i }); },
          ...tagOf(o),
        };
      }),

      live: liveBar,
      // 人數一律向後端拿；沒有就「尚無資料」，不放模擬值
      claimedText: '匿名意向登記：' + (claimed.pending ? '尚無資料' : claimed.text + ' 人'),
    };
  }
}
</script>
</body>
</html>
