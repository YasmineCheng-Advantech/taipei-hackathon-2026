<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>數據依據・內科晨峰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.card{background:#FFFFFF;border-radius:24px;box-shadow:0 10px 30px rgba(214,110,50,.14)}
.lbl{padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap}
.lbl.calc{background:#FBF0D9;color:#7A5200}
.lbl.sim{background:#FBF0D9;color:#7A5200;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px)}
.cta{position:relative;height:58px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:linear-gradient(180deg,#56E3FA 0%,#2BD5F6 50%,#1CC3EC 100%);box-shadow:0 6px 0 #2C8FB2,0 14px 24px rgba(20,140,180,.22);color:#1E4A5E;font:900 19px/1 'Noto Sans TC','PingFang TC','Microsoft JhengHei',sans-serif;letter-spacing:.13em;text-decoration:none;overflow:hidden}
.cta::before{content:'';position:absolute;left:12px;right:12px;top:5px;height:22px;border-radius:999px;background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.14));pointer-events:none}
.cta span{position:relative}
.cta:hover{color:#1E4A5E;filter:brightness(1.04)}
.tab{display:flex;align-items:center;justify-content:center;font-size:15px;letter-spacing:.1em;color:#4F4F4F;text-decoration:none}
.tab+.tab{box-shadow:inset 1px 0 0 #ECE7E3}
.tab:hover{color:#F07848}
</style>
</helmet>
<div class="screen has-tabs" style="position: relative; display: flex; flex-direction: column; font-family: 'Noto Sans TC','PingFang TC','Microsoft JhengHei', system-ui, sans-serif; color: #4A4846; background: radial-gradient(190px 120px at 50% 672px, rgba(239,137,62,.95) 0%, rgba(239,137,62,.5) 45%, rgba(239,137,62,0) 100%), radial-gradient(240px 300px at 50% 560px, rgba(244,165,105,.5), rgba(244,165,105,0) 100%), linear-gradient(180deg, #FFFFFF 0px, #FFFFFF 50px, #FEF9F5 150px, #FFF4EE 200px, #FBE8D9 300px, #FADCC4 400px, #F8D5B9 450px, #F8CFB1 500px, #F8CDAB 550px, #F9CEAE 600px, #F9D6BA 650px, #FCE3CF 700px, #FEF5EE 750px, #FFFFFF 800px)">
  <div style="display: flex; align-items: center; gap: 8px; padding: 21px 15px 0 22px">
    <a href="Menu.dc.html" aria-label="回選單" style="flex: none; width: 44px; height: 44px; display: grid; place-items: center; color: #F07848">
      <span style="width: 34px; height: 34px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 3px 10px rgba(0,0,0,.08); display: grid; place-items: center">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 2.5L4.5 7 9 11.5"></path></svg>
      </span>
    </a>
    <p style="flex: 1 1 auto; margin: 0; min-height: 34px; box-sizing: border-box; padding: 0 14px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 3px 12px rgba(0,0,0,.07); display: flex; align-items: center; justify-content: center; font-size: 14px; letter-spacing: 0.14em; color: #4C4C4C">數據依據・{{topicTitle}}</p>
    <a href="Menu.dc.html" aria-label="開啟選單" style="flex: none; width: 48px; height: 48px; display: grid; place-items: center; color: #F07848">
      <svg width="26" height="24" viewBox="0 0 26 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M2 2h22M2 12h22M2 22h22"></path></svg>
    </a>
  </div>

  <h1 style="margin: 39px 0 0 28px; font-size: 22px; font-weight: 900; line-height: 32px; letter-spacing: 0.14em; color: #4E1408">目標</h1>

  <section class="card" aria-label="目標" style="margin: 19px 17px 0; box-sizing: border-box; padding: 22px 24px 20px; display: flex; flex-direction: column; gap: 10px">
    <p style="margin: 0; font-size: 15px; line-height: 1.65; color: #3A2418">{{goal.text}}</p>
    <div style="display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px">
      <span style="font-family: 'Inter', 'Noto Sans TC','PingFang TC','Microsoft JhengHei', sans-serif; font-weight: 800; font-size: 48px; line-height: 1.1; color: #0E6F84">{{goal.need}}</span>
      <span style="font-size: 15px; font-weight: 700; color: #3A2418">{{goal.unit}}</span>
    </div>
    <p style="margin: 0; font-size: 12.5px; line-height: 1.75; color: #6B4A3A"><span class="lbl {{goal.cls}}" style="margin-right: 7px">{{goal.labelText}}</span>{{goal.note}}</p>
    <p style="margin: 0; padding-top: 12px; border-top: 2px dotted #F1DCCD; font-size: 13px; line-height: 1.65; color: #6B4A3A">光靠個人換時段做不到，要公司和市府一起調整。下面是我們帶去協商的數據。</p>
  </section>

  <div class="cta-bar"><a class="cta" href="Commute.dc.html"><span>民眾提供的通勤資料</span></a></div>

  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 62px; background: #FFFFFF; box-shadow: 0 -1px 0 #ECE7E3, 0 -6px 16px rgba(120,60,20,.04); display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
    <a class="tab" href="Today.dc.html">今日</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const city = D.city;
    const goal = D.num(city.goal && city.goal.need);
    // 單位像「% 改時段」時，百分號跟著大數字走，後面的字小一號（設計稿的排法）
    const u = goal.unit || '';
    const m = u.match(/^([%％])\s*(.*)$/);
    return {
      topicTitle: D.meta.title || '',
      goal: {
        text: (city.goal && city.goal.text) || '',
        need: goal.text + (m ? m[1] : ''),
        unit: m ? m[2] : u,
        note: goal.note || '',
        labelText: D.labelText(goal.label) + (goal.sim ? '・含模擬資料' : ''),
        cls: goal.sim ? 'sim' : 'calc',
      },
    };
  }
}
</script>
</body>
</html>
