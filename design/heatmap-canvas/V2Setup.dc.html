<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>第一次設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E79}a:hover{color:#123150}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F5F4EF; color: #1A1D21; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 28px 20px 16px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font: 500 12px 'IBM Plex Mono', monospace; letter-spacing: 0.06em; color: #555B63">只要設定一次 · 資料只存在你的手機</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.3">告訴我們你的通勤，<br>我們幫你排出門時間</h1>
</div>

<div role="group" aria-label="從哪裡進內湖" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">1 你從哪裡進內湖</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ents}}" as="e" hint-placeholder-count="4">
<button onClick="{{e.pick}}" aria-pressed="{{e.on}}" style="min-height: 44px; border-radius: 10px; border: 1px solid {{e.border}}; background: {{e.bg}}; color: {{e.fg}}; font: 500 15px 'Noto Sans TC', sans-serif; cursor: pointer">{{e.label}}</button>
</sc-for>
</div>
</div>

<div role="group" aria-label="幾點要到公司" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">2 最晚幾點要到公司</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{deadlines}}" as="d" hint-placeholder-count="4">
<button onClick="{{d.pick}}" aria-pressed="{{d.on}}" style="min-height: 44px; border-radius: 10px; border: 1px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font: 600 15px 'IBM Plex Mono', monospace; cursor: pointer">{{d.label}}</button>
</sc-for>
</div>
</div>

<div role="radiogroup" aria-label="你的彈性" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">3 你的時間有多少彈性</span>
<sc-for list="{{flex}}" as="f" hint-placeholder-count="4">
<button role="radio" aria-checked="{{f.on}}" onClick="{{f.pick}}" style="min-height: 52px; text-align: left; padding: 8px 14px; border-radius: 10px; border: 1px solid {{f.border}}; background: {{f.bg}}; cursor: pointer; display: flex; align-items: center; gap: 12px; font-family: 'Noto Sans TC', sans-serif; color: #1A1D21">
<span style="flex: none; width: 18px; height: 18px; border-radius: 50%; background: {{f.dot}}; box-shadow: inset 0 0 0 2px #1A1D21, inset 0 0 0 5px #FFFFFF"></span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 500">{{f.label}}</span><span style="font-size: 12px; color: #555B63">{{f.note}}</span></span>
</button>
</sc-for>
</div>

<a href="V2Today.dc.html" style="margin-top: auto; min-height: 52px; border-radius: 12px; background: #1A1D21; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">產生今天的建議</a>
</div>

<nav aria-label="主要分頁" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #DAD8D0; background: #FFFFFF">
<a href="V2Today.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #555B63; text-decoration: none">今天</a>
<a href="V2City.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #555B63; text-decoration: none">城市</a>
<a href="V2Setup.dc.html" aria-current="page" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #1A1D21; text-decoration: none; box-shadow: inset 0 3px 0 #1F4E79">設定</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { ent: 0, dl: 1, flex: 0 };

  renderVals() {
    const S = this.state;
    const pill = (on) => ({ on: on ? 'true' : 'false', bg: on ? '#1A1D21' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1A1D21', border: on ? '#1A1D21' : '#C9C6BC' });
    const flexOpts = [
      { label: '可以提早或延後', note: '前後 45 分鐘都可以' },
      { label: '只能提早', note: '例如晚上要早點離開' },
      { label: '只能延後', note: '例如早上要先送小孩' },
      { label: '不能調整', note: '我們會告訴你最不塞的路線，不會叫你改時間' }
    ];
    return {
      ents: ['堤頂大道', '民權大橋', '成美橋', '環東大道'].map((l, i) => ({ label: l, ...pill(i === S.ent), pick: () => this.setState({ ent: i }) })),
      deadlines: ['08:30', '09:00', '09:30', '10:00'].map((l, i) => ({ label: l, ...pill(i === S.dl), pick: () => this.setState({ dl: i }) })),
      flex: flexOpts.map((f, i) => {
        const on = i === S.flex;
        return { ...f, on: on ? 'true' : 'false', bg: on ? '#EEF3F8' : '#FFFFFF', border: on ? '#1F4E79' : '#C9C6BC', dot: on ? '#1A1D21' : '#FFFFFF', pick: () => this.setState({ flex: i }) };
      })
    };
  }
}
</script>
</body>
</html>
