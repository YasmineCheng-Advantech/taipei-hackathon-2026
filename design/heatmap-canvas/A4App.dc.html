<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>安全步行路線</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E79}a:hover{color:#123150}
</style>
</helmet>
<div style="width: 390px; min-height: 1040px; box-sizing: border-box; background: #F5F4EF; color: #1A1D21; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 12px 'IBM Plex Mono', monospace; color: #555B63">A4 · 人行空間 · 捷運站 → 公司 · 模擬</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 900">這段路走起來安全嗎？</h1>
</div>

<div role="group" aria-label="誰在走" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">今天是誰在走</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{personas}}" as="p" hint-placeholder-count="4">
<button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="min-height: 48px; border-radius: 10px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font: 500 13px 'Noto Sans TC', sans-serif; cursor: pointer; padding: 2px">{{p.label}}</button>
</sc-for>
</div>
</div>

<section aria-label="建議路線" style="background: #1A1D21; color: #F5F4EF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; color: #FCB46E; font-weight: 700">建議路線</span><span style="font: 600 22px 'IBM Plex Mono', monospace">{{mins}} 分</span></div>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="4">
<div style="display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 10px; align-items: start">
<span style="width: 12px; height: 12px; margin-top: 4px; border-radius: 50%; background: {{s.dot}}"></span>
<span style="font-size: 14px; line-height: 1.5">{{s.text}}</span>
</div>
</sc-for>
<span style="font-size: 12px; color: #B8BCC2">{{compare}}</span>
</section>

<section aria-label="回報這裡很難走" style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">這裡很難走？回報給城市</span>
<div role="group" aria-label="狀況" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
<button onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}}; font: 500 13px 'Noto Sans TC', sans-serif; cursor: pointer">{{k.label}}</button>
</sc-for>
</div>
<div style="height: 84px; border-radius: 10px; border: 1px dashed #8F8A7E; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; color: #555B63">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
加一張照片（選填，請避開人臉與車牌）
</div>
<sc-if value="{{reported}}" hint-placeholder-val="{{ false }}">
<div role="status" style="padding: 10px 12px; border-radius: 10px; background: #E2F0E8; color: #1F4F38; font-size: 13px; line-height: 1.6">已回報「{{kindLabel}}」。這個路段本月累積 17 則，會出現在城市的人行道改善清單。</div>
</sc-if>
<sc-if value="{{notReported}}" hint-placeholder-val="{{ true }}">
<button onClick="{{report}}" style="min-height: 48px; border: 0; border-radius: 12px; background: #1F4E79; color: #FFFFFF; font: 700 15px 'Noto Sans TC', sans-serif; cursor: pointer">送出回報</button>
</sc-if>
</section>
</div>

<nav aria-label="分頁" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #DAD8D0; background: #FFFFFF">
<a href="A4App.dc.html" aria-current="page" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1A1D21; text-decoration: none; box-shadow: inset 0 3px 0 #1F4E79">我</a>
<a href="A4City.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555B63; text-decoration: none">城市</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  state = { who: 0, kind: 0, reported: false };

  renderVals() {
    const S = this.state;
    const ok = '#8CC2C2', warn = '#FCB46E', bad = '#E86A4A';
    const personas = [
      { label: '一般', mins: 11, compare: '最短路線 10 分，但要穿越 2 個高風險路口。', steps: [['從捷運站 2 號出口出站', ok], ['沿 [路段 1] 騎樓走 400 公尺', ok], ['過 [路口 X]：行人綠燈 25 秒，夠用', warn], ['抵達公司', ok]] },
      { label: '推嬰兒車', mins: 14, compare: '避開 [路段 2]：騎樓高低差大、人行道寬度不足。', steps: [['從捷運站 1 號出口（有電梯）', ok], ['走 [路段 3] 人行道，寬 2.5 公尺', ok], ['過 [路口 Y]：有無障礙斜坡', ok], ['抵達公司', ok]] },
      { label: '陪長輩', mins: 15, compare: '選綠燈秒數較長的路口，多 4 分鐘。', steps: [['從捷運站 1 號出口（有電梯）', ok], ['走 [路段 3]，中途有座椅', ok], ['過 [路口 Y]：行人綠燈 40 秒', ok], ['[路口 Z] 車多，請等下一個綠燈再過', warn], ['抵達公司', ok]] },
      { label: '輪椅', mins: 16, compare: '全程有斜坡，但 [路段 4] 常被機車擋住。', steps: [['從捷運站 1 號出口（有電梯）', ok], ['走 [路段 3] 人行道', ok], ['[路段 4] 常有機車停在人行道上', bad], ['過 [路口 Y]：有無障礙斜坡', ok], ['抵達公司', ok]] }
    ];
    const kinds = ['人行道太窄', '騎樓不平', '被機車擋住', '綠燈太短', '沒有斜坡'];
    const p = personas[S.who];
    const pill = (on) => ({ on: on ? 'true' : 'false', bg: on ? '#1A1D21' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1A1D21', border: on ? '#1A1D21' : '#C9C6BC' });
    return {
      personas: personas.map((x, i) => ({ label: x.label, ...pill(i === S.who), pick: () => this.setState({ who: i }) })),
      mins: p.mins, compare: p.compare,
      steps: p.steps.map((s) => ({ text: s[0], dot: s[1] })),
      kinds: kinds.map((k, i) => ({ label: k, ...pill(i === S.kind), pick: () => this.setState({ kind: i, reported: false }) })),
      kindLabel: kinds[S.kind],
      reported: S.reported, notReported: !S.reported,
      report: () => this.setState({ reported: true })
    };
  }
}
</script>
</body>
</html>
