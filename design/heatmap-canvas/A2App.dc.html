<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>我的騎車路線</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E79}a:hover{color:#123150}
</style>
</helmet>
<div style="width: 390px; min-height: 1040px; box-sizing: border-box; background: #F5F4EF; color: #1A1D21; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 12px 'IBM Plex Mono', monospace; color: #555B63">A2 · 機車 · 住家 → 公司 · 模擬</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 900">這條路騎起來安全嗎？</h1>
</div>

<section aria-label="路線選擇" style="display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{routes}}" as="r" hint-placeholder-count="3">
<button onClick="{{r.pick}}" aria-pressed="{{r.on}}" style="text-align: left; border-radius: 12px; border: 1px solid {{r.border}}; background: {{r.bg}}; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; font-family: 'Noto Sans TC', sans-serif; color: #1A1D21">
<span style="display: flex; justify-content: space-between; align-items: center"><span style="font-size: 15px; font-weight: 700">{{r.name}}</span><span style="font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: {{r.tagBg}}; color: {{r.tagFg}}">{{r.tag}}</span></span>
<span style="display: flex; gap: 12px; font-size: 13px; color: #3A3F45"><span style="font-family: 'IBM Plex Mono', monospace">{{r.mins}} 分</span><span>高風險路口 {{r.risk}}</span><span>沒有待轉區 {{r.nowait}}</span></span>
</button>
</sc-for>
</section>

<section aria-label="這條路要注意" style="background: #1A1D21; color: #F5F4EF; border-radius: 16px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #FCB46E; font-weight: 700">{{selName}}：要注意的地方</span>
<sc-for list="{{warns}}" as="w" hint-placeholder-count="2">
<div style="display: flex; gap: 10px; font-size: 14px; line-height: 1.5">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FCB46E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none; margin-top: 2px"><path d="M12 3 2 20h20Z"></path><path d="M12 10v4"></path><path d="M12 17v.5"></path></svg>
<span>{{w}}</span>
</div>
</sc-for>
</section>

<section aria-label="回報差點出事" style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">剛剛差點出事？回報給城市</span>
<span style="font-size: 12px; color: #555B63">事故資料只記到真的撞了；差點出事的回報能補上看不到的危險。位置只記到路口，不收集個資。</span>
<div role="group" aria-label="狀況" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{kinds}}" as="k" hint-placeholder-count="5">
<button onClick="{{k.pick}}" aria-pressed="{{k.on}}" style="min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid {{k.border}}; background: {{k.bg}}; color: {{k.fg}}; font: 500 13px 'Noto Sans TC', sans-serif; cursor: pointer">{{k.label}}</button>
</sc-for>
</div>
<sc-if value="{{reported}}" hint-placeholder-val="{{ false }}">
<div role="status" style="padding: 10px 12px; border-radius: 10px; background: #E2F0E8; color: #1F4F38; font-size: 13px; line-height: 1.6">已回報 [路口 A]「{{kindLabel}}」，這是本月第 24 則。累積的回報會進入城市的路口改善排行。</div>
</sc-if>
<sc-if value="{{notReported}}" hint-placeholder-val="{{ true }}">
<button onClick="{{report}}" style="min-height: 48px; border: 0; border-radius: 12px; background: #1F4E79; color: #FFFFFF; font: 700 15px 'Noto Sans TC', sans-serif; cursor: pointer">在 [路口 A] 回報</button>
</sc-if>
</section>
</div>

<nav aria-label="分頁" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #DAD8D0; background: #FFFFFF">
<a href="A2App.dc.html" aria-current="page" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1A1D21; text-decoration: none; box-shadow: inset 0 3px 0 #1F4E79">我</a>
<a href="A2City.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555B63; text-decoration: none">城市</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  state = { route: 1, kind: 0, reported: false };

  renderVals() {
    const S = this.state;
    const routes = [
      { name: '路線 A（最快）', mins: 14, risk: 3, nowait: 2, warns: ['[路口 A] 早上 8–10 點事故最多，沒有待轉區，左轉請兩段式。', '[路口 B] 汽車右轉常切過機車道。', '[路口 D] 路面有坑洞回報。'] },
      { name: '路線 B', mins: 16, risk: 1, nowait: 0, warns: ['[路口 C] 下坡接路口，請提早減速。'] },
      { name: '路線 C（最安全）', mins: 18, risk: 0, nowait: 1, warns: ['[路段 E] 沒有機車道，與公車共用車道。'] }
    ];
    const rec = 1;
    const kinds = ['待轉區不夠', '汽車右轉擦撞', '路面坑洞', '視線被擋', '號誌太短'];
    const r = routes[S.route];
    return {
      routes: routes.map((x, i) => {
        const on = i === S.route;
        const tag = i === rec ? { tag: '推薦：多 2 分，少 2 個危險路口', bg: '#1F4E79', fg: '#FFFFFF' } : x.risk >= 3 ? { tag: '最快但較危險', bg: '#FCE9DC', fg: '#7A2E0B' } : { tag: '最安全', bg: '#E3ECF5', fg: '#1F4E79' };
        return { ...x, on: on ? 'true' : 'false', bg: on ? '#EEF3F8' : '#FFFFFF', border: on ? '#1F4E79' : '#DAD8D0', tag: tag.tag, tagBg: tag.bg, tagFg: tag.fg, pick: () => this.setState({ route: i }) };
      }),
      selName: r.name, warns: r.warns,
      kinds: kinds.map((k, i) => { const on = i === S.kind; return { label: k, on: on ? 'true' : 'false', bg: on ? '#1A1D21' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1A1D21', border: on ? '#1A1D21' : '#C9C6BC', pick: () => this.setState({ kind: i, reported: false }) }; }),
      kindLabel: kinds[S.kind],
      reported: S.reported, notReported: !S.reported,
      report: () => this.setState({ reported: true })
    };
  }
}
</script>
</body>
</html>
