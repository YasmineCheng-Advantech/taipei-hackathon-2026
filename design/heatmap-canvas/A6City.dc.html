<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>捷運吃得下嗎</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E79}a:hover{color:#123150}
input[type=range]{accent-color:#1F4E79}
</style>
</helmet>
<div style="width: 390px; min-height: 1040px; box-sizing: border-box; background: #F5F4EF; color: #1A1D21; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 12px 'IBM Plex Mono', monospace; color: #555B63">A6 · 城市 · 平日早上 · 模擬</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 900">改搭捷運，吃得下嗎？</h1>
</div>

<section style="background: #1A1D21; color: #F5F4EF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #B8BCC2">最擠的一段（推估）</span>
<span style="font-size: 18px; font-weight: 700">[站 A → 站 B] · 08:00–09:00</span>
<span style="font-size: 13px; color: #B8BCC2">每小時容量以約 13,000 人次計（北捷說法，新聞轉述）</span>
</section>

<section aria-label="容量檢核" style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<label for="shift" style="font-size: 15px; font-weight: 700">從開車改搭捷運的人：<span style="font: 600 18px 'IBM Plex Mono', monospace; color: #1F4E79">{{n}}</span> 人</label>
<input id="shift" type="range" min="0" max="3000" step="100" value="{{n}}" onChange="{{onN}}" style="width: 100%; height: 32px">
<div style="position: relative; height: 28px; border-radius: 6px; background: #ECEAE3; overflow: hidden">
<div style="position: absolute; left: 0; top: 0; height: 28px; width: {{baseW}}%; background: #8CC2C2"></div>
<div style="position: absolute; left: {{baseW}}%; top: 0; height: 28px; width: {{addW}}%; background: {{addColor}}"></div>
<div style="position: absolute; left: {{capLeft}}%; top: 0; width: 2px; height: 28px; background: #1A1D21"></div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #555B63"><span>現況 {{basePct}}%</span><span>容量 100%</span></div>
<div style="padding: 10px 12px; border-radius: 10px; background: {{msgBg}}; color: {{msgFg}}; font-size: 14px; line-height: 1.6">{{msg}}</div>
<span style="font-size: 12px; color: #555B63">假設改搭的人有 60% 落在最擠的那一小時；比例要用起訖資料校準。</span>
</section>

<section aria-label="城市行動" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 700">新車 2036 年上線前，城市可以做的事</span>
<sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14px; font-weight: 700">{{a.title}}</span><span style="flex: none; font-size: 11px; color: #555B63">{{a.dept}}</span></div>
<span style="font-size: 13px; color: #3A3F45; line-height: 1.5">{{a.why}}</span>
<button onClick="{{a.vote}}" aria-pressed="{{a.on}}" style="align-self: flex-start; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #1F4E79; background: {{a.bg}}; color: {{a.fg}}; font: 500 13px 'Noto Sans TC', sans-serif; cursor: pointer">我也需要 · {{a.count}}</button>
</article>
</sc-for>
</section>
</div>

<nav aria-label="分頁" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #DAD8D0; background: #FFFFFF">
<a href="A6App.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555B63; text-decoration: none">我</a>
<a href="A6City.dc.html" aria-current="page" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1A1D21; text-decoration: none; box-shadow: inset 0 3px 0 #1F4E79">城市</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  state = { n: 1000, votes: {} };

  renderVals() {
    const S = this.state;
    const cap = 13000, base = 11900;
    const added = Math.round(S.n * 0.6);
    const scale = 120;
    const total = base + added;
    const room = Math.max(0, Math.floor((cap - base) / 0.6 / 100) * 100);
    const over = total > cap;
    const actions = [
      { id: 'hw', title: '尖峰縮短班距到上限', dept: '捷運公司', why: '在現有車輛下，尖峰小時多發幾班。', base: 203 },
      { id: 'off', title: '離峰搭乘優惠', dept: '交通局 · 捷運公司', why: '07:45 前進站給點數，把一部分人移出最擠的那一小時。', base: 177 },
      { id: 'split', title: '企業接駁分散到不同車站', dept: '產發局', why: '避免所有接駁都擠在港墘、西湖兩站。', base: 129 }
    ];
    return {
      n: S.n,
      onN: (e) => this.setState({ n: Number(e.target.value) }),
      basePct: Math.round((base / cap) * 100),
      baseW: (base / cap) * 100 * (100 / scale),
      addW: (added / cap) * 100 * (100 / scale),
      capLeft: 100 * (100 / scale),
      addColor: over ? '#C93A22' : '#2C7A7B',
      msg: over ? '超過容量：最擠的一段會擠不上車。道路錯峰不能只把人推到捷運，捷運也要一起錯峰。' : '還吃得下。在這段最擠的區間，大約還能多承接 ' + room + ' 人改搭。',
      msgBg: over ? '#FCE9DC' : '#E2F0E8', msgFg: over ? '#7A2E0B' : '#1F4F38',
      actions: actions.map((a) => {
        const on = !!S.votes[a.id];
        return { ...a, count: a.base + (on ? 1 : 0), on: on ? 'true' : 'false', bg: on ? '#1F4E79' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1F4E79', vote: () => this.setState({ votes: { ...S.votes, [a.id]: !on } }) };
      })
    };
  }
}
</script>
</body>
</html>
