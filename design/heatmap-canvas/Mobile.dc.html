<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>我的通勤</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E79}a:hover{color:#123150}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 20px 24px; background: #F5F4EF; color: #1A1D21; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column; gap: 18px; overflow: hidden">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 12px 'IBM Plex Mono', monospace; letter-spacing: 0.06em; color: #555B63">我的通勤 · 不收集個資</span>
<h1 style="margin: 0; font-size: 26px; font-weight: 900; line-height: 1.3">早一點出門，<br>能省幾分鐘？</h1>
</div>

<div role="group" aria-label="你從哪個入口進內湖" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">你從哪裡進內湖</span>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{ents}}" as="e" hint-placeholder-count="4">
<button onClick="{{e.pick}}" aria-pressed="{{e.on}}" style="min-height: 44px; border-radius: 10px; border: 1px solid {{e.border}}; background: {{e.bg}}; color: {{e.fg}}; font: 500 15px 'Noto Sans TC', sans-serif; cursor: pointer">{{e.name}}</button>
</sc-for>
</div>
</div>

<div role="group" aria-label="你平常幾點到" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">你平常幾點經過</span>
<div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{slots}}" as="s" hint-placeholder-count="7">
<button onClick="{{s.pick}}" aria-label="{{s.aria}}" aria-pressed="{{s.on}}" style="height: 64px; border: 0; border-radius: 6px; padding: 0; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; background-color: {{s.bg}}; background-image: repeating-linear-gradient(135deg, rgba(255,255,255,0.45) 0 2px, transparent 2px 7px); color: {{s.fg}}; box-shadow: {{s.ring}}">
<span style="font: 600 15px 'IBM Plex Mono', monospace">{{s.min}}</span>
<span style="font: 400 10px 'IBM Plex Mono', monospace">{{s.label}}</span>
</button>
</sc-for>
</div>
<span style="font-size: 12px; color: #555B63">格內數字：通過這個入口約需幾分鐘（模擬資料）</span>
</div>

<div style="background: #1A1D21; color: #F5F4EF; border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 14px; color: #B8BCC2">{{nowLine}}</span>
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-size: 16px">改在 {{bestLabel}} 經過，可省</span>
<span style="font: 600 40px 'IBM Plex Mono', monospace; color: #FCB46E">{{saved}}</span>
<span style="font-size: 16px">分鐘</span>
</div>
<span style="font-size: 13px; color: #B8BCC2; line-height: 1.6">只算早上單程，一週五天、一年 48 週，大約多出 {{yearHours}} 小時。情境假設 · 程式計算</span>
</div>

<div style="display: flex; flex-direction: column; gap: 8px; margin-top: auto">
<button style="min-height: 52px; border: 0; border-radius: 12px; background: #1F4E79; color: #FFFFFF; font: 700 16px 'Noto Sans TC', sans-serif; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"></path></svg>
產生我的分享卡
</button>
<a href="Main.dc.html" style="min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 15px; text-decoration: none">看完整熱力圖</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { ent: 0, slot: 4 };

  renderVals() {
    const S = this.state;
    const ents = [
      { name: '堤頂大道', base: 6, extra: 16, peak: 5.0 },
      { name: '民權大橋', base: 7, extra: 12, peak: 4.6 },
      { name: '成美橋', base: 8, extra: 14, peak: 4.8 },
      { name: '環東大道', base: 6, extra: 11, peak: 4.2 }
    ];
    const labels = ['07:30', '07:45', '08:00', '08:15', '08:30', '08:45', '09:00'];
    const e = ents[S.ent];
    const g = (t, p, w) => Math.exp(-((t - p) * (t - p)) / (2 * w * w));
    const mins = labels.map((l, t) => Math.round(e.base + e.extra * g(t, e.peak, 1.4)));
    const colorFor = (m) => (m < 9 ? '#FEF3DC' : m < 12 ? '#FDD9A0' : m < 15 ? '#FCB46E' : m < 18 ? '#F2804A' : m < 21 ? '#C93A22' : '#7E170F');
    let best = 0;
    mins.forEach((m, t) => { if (m < mins[best]) best = t; });
    const saved = Math.max(0, mins[S.slot] - mins[best]);
    return {
      ents: ents.map((x, i) => {
        const on = i === S.ent;
        return {
          name: x.name, on: on ? 'true' : 'false',
          bg: on ? '#1A1D21' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1A1D21', border: on ? '#1A1D21' : '#C9C6BC',
          pick: () => this.setState({ ent: i })
        };
      }),
      slots: mins.map((m, t) => {
        const on = t === S.slot;
        const c = colorFor(m);
        return {
          min: m, label: labels[t], on: on ? 'true' : 'false',
          bg: c, fg: m >= 18 ? '#FFFFFF' : '#1A1D21',
          ring: on ? '0 0 0 3px #1F4E79' : t === best ? 'inset 0 0 0 2px #1A1D21' : 'none',
          aria: labels[t] + ' 約 ' + m + ' 分鐘',
          pick: () => this.setState({ slot: t })
        };
      }),
      nowLine: '現在 ' + labels[S.slot] + ' 經過' + e.name + '，約 ' + mins[S.slot] + ' 分鐘',
      bestLabel: labels[best],
      saved,
      yearHours: Math.round((saved * 5 * 48) / 60)
    };
  }
}
</script>
</body>
</html>
