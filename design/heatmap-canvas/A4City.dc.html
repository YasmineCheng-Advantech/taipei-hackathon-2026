<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>人行道改善清單</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E79}a:hover{color:#123150}
</style>
</helmet>
<div style="width: 390px; min-height: 1040px; box-sizing: border-box; background: #F5F4EF; color: #1A1D21; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 12px 'IBM Plex Mono', monospace; color: #555B63">A4 · 城市 · 本月 · 模擬</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 900">哪段人行道該先修？</h1>
</div>

<section aria-label="回報類型" style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 15px; font-weight: 700">本月步行回報</span><span style="font: 600 20px 'IBM Plex Mono', monospace">286 則</span></div>
<sc-for list="{{types}}" as="t" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 88px minmax(0, 1fr) 36px; gap: 8px; align-items: center; font-size: 13px">
<span>{{t.label}}</span>
<span style="display: block; height: 12px; border-radius: 3px; background: #ECEAE3"><span style="display: block; height: 12px; border-radius: 3px; width: {{t.pct}}%; background: #2C7A7B"></span></span>
<span style="font-family: 'IBM Plex Mono', monospace; text-align: right">{{t.pct}}%</span>
</div>
</sc-for>
</section>

<section style="padding: 12px 14px; border-radius: 12px; background: #FBF0D9; color: #4A3300; font-size: 13px; line-height: 1.6"><span style="font-weight: 700">注意回報偏差：</span>回報多不一定最危險，可能只是比較多人知道可以回報。切換下方排序看看，兩種排法的前幾名不一樣。</section>

<section aria-label="改善清單" style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 15px; font-weight: 700">改善優先清單</span>
<div role="group" aria-label="排序方式" style="display: flex; border: 1px solid #C9C6BC; border-radius: 8px; overflow: hidden">
<sc-for list="{{sorts}}" as="s" hint-placeholder-count="2">
<button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="min-height: 40px; padding: 0 10px; border: 0; background: {{s.bg}}; color: {{s.fg}}; font: 500 12px 'Noto Sans TC', sans-serif; cursor: pointer">{{s.label}}</button>
</sc-for>
</div>
</div>
<sc-for list="{{items}}" as="x" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 28px minmax(0, 1fr); gap: 10px">
<span style="font: 600 20px 'IBM Plex Mono', monospace; color: #7E170F">{{x.rank}}</span>
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 15px; font-weight: 700">{{x.name}}</span><span style="flex: none; font-size: 11px; color: #555B63">{{x.dept}}</span></div>
<span style="font-size: 12px; color: #3A3F45">回報 <span style="font-family: 'IBM Plex Mono', monospace">{{x.rep}}</span> 則 · 風險 × 人流 <span style="font-family: 'IBM Plex Mono', monospace">{{x.score}}</span></span>
<span style="font-size: 13px; line-height: 1.5">{{x.fix}}</span>
<button onClick="{{x.vote}}" aria-pressed="{{x.on}}" style="align-self: flex-start; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #1F4E79; background: {{x.bg}}; color: {{x.fg}}; font: 500 13px 'Noto Sans TC', sans-serif; cursor: pointer">我也走過 · {{x.count}}</button>
</div>
</article>
</sc-for>
</section>
</div>

<nav aria-label="分頁" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #DAD8D0; background: #FFFFFF">
<a href="A4App.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555B63; text-decoration: none">我</a>
<a href="A4City.dc.html" aria-current="page" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1A1D21; text-decoration: none; box-shadow: inset 0 3px 0 #1F4E79">城市</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  state = { sort: 'score', votes: {} };

  renderVals() {
    const S = this.state;
    const types = [['被機車擋住', 31], ['人行道太窄', 24], ['騎樓不平', 19], ['綠燈太短', 15], ['沒有斜坡', 11]];
    const items = [
      { id: 'p4', name: '[路段 4]', rep: 52, score: 61, fix: '加強人行道違停取締，設置阻隔桿。', dept: '警察局 · 交通局' },
      { id: 'p2', name: '[路段 2]', rep: 9, score: 88, fix: '回報少但事故多、人流大：拓寬人行道、整平騎樓。', dept: '新工處' },
      { id: 'pz', name: '[路口 Z]', rep: 31, score: 74, fix: '行人綠燈延長 10 秒，加行人早開。', dept: '交工處' },
      { id: 'p1', name: '[路段 1]', rep: 40, score: 35, fix: '騎樓整平，協調店家淨空。', dept: '建管處' }
    ];
    const sorted = items.slice().sort((a, b) => (S.sort === 'score' ? b.score - a.score : b.rep - a.rep));
    const mk = (label, sort) => ({ label, on: S.sort === sort ? 'true' : 'false', bg: S.sort === sort ? '#1A1D21' : '#FFFFFF', fg: S.sort === sort ? '#FFFFFF' : '#1A1D21', pick: () => this.setState({ sort }) });
    return {
      types: types.map((t) => ({ label: t[0], pct: t[1] })),
      sorts: [mk('風險 × 人流', 'score'), mk('回報數', 'rep')],
      items: sorted.map((x, i) => {
        const on = !!S.votes[x.id];
        return { ...x, rank: i + 1, count: x.rep + (on ? 1 : 0), on: on ? 'true' : 'false', bg: on ? '#1F4E79' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1F4E79', vote: () => this.setState({ votes: { ...S.votes, [x.id]: !on } }) };
      })
    };
  }
}
</script>
</body>
</html>
