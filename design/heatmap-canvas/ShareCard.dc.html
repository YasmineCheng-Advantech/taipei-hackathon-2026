<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>分享卡</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FCB46E}a:hover{color:#FDD9A0}
</style>
</helmet>
<div style="width: 1200px; height: 630px; box-sizing: border-box; padding: 56px 64px; background: #1A1D21; color: #F5F4EF; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column; justify-content: space-between">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font: 500 18px 'IBM Plex Mono', monospace; letter-spacing: 0.08em; color: #B8BCC2">內科晨峰熱力圖</span>
<span style="font-size: 16px; padding: 6px 14px; border-radius: 999px; background: #3A3127; color: #FDD9A0">模擬資料</span>
</div>
<div style="display: flex; flex-direction: column; gap: 18px">
<div style="font-size: 64px; font-weight: 900; line-height: 1.2">我每天 <span style="font-family: 'IBM Plex Mono', monospace; color: #FCB46E">08:30</span> 卡在堤頂大道</div>
<div style="font-size: 36px; font-weight: 500; color: #D9DCE0">早 45 分鐘出門，可以省 <span style="font: 600 52px 'IBM Plex Mono', monospace; color: #FCB46E">{{saved}}</span> 分鐘</div>
</div>
<div style="display: flex; justify-content: space-between; align-items: flex-end; gap: 40px">
<div style="display: flex; gap: 6px">
<div style="width: 64px; height: 48px; border-radius: 6px; background: #FEF3DC"></div>
<div style="width: 64px; height: 48px; border-radius: 6px; background: #FDD9A0"></div>
<div style="width: 64px; height: 48px; border-radius: 6px; background: #FCB46E"></div>
<div style="width: 64px; height: 48px; border-radius: 6px; background: #F2804A"></div>
<div style="width: 64px; height: 48px; border-radius: 6px; background: #C93A22; box-shadow: 0 0 0 3px #F5F4EF"></div>
<div style="width: 64px; height: 48px; border-radius: 6px; background: #7E170F"></div>
<div style="width: 64px; height: 48px; border-radius: 6px; background: #C93A22"></div>
</div>
<div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px">
<span style="font-size: 22px; font-weight: 700">算算你的通勤 →</span>
<span style="font: 500 18px 'IBM Plex Mono', monospace; color: #B8BCC2">[作品網址]</span>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"saved":{"editor":"int","default":12,"min":0,"max":60},"$preview":{"width":1200,"height":630}}'>
class Component extends DCLogic {
  renderVals() {
    return { saved: this.props.saved ?? 12 };
  }
}
</script>
</body>
</html>
