<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>滿場時刻與費率</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E79}a:hover{color:#123150}
</style>
</helmet>
<div style="width: 390px; min-height: 1040px; box-sizing: border-box; background: #F5F4EF; color: #1A1D21; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 12px 'IBM Plex Mono', monospace; color: #555B63">A5 · 城市 · 平日平均 · 模擬</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 900">停車位幾點被搶光？</h1>
</div>

<section style="background: #1A1D21; color: #F5F4EF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 18px; font-weight: 700; line-height: 1.5">08:30 前，<span style="font-family: 'IBM Plex Mono', monospace; color: #FCB46E">5</span> 個停車場有 <span style="font-family: 'IBM Plex Mono', monospace; color: #FCB46E">3</span> 個全滿</span>
<span style="font-size: 13px; color: #B8BCC2">找不到位子的車在附近繞圈，本身就增加尖峰車流（數量待推估）</span>
</section>

<section aria-label="滿場時刻" style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 700">各停車場幾點滿</span>
<sc-for list="{{lots}}" as="l" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 84px minmax(0, 1fr) 46px; gap: 8px; align-items: center">
<span style="font-size: 13px">{{l.name}}</span>
<span style="position: relative; display: block; height: 14px; border-radius: 3px; background: #ECEAE3">
<span style="position: absolute; left: 0; top: 0; height: 14px; width: {{l.w}}%; border-radius: 3px; background: #FCB46E"></span>
<span style="position: absolute; left: {{l.w}}%; right: 0; top: 0; height: 14px; border-radius: 0 3px 3px 0; background: {{l.fullColor}}"></span>
</span>
<span style="font: 600 13px 'IBM Plex Mono', monospace; color: {{l.timeColor}}">{{l.time}}</span>
</div>
</sc-for>
<div style="display: flex; justify-content: space-between; font: 400 11px 'IBM Plex Mono', monospace; color: #555B63; padding-left: 92px; padding-right: 54px"><span>07:00</span><span>08:30</span><span>10:00</span></div>
</section>

<section aria-label="分時費率" style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 700">分時費率建議</span>
<div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 1px; background: #DAD8D0; border-radius: 8px; overflow: hidden; font-size: 13px">
<span style="background: #F5F4EF; padding: 8px; font-weight: 700">時段</span><span style="background: #F5F4EF; padding: 8px; font-weight: 700">現行</span><span style="background: #F5F4EF; padding: 8px; font-weight: 700">建議</span>
<span style="background: #FFFFFF; padding: 8px">07:30–09:30</span><span style="background: #FFFFFF; padding: 8px">[$]</span><span style="background: #FFFFFF; padding: 8px; color: #B4501A; font-weight: 700">調高</span>
<span style="background: #FFFFFF; padding: 8px">09:30 以後</span><span style="background: #FFFFFF; padding: 8px">[$]</span><span style="background: #FFFFFF; padding: 8px; color: #1F5A96; font-weight: 700">調降</span>
<span style="background: #FFFFFF; padding: 8px">外圍轉乘</span><span style="background: #FFFFFF; padding: 8px">[$]</span><span style="background: #FFFFFF; padding: 8px; color: #1F5A96; font-weight: 700">優惠</span>
</div>
<span style="font-size: 12px; color: #555B63">用價格把一部分車移到離峰或外圍；金額需停管處評估。</span>
</section>

<section aria-label="城市行動" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 700">城市可以做的事</span>
<sc-for list="{{actions}}" as="a" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-size: 14px; font-weight: 700">{{a.title}}</span><span style="flex: none; font-size: 11px; color: #555B63">{{a.dept}}</span></div>
<span style="font-size: 13px; color: #3A3F45; line-height: 1.5">{{a.why}}</span>
<button onClick="{{a.vote}}" aria-pressed="{{a.on}}" style="align-self: flex-start; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #1F4E79; background: {{a.bg}}; color: {{a.fg}}; font: 500 13px 'Noto Sans TC', sans-serif; cursor: pointer">我也需要 · {{a.count}}</button>
</article>
</sc-for>
</section>
</div>

<nav aria-label="分頁" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #DAD8D0; background: #FFFFFF">
<a href="A5App.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555B63; text-decoration: none">我</a>
<a href="A5City.dc.html" aria-current="page" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1A1D21; text-decoration: none; box-shadow: inset 0 3px 0 #1F4E79">城市</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  state = { votes: {} };

  renderVals() {
    const S = this.state;
    const toPct = (t) => { const [h, m] = t.split(':').map(Number); return Math.round(((h * 60 + m - 420) / 180) * 100); };
    const lots = [['[停車場 A]', '07:55'], ['[停車場 B]', '08:10'], ['[停車場 C]', '08:25'], ['[停車場 E]', '08:50'], ['[停車場 F]', null]];
    const actions = [
      { id: 'rate', title: '停車分時費率', dept: '停管處', why: '尖峰調高、離峰調降，讓不急的人晚點來。', base: 96 },
      { id: 'pr', title: '外圍轉乘停車 + 接駁', dept: '停管處 · 公運處', why: 'App 中有 312 人選過「停外圍轉乘」。', base: 312 },
      { id: 'sign', title: '入口設即時車位看板', dept: '交通局', why: '進內科前就知道哪裡滿了，不用繞圈。', base: 141 }
    ];
    return {
      lots: lots.map((l) => ({
        name: l[0],
        w: l[1] ? toPct(l[1]) : 100,
        fullColor: l[1] ? '#7E170F' : 'transparent',
        time: l[1] || '未滿',
        timeColor: l[1] ? '#7E170F' : '#1F4F38'
      })),
      actions: actions.map((a) => {
        const on = !!S.votes[a.id];
        return { ...a, count: a.base + (on ? 1 : 0), on: on ? 'true' : 'false', bg: on ? '#1F4E79' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1F4E79', vote: () => this.setState({ votes: { ...S.votes, [a.id]: !on } }) };
      })
    };
  }
}
</script>
</body>
</html>
