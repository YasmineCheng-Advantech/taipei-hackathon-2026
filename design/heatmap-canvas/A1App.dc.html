<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>今晚幾點走</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E79}a:hover{color:#123150}
</style>
</helmet>
<div style="width: 390px; min-height: 1040px; box-sizing: border-box; background: #F5F4EF; color: #1A1D21; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 12px 'IBM Plex Mono', monospace; color: #555B63">A1 · 今晚 · 經民權大橋回家 · 模擬</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 900">今晚幾點走最不會卡？</h1>
</div>

<div style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-radius: 10px; background: #E3ECF5; color: #1F4E79; font-size: 13px">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
早上你認領了 07:45 出門，今晚的建議會跟早上配對。
</div>

<div role="group" aria-label="今天的狀況" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">今天的狀況</span>
<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{plans}}" as="p" hint-placeholder-count="3">
<button onClick="{{p.pick}}" aria-pressed="{{p.on}}" style="min-height: 48px; border-radius: 10px; border: 1px solid {{p.border}}; background: {{p.bg}}; color: {{p.fg}}; font: 500 13px 'Noto Sans TC', sans-serif; cursor: pointer; padding: 4px">{{p.label}}</button>
</sc-for>
</div>
</div>

<section aria-label="今晚的建議" style="background: #1A1D21; color: #F5F4EF; border-radius: 16px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; color: #B8BCC2">今晚建議</span>
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font: 600 48px 'IBM Plex Mono', monospace; line-height: 1">{{leave}}</span><span style="font-size: 18px; font-weight: 700">離開</span></div>
<span style="font-size: 15px">預估 <span style="font: 600 16px 'IBM Plex Mono', monospace">{{home}}</span> 到家 · <span style="color: #FCB46E">{{gain}}</span></span>
<span style="font-size: 13px; color: #B8BCC2; line-height: 1.6">{{why}}</span>
</section>

<section aria-label="各離開時間" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 700">各離開時間要多久</span>
<sc-for list="{{opts}}" as="o" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) 72px; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 8px; background: {{o.rowBg}}">
<span style="font: 600 14px 'IBM Plex Mono', monospace">{{o.time}}</span>
<span style="display: block; height: 14px; border-radius: 3px; background: #ECEAE3"><span style="display: block; height: 14px; border-radius: 3px; width: {{o.w}}%; background: {{o.color}}"></span></span>
<span style="font: 500 12px 'IBM Plex Mono', monospace; text-align: right; color: #3A3F45">{{o.mins}} 分 {{o.tag}}</span>
</div>
</sc-for>
</section>

<div style="padding: 12px 14px; border-radius: 10px; background: #FFFFFF; border: 1px solid #DAD8D0; font-size: 13px; line-height: 1.6"><span style="font-weight: 700; color: #B4501A">如果大家都這樣：</span>17:30 的名額已被認領 68%。滿了之後，系統會改推薦 17:15 或 18:45，避免下班時段也擠成新尖峰。</div>

<button onClick="{{claim}}" style="min-height: 52px; border: 0; border-radius: 12px; background: {{claimBg}}; color: #FFFFFF; font: 700 16px 'Noto Sans TC', sans-serif; cursor: pointer">{{claimLabel}}</button>
</div>

<nav aria-label="分頁" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #DAD8D0; background: #FFFFFF">
<a href="A1App.dc.html" aria-current="page" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1A1D21; text-decoration: none; box-shadow: inset 0 3px 0 #1F4E79">我</a>
<a href="A1City.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555B63; text-decoration: none">城市</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  state = { plan: 0, claimed: false };

  renderVals() {
    const S = this.state;
    const times = ['17:00', '17:15', '17:30', '17:45', '18:00', '18:15', '18:30', '18:45', '19:00', '19:15'];
    const mins = [16, 19, 22, 26, 31, 34, 31, 27, 24, 21];
    const plans = [
      { label: '準時下班', rec: 2, why: '早上提早到，下班也提早，剛好避開 18:00 後的尖峰。' },
      { label: '加班 1 小時', rec: 9, why: '晚一點走反而快：18:15 走要 34 分，19:15 走只要 21 分。' },
      { label: '18:00 接小孩', rec: 1, why: '往回推，17:15 離開能在 17:50 前到幼兒園。' }
    ];
    const p = plans[S.plan];
    const color = (m) => (m < 18 ? '#FDD9A0' : m < 24 ? '#FCB46E' : m < 30 ? '#F2804A' : '#C93A22');
    const add = (t, m) => { const [h, mm] = t.split(':').map(Number); const x = h * 60 + mm + m; return String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0'); };
    return {
      plans: plans.map((x, i) => { const on = i === S.plan; return { label: x.label, on: on ? 'true' : 'false', bg: on ? '#1A1D21' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1A1D21', border: on ? '#1A1D21' : '#C9C6BC', pick: () => this.setState({ plan: i, claimed: false }) }; }),
      leave: times[p.rec], home: add(times[p.rec], mins[p.rec]),
      gain: '比 18:15 走少 ' + (34 - mins[p.rec]) + ' 分',
      why: p.why,
      opts: times.map((t, i) => ({ time: t, mins: mins[i], w: Math.round((mins[i] / 36) * 100), color: color(mins[i]), rowBg: i === p.rec ? '#EEF3F8' : 'transparent', tag: i === p.rec ? '★' : '' })),
      claim: () => this.setState({ claimed: true }),
      claimLabel: S.claimed ? '已認領 ' + times[p.rec] + ' 離開' : '認領 ' + times[p.rec] + ' 離開',
      claimBg: S.claimed ? '#2F6B4F' : '#1F4E79'
    };
  }
}
</script>
</body>
</html>
