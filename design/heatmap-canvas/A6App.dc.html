<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>搭哪一班</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E79}a:hover{color:#123150}
</style>
</helmet>
<div style="width: 390px; min-height: 1040px; box-sizing: border-box; background: #F5F4EF; color: #1A1D21; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 12px 'IBM Plex Mono', monospace; color: #555B63">A6 · 文湖線 · 往動物園方向 · 模擬</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 900">搭捷運會不會擠不上去？</h1>
</div>

<div role="group" aria-label="上車站" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 700">從哪一站上車</span>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{stations}}" as="s" hint-placeholder-count="4">
<button onClick="{{s.pick}}" aria-pressed="{{s.on}}" style="min-height: 44px; border-radius: 10px; border: 1px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font: 500 13px 'Noto Sans TC', sans-serif; cursor: pointer; padding: 2px">{{s.label}}</button>
</sc-for>
</div>
</div>

<section aria-label="各班擁擠度" style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 700">從{{stName}}上車，車廂多擠</span>
<sc-for list="{{slots}}" as="t" hint-placeholder-count="5">
<div style="display: grid; grid-template-columns: 52px minmax(0, 1fr) 64px; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; background: {{t.rowBg}}">
<span style="font: 600 14px 'IBM Plex Mono', monospace">{{t.time}}</span>
<span style="display: flex; gap: 3px">
<sc-for list="{{t.dots}}" as="d" hint-placeholder-count="5">
<span style="width: 18px; height: 18px; border-radius: 4px; background: {{d}}"></span>
</sc-for>
</span>
<span style="font-size: 12px; font-weight: 700; color: {{t.color}}; text-align: right">{{t.label}}</span>
</div>
</sc-for>
<span style="font-size: 12px; color: #555B63">依每小時進出量與起訖資料推估的站間負載，不是即時數據。</span>
</section>

<section style="background: #1A1D21; color: #F5F4EF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 13px; color: #FCB46E; font-weight: 700">建議</span>
<span style="font-size: 18px; font-weight: 700; line-height: 1.5">{{advice}}</span>
<span style="font-size: 13px; color: #B8BCC2">或改搭 [公車路線] 到港墘，多 6 分鐘但有座位。</span>
</section>

<section style="background: #FBF0D9; border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 700; color: #7A5200">離峰搭乘獎勵（概念）</span>
<span style="font-size: 14px; line-height: 1.6">07:45 前進站可累積點數，換 [獎勵]。本週你已累積 <span style="font: 600 15px 'IBM Plex Mono', monospace">3</span> 點。</span>
<span style="font-size: 12px; color: #6B4700">國外有類似的離峰獎勵試驗，引用前請先查證細節。</span>
</section>
</div>

<nav aria-label="分頁" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #DAD8D0; background: #FFFFFF">
<a href="A6App.dc.html" aria-current="page" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1A1D21; text-decoration: none; box-shadow: inset 0 3px 0 #1F4E79">我</a>
<a href="A6City.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555B63; text-decoration: none">城市</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  state = { st: 0 };

  renderVals() {
    const S = this.state;
    const stations = ['大直', '松山機場', '中山國中', '南京復興'];
    const times = ['07:30', '07:45', '08:00', '08:15', '08:30'];
    const levels = [[2, 3, 4, 5, 4], [2, 2, 3, 4, 4], [1, 2, 3, 4, 3], [1, 2, 2, 3, 3]][S.st];
    const names = ['', '舒適', '普通', '有點擠', '擁擠', '很擠'];
    const colors = ['', '#2C7A7B', '#2C7A7B', '#B8742A', '#C93A22', '#7E170F'];
    let best = 0;
    levels.forEach((l, i) => { if (l < levels[best]) best = i; });
    const worst = levels.indexOf(Math.max(...levels));
    return {
      stations: stations.map((s, i) => { const on = i === S.st; return { label: s, on: on ? 'true' : 'false', bg: on ? '#1A1D21' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1A1D21', border: on ? '#1A1D21' : '#C9C6BC', pick: () => this.setState({ st: i }) }; }),
      stName: stations[S.st],
      slots: times.map((t, i) => ({
        time: t,
        dots: [1, 2, 3, 4, 5].map((k) => (k <= levels[i] ? colors[levels[i]] : '#ECEAE3')),
        label: names[levels[i]], color: colors[levels[i]],
        rowBg: i === best ? '#EEF3F8' : 'transparent'
      })),
      advice: times[worst] + ' 最擠。提早到 ' + times[best] + ' 搭車，車廂明顯比較有空間。'
    };
  }
}
</script>
</body>
</html>
