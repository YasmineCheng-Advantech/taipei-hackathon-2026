<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>路口改善排行</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F4E79}a:hover{color:#123150}
</style>
</helmet>
<div style="width: 390px; min-height: 1040px; box-sizing: border-box; background: #F5F4EF; color: #1A1D21; font-family: 'Noto Sans TC', sans-serif; display: flex; flex-direction: column">
<div style="flex: 1; padding: 24px 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font: 500 12px 'IBM Plex Mono', monospace; color: #555B63">A2 · 城市 · 本月 · 模擬</span>
<h1 style="margin: 0; font-size: 24px; font-weight: 900">哪個路口該先改？</h1>
</div>

<section style="background: #1A1D21; color: #F5F4EF; border-radius: 16px; padding: 18px; display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 13px; color: #B8BCC2">本月差點出事回報</span>
<span style="font: 600 36px 'IBM Plex Mono', monospace; line-height: 1.1">412 則</span>
<span style="font-size: 14px">最多的是「待轉區不夠」，占 <span style="font-family: 'IBM Plex Mono', monospace; color: #FCB46E">38%</span></span>
</section>

<section aria-label="事故與回報對照" style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 700">事故 × 回報：把路口分成四類</span>
<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px">
<div style="background: #7E170F; color: #FFFFFF; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 20px 'IBM Plex Mono', monospace">3</span><span style="font-size: 12px; font-weight: 700">事故多、回報多</span><span style="font-size: 11px">優先改善</span></div>
<div style="background: #F2804A; color: #1A1D21; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 20px 'IBM Plex Mono', monospace">4</span><span style="font-size: 12px; font-weight: 700">事故少、回報多</span><span style="font-size: 11px">還沒出事的危險</span></div>
<div style="background: #FCB46E; color: #1A1D21; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 20px 'IBM Plex Mono', monospace">2</span><span style="font-size: 12px; font-weight: 700">事故多、回報少</span><span style="font-size: 11px">民眾沒察覺，加警示</span></div>
<div style="background: #FEF3DC; color: #1A1D21; border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 2px"><span style="font: 600 20px 'IBM Plex Mono', monospace">11</span><span style="font-size: 12px; font-weight: 700">都少</span><span style="font-size: 11px">持續觀察</span></div>
</div>
</section>

<section aria-label="路口改善排行" style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 15px; font-weight: 700">改善排行（依事故 × 回報 × 缺少設施）</span>
<sc-for list="{{list}}" as="x" hint-placeholder-count="4">
<article style="background: #FFFFFF; border: 1px solid #DAD8D0; border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px">
<span style="font: 600 22px 'IBM Plex Mono', monospace; color: #7E170F">{{x.rank}}</span>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 15px; font-weight: 700">{{x.name}}</span>
<span style="font-size: 12px; color: #3A3F45">事故 <span style="font-family: 'IBM Plex Mono', monospace">{{x.acc}}</span> 件 · 回報 <span style="font-family: 'IBM Plex Mono', monospace">{{x.rep}}</span> 則 · 缺 {{x.lack}}</span>
<span style="font-size: 13px; line-height: 1.5"><span style="font-weight: 700">建議：</span>{{x.fix}}</span>
<button onClick="{{x.vote}}" aria-pressed="{{x.on}}" style="align-self: flex-start; min-height: 40px; padding: 0 12px; border-radius: 999px; border: 1px solid #1F4E79; background: {{x.bg}}; color: {{x.fg}}; font: 500 13px 'Noto Sans TC', sans-serif; cursor: pointer">我也遇過 · {{x.count}}</button>
</div>
</article>
</sc-for>
</section>
<span style="font-size: 11px; color: #555B63">路口名稱待換成真實資料後才填入；作品建議不代表市府承諾。</span>
</div>

<nav aria-label="分頁" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid #DAD8D0; background: #FFFFFF">
<a href="A2App.dc.html" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #555B63; text-decoration: none">我</a>
<a href="A2City.dc.html" aria-current="page" style="min-height: 56px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1A1D21; text-decoration: none; box-shadow: inset 0 3px 0 #1F4E79">城市</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1040}}'>
class Component extends DCLogic {
  state = { votes: {} };

  renderVals() {
    const S = this.state;
    const list = [
      { id: 'a', name: '[路口 A]', acc: 31, rep: 88, lack: '待轉區', fix: '增設機車待轉區，左轉改兩段式並加標示。', base: 88 },
      { id: 'b', name: '[路口 B]', acc: 24, rep: 61, lack: '機車道', fix: '劃設機車道，汽車右轉前加設讓車標線。', base: 61 },
      { id: 'c', name: '[路口 G]', acc: 6, rep: 54, lack: '視線', fix: '修剪遮蔽視線的植栽，加凸面鏡。', base: 54 },
      { id: 'd', name: '[路口 D]', acc: 19, rep: 12, lack: '—', fix: '事故多但少人回報，先加警示與巡查。', base: 12 }
    ];
    return {
      list: list.map((x, i) => {
        const on = !!S.votes[x.id];
        return { ...x, rank: i + 1, count: x.base + (on ? 1 : 0), on: on ? 'true' : 'false', bg: on ? '#1F4E79' : '#FFFFFF', fg: on ? '#FFFFFF' : '#1F4E79', vote: () => this.setState({ votes: { ...S.votes, [x.id]: !on } }) };
      })
    };
  }
}
</script>
</body>
</html>
