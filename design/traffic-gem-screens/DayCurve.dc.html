<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>單一入口一天的車速</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.sim{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE;white-space:nowrap}
.card{background:#FFFFFF;border-radius:26px;box-shadow:0 12px 32px rgba(214,100,40,.13)}
.chip{appearance:none;border:0;border-radius:999px;min-height:40px;padding:0 14px;background:#EFEDEB;color:#3F3935;font:500 14px/1 'Noto Sans TC',sans-serif;letter-spacing:.06em;cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;font-weight:700;box-shadow:inset 0 3px 0 rgba(255,255,255,.35)}
.hit{appearance:none;border:0;padding:0;background:transparent;position:absolute;top:0;bottom:0;cursor:pointer}
.hit:focus-visible{outline:2px solid #0B3A4A}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 920px; overflow: hidden; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 220px at 50% 560px, rgba(240,130,60,.22), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF5EE 160px, #FBE4D3 460px, #F8D6BD 740px, #FFF8F3 920px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 12px">
    <a href="Heatmap.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 15px; letter-spacing: 0.1em; color: #8A3A18; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"></path></svg>熱力圖
    </a>
    <span class="sim">含模擬資料</span>
  </div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="margin: 0 0 0 14px; display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.08em; color: #5A2410">一個入口的早上</h1>
      <p style="margin: 0; font-size: 13.5px; color: #6B4A3A">平均車速，加上 4 個平日裡最快到最慢的範圍</p>
    </div>
    <div role="group" aria-label="選入口" style="display: flex; flex-wrap: wrap; gap: 6px">
      <sc-for list="{{entries}}" as="e" hint-placeholder-count="6">
        <button type="button" class="chip {{e.cls}}" aria-pressed="{{e.on}}" onClick="{{e.pick}}">{{e.name}}</button>
      </sc-for>
    </div>
    <section class="card" aria-label="{{chartAria}}" style="padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; align-items: baseline; justify-content: space-between; padding: 0 4px">
        <span style="font-size: 13px; color: #6B4A3A">km/h</span>
        <span style="display: flex; gap: 12px; font-size: 12px; color: #6B4A3A">
          <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 16px; height: 3px; border-radius: 2px; background: #C93A22"></i>平均</span>
          <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 14px; height: 10px; border-radius: 3px; background: #FBD5BE"></i>每天範圍</span>
        </span>
      </div>
      <div style="position: relative; width: 330px; height: 210px">
        <svg viewBox="0 0 330 210" width="330" height="210" aria-hidden="true" style="position: absolute; inset: 0; overflow: visible">
          <line x1="28" y1="20" x2="322" y2="20" stroke="#F1E6DE" stroke-width="1"></line>
          <line x1="28" y1="80" x2="322" y2="80" stroke="#F1E6DE" stroke-width="1"></line>
          <line x1="28" y1="140" x2="322" y2="140" stroke="#F1E6DE" stroke-width="1"></line>
          <line x1="28" y1="200" x2="322" y2="200" stroke="#D9C8BC" stroke-width="1"></line>
          <text x="20" y="24" text-anchor="end" font-size="10" fill="#6B4A3A">60</text>
          <text x="20" y="84" text-anchor="end" font-size="10" fill="#6B4A3A">40</text>
          <text x="20" y="144" text-anchor="end" font-size="10" fill="#6B4A3A">20</text>
          <text x="20" y="204" text-anchor="end" font-size="10" fill="#6B4A3A">0</text>
          <line x1="28" y1="140" x2="322" y2="140" stroke="#8A2E0B" stroke-width="1.5" stroke-dasharray="4 3"></line>
          <text x="322" y="135" text-anchor="end" font-size="10" font-weight="700" fill="#8A2E0B">20 km/h 以下算塞</text>
          <path d="{{band}}" fill="#FBD5BE"></path>
          <path d="{{line}}" fill="none" stroke="#C93A22" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></path>
          <line x1="{{selX}}" y1="14" x2="{{selX}}" y2="200" stroke="#3A2418" stroke-width="1"></line>
          <circle cx="{{selX}}" cy="{{selY}}" r="6" fill="#C93A22" stroke="#FFFFFF" stroke-width="2.5"></circle>
        </svg>
        <sc-for list="{{hits}}" as="h" hint-placeholder-count="10">
          <button type="button" class="hit" style="left: {{h.left}}px; width: 30px" aria-label="{{h.aria}}" onClick="{{h.pick}}"></button>
        </sc-for>
      </div>
      <div style="position: relative; height: 16px; font-size: 11px; color: #6B4A3A; font-variant-numeric: tabular-nums">
        <span style="position: absolute; left: 28px; transform: translateX(-50%)">07:00</span>
        <span style="position: absolute; left: 158px; transform: translateX(-50%)">08:00</span>
        <span style="position: absolute; left: 288px; transform: translateX(-50%)">09:00</span>
      </div>
      <p aria-live="polite" style="margin: 4px 4px 0; padding-top: 10px; border-top: 2px dotted #F1DCCD; font-size: 14px; line-height: 1.65">{{readout}}</p>
    </section>
    <section class="card" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.06em">怎麼讀</h2>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.7; color: #5A3A2A">範圍越寬，代表每天差很多、不好預測。範圍整段掉到虛線以下，代表幾乎每天都會塞。</p>
    </section>
  </div>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #FFFFFF; box-shadow: 0 -1px 0 #F1E4DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="tab" href="Today.dc.html">今日</a>
    <a class="tab" href="City.dc.html">城市</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  state = { e: 1, c: 7 };
  renderVals() {
    const S = this.state;
    const times = ['07:00','07:15','07:30','07:45','08:00','08:15','08:30','08:45','09:00','09:15'];
    const E = [
      { name: '內湖路一段', d: [[56,56,56,0],[57,57,57,0],[57,57,57,0],[54,53,55,0],[47,45,50,0],[30,24,37,0],[22,15,31,2],[24,17,32,1],[36,32,42,0],[49,47,51,0]] },
      { name: '堤頂大道', d: [[58,58,58,0],[59,59,59,0],[59,59,59,0],[52,51,54,0],[44,41,48,0],[29,23,36,0],[14,5,25,3],[10,5,22,3],[17,9,27,3],[35,30,41,0]] },
      { name: '民權大橋', d: [[60,60,60,0],[56,56,56,0],[55,54,56,0],[51,50,53,0],[40,36,44,0],[26,20,34,0],[12,5,24,3],[18,10,28,2],[33,28,39,0],[48,46,50,0]] },
      { name: '成美橋', d: [[59,59,59,0],[60,60,60,0],[55,54,56,0],[51,50,53,0],[42,39,46,0],[27,21,35,0],[15,6,26,3],[11,5,23,3],[25,18,33,1],[42,39,46,0]] },
      { name: '環東大道', d: [[56,56,56,0],[56,56,56,0],[55,54,56,0],[49,47,51,0],[38,34,43,0],[20,12,30,2],[16,8,26,3],[25,18,33,1],[40,36,44,0],[52,51,54,0]] },
      { name: '國1（模擬）', d: [[58,58,58,0],[58,58,58,0],[55,54,56,0],[41,38,45,0],[27,21,35,0],[15,6,26,3],[16,8,26,3],[30,24,37,0],[41,38,45,0],[52,51,54,0]] }
    ];
    const xs = times.map((t, i) => 28 + i * 32.6);
    const Y = (v) => 200 - v * 3;
    const d = E[S.e].d;
    const pt = (i, k) => xs[i].toFixed(1) + ' ' + Y(d[i][k]).toFixed(1);
    const line = 'M' + d.map((p, i) => pt(i, 0)).join(' L');
    const band = 'M' + d.map((p, i) => pt(i, 2)).join(' L') + ' L' + d.map((p, i) => pt(d.length - 1 - i, 1)).join(' L') + ' Z';
    const c = d[S.c];
    return {
      entries: E.map((e, i) => ({ name: e.name, cls: i === S.e ? 'on' : '', on: i === S.e ? 'true' : 'false', pick: () => this.setState({ e: i }) })),
      line, band,
      selX: xs[S.c], selY: Y(c[0]),
      chartAria: E[S.e].name + ' 07:00 到 09:15 的平均車速曲線',
      hits: times.map((t, i) => ({ left: xs[i] - 15, aria: t + ' 平均 ' + d[i][0] + ' km/h', pick: () => this.setState({ c: i }) })),
      readout: times[S.c] + '：平均 ' + c[0] + ' km/h，每天在 ' + c[1] + '–' + c[2] + ' km/h 之間' + (c[3] > 0 ? '；4 天裡有 ' + c[3] + ' 天低於 20。' : '。')
    };
  }
}
</script>
</body>
</html>
