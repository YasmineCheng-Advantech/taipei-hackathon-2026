<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>入口、最晚到、彈性</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.chip{appearance:none;border:0;border-radius:16px;background:#DEDCDA;color:#3F3935;font-family:'Noto Sans TC',sans-serif;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.chip.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 2px rgba(255,214,170,.75)}
.chip .sub{color:#5E5650}.chip.on .sub{color:#FFFFFF}
.radio{width:26px;height:26px;border-radius:50%;box-sizing:border-box;border:2px solid #4A4440;background:#FFFFFF;flex:none;display:grid;place-items:center}
.chip.on .radio{border:3px solid #FFFFFF;background:transparent}
.radio i{width:12px;height:12px;border-radius:50%;background:transparent}
.chip.on .radio i{background:#FFFFFF}
.wheel-row{appearance:none;border:0;background:transparent;width:100%;height:42px;display:grid;grid-template-columns:2fr 1.1fr 0.3fr 1.1fr;align-items:center;font-family:'Noto Sans TC',sans-serif;font-size:21px;letter-spacing:.1em;color:#C8481F;cursor:pointer;font-variant-numeric:tabular-nums}
.wheel-row.on{background:linear-gradient(180deg,#F6A46C 0%,#EE7A40 55%,#E2582A 100%);color:#FFFFFF;border-radius:14px;font-weight:700;box-shadow:inset 0 3px 0 rgba(255,255,255,.3)}
.cta{display:flex;align-items:center;justify-content:center;height:62px;border-radius:999px;background:linear-gradient(180deg,#6BEBFA 0%,#2AD4F0 42%,#14B8E2 100%);box-shadow:inset 0 7px 0 rgba(255,255,255,.32),0 7px 0 #1C8DB3,0 18px 28px rgba(20,140,180,.25);color:#0B3A4A;font:900 22px/1 'Noto Sans TC',sans-serif;letter-spacing:.16em;text-decoration:none}
.cta:hover{color:#0B3A4A;filter:brightness(1.04)}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
.tab.on{color:#C8481F;font-weight:500}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3A2418; background: radial-gradient(60% 160px at 50% 700px, rgba(240,130,60,.42), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF7F1 120px, #FBE6D6 380px, #F7D3B8 620px, #FFF8F3 844px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 30px">
    <p style="margin: 0; font-size: 14px; letter-spacing: 0.14em; color: #8A3A18">第 2 步，共 3 步</p>
    <a href="Menu.dc.html" aria-label="開啟選單" style="width: 48px; height: 48px; display: grid; place-items: center; color: #D2532A">
      <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 2h26M2 12h26M2 22h26"></path></svg>
    </a>
  </div>
  <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 10px">
    <h2 style="margin: 0 0 0 14px; font-size: 18px; font-weight: 500; letter-spacing: 0.14em; color: #3A2A22">你從哪裡進內湖</h2>
    <div style="background: #FFFFFF; border-radius: 26px; box-shadow: 0 12px 32px rgba(214,100,40,.13); padding: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <button type="button" class="chip {{r.cls}}" aria-pressed="{{r.on}}" onClick="{{r.pick}}" style="height: 46px; font-size: 17px; letter-spacing: 0.14em">{{r.label}}</button>
      </sc-for>
    </div>
    <h2 style="margin: 8px 0 0 14px; font-size: 18px; font-weight: 500; letter-spacing: 0.14em; color: #3A2A22">最晚幾點要到公司</h2>
    <div style="background: #FFFFFF; border-radius: 26px; box-shadow: 0 12px 32px rgba(214,100,40,.13); padding: 8px 14px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{wheel}}" as="w" hint-placeholder-count="3">
        <button type="button" class="wheel-row {{w.cls}}" aria-label="{{w.aria}}" aria-pressed="{{w.on}}" onClick="{{w.pick}}">
          <span>{{w.ampm}}</span><span style="text-align: center">{{w.h}}</span><span style="text-align: center">{{w.colon}}</span><span style="text-align: center">{{w.m}}</span>
        </button>
      </sc-for>
    </div>
    <h2 style="margin: 8px 0 0 14px; font-size: 18px; font-weight: 500; letter-spacing: 0.14em; color: #3A2A22">你的時間有多少彈性</h2>
    <div style="background: #FFFFFF; border-radius: 26px; box-shadow: 0 12px 32px rgba(214,100,40,.13); padding: 12px 18px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{flex}}" as="f" hint-placeholder-count="4">
        <button type="button" class="chip {{f.cls}}" aria-pressed="{{f.on}}" onClick="{{f.pick}}" style="min-height: 52px; padding: 6px 16px; display: flex; align-items: center; gap: 16px; text-align: left">
          <span class="radio" aria-hidden="true"><i></i></span>
          <span style="display: flex; flex-direction: column; gap: 1px">
            <span style="font-size: 17px; font-weight: 500; letter-spacing: 0.14em">{{f.label}}</span>
            <span class="sub" style="font-size: 11.5px; letter-spacing: 0.08em">{{f.note}}</span>
          </span>
        </button>
      </sc-for>
    </div>
  </div>
  <a class="cta" href="Reasons.dc.html" style="position: absolute; top: 688px; left: 40px; right: 40px">下一步</a>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #FFFFFF; box-shadow: 0 -1px 0 #F1E4DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="tab on" href="Today.dc.html">今日</a>
    <a class="tab" href="City.dc.html">城市</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { row: 'tiding-n', dl: 0, flex: 'both' };
  renderVals() {
    const S = this.state;
    const rows = [
      { id: 'tiding-n', label: '堤頂大道' },
      { id: 'minquan-br', label: '民權大橋' },
      { id: 'chengmei-br', label: '成美橋' },
      { id: 'huandong', label: '環東大道' }
    ];
    const dls = ['08:30', '09:00', '09:30', '10:00'];
    const flex = [
      { id: 'both', label: '可以提早或延後', note: '前後 45 分鐘都可以' },
      { id: 'earlier', label: '只能提早', note: '例如晚上要早點離開' },
      { id: 'later', label: '只能延後', note: '例如早上要先送小孩' },
      { id: 'none', label: '不能調整', note: '我們只告訴你今天哪個時段比較順' }
    ];
    const wheel = [S.dl - 1, S.dl, S.dl + 1].map((i, k) => {
      if (i < 0 || i >= dls.length) return { ampm: '', h: '', colon: '', m: '', cls: '', on: 'false', aria: '沒有更多時間', pick: () => {} };
      const [hh, mm] = dls[i].split(':');
      return {
        ampm: '上午', h: String(Number(hh)), colon: k === 1 ? ':' : '', m: mm,
        cls: k === 1 ? 'on' : '', on: k === 1 ? 'true' : 'false',
        aria: '上午 ' + dls[i] + ' 前到',
        pick: () => this.setState({ dl: i })
      };
    });
    const sel = (cur, id, fn) => ({ cls: cur === id ? 'on' : '', on: cur === id ? 'true' : 'false', pick: fn });
    return {
      rows: rows.map((r) => ({ ...r, ...sel(S.row, r.id, () => this.setState({ row: r.id })) })),
      wheel,
      flex: flex.map((f) => ({ ...f, ...sel(S.flex, f.id, () => this.setState({ flex: f.id })) }))
    };
  }
}
</script>
</body>
</html>
