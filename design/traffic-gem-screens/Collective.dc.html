<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>如果大家都這樣</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.sim{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE;white-space:nowrap}
.chip{appearance:none;border:0;border-radius:16px;background:#DEDCDA;color:#3F3935;font-family:'Noto Sans TC',sans-serif;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.chip.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 2px rgba(255,214,170,.75)}
.bar{width:100%;border-radius:8px 8px 4px 4px;background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.5) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08),inset 0 2px 0 rgba(255,255,255,.45);transition:height .35s ease}
.bar.hi{box-shadow:0 0 0 3px #3A2418,inset 0 -3px 0 rgba(0,0,0,.08)}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
.tab.on{color:#C8481F;font-weight:500}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 220px at 50% 640px, rgba(240,130,60,.3), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF5EE 160px, #FBE4D3 460px, #F8D6BD 680px, #FFF8F3 844px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 12px">
    <a href="Today.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 15px; letter-spacing: 0.1em; color: #8A3A18; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"></path></svg>今日
    </a>
    <a href="Menu.dc.html" aria-label="開啟選單" style="width: 48px; height: 48px; display: grid; place-items: center; color: #D2532A">
      <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 2h26M2 12h26M2 22h26"></path></svg>
    </a>
  </div>
  <div style="padding: 6px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0 0 0 14px; font-size: 22px; font-weight: 900; letter-spacing: 0.12em; color: #5A2410">如果大家都這樣做呢？</h1>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button type="button" class="chip {{m.cls}}" aria-pressed="{{m.on}}" onClick="{{m.pick}}" style="min-height: 56px; padding: 6px; font-size: 14px; font-weight: 500; letter-spacing: 0.06em; line-height: 1.35">{{m.title}}</button>
      </sc-for>
    </div>
    <section style="background: #FFFFFF; border-radius: 28px; box-shadow: 0 14px 34px rgba(214,100,40,.16); padding: 20px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
        <p style="margin: 0; font-size: 14px; letter-spacing: 0.1em; color: #6B4A3A">每人平均路上時間</p>
        <span class="sim">情境假設</span>
      </div>
      <p style="margin: 0; font-family: 'Grandstander', 'Noto Sans TC', sans-serif; font-weight: 800; font-size: 50px; line-height: 1.05; color: {{deltaColor}}">{{delta}}</p>
      <p style="margin: 0; font-size: 16px; font-weight: 700; line-height: 1.6">{{text}}</p>
      <div aria-hidden="true" style="height: 140px; margin-top: 8px; display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px; align-items: end">
        <sc-for list="{{bars}}" as="b" hint-placeholder-count="10">
          <div class="bar {{b.cls}}" style="height: {{b.h}}px; background-color: {{b.bg}}"></div>
        </sc-for>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12px; color: #6B4A3A; font-variant-numeric: tabular-nums"><span>07:00</span><span>08:00</span><span>09:15</span></div>
      <p style="margin: 4px 0 0; padding-top: 10px; border-top: 2px dotted #F1DCCD; font-size: 13px; line-height: 1.65; color: #6B4A3A">柱子越高越順（堤頂大道北向車速），顏色越深越塞。{{note}}</p>
    </section>
    <p style="margin: 0 14px; font-size: 13.5px; line-height: 1.7; color: #5A3A2A">所以我們不叫大家都去同一個時段：每個時段有名額，滿了就推薦下一個。</p>
  </div>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #FFFFFF; box-shadow: 0 -1px 0 #F1E4DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="tab on" href="Today.dc.html">今日</a>
    <a class="tab" href="City.dc.html">城市</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { mode: 0 };
  renderVals() {
    const modes = [
      { title: '只有你\n這樣做', delta: '−12 分', good: true, text: '你省很多，但路況幾乎不變。', curve: [55, 55, 45, 45, 35, 25, 15, 8, 8, 15], hi: -1, note: '' },
      { title: '大家都照\n同一建議', delta: '−2 分', good: false, text: '07:30 變成新尖峰，大家只省一點點。', curve: [55, 45, 15, 8, 15, 25, 25, 15, 15, 25], hi: 2, note: '框起來的是新尖峰。' },
      { title: '依名額\n分配', delta: '−7 分', good: true, text: '尖峰被攤平，平均每人都省到時間。', curve: [55, 45, 35, 35, 35, 25, 25, 25, 25, 35], hi: -1, note: '' }
    ];
    const colors = ['#FEF3DC', '#FDD9A0', '#FCB46E', '#F2804A', '#C93A22', '#7E170F'];
    const lv = (v) => (v >= 50 ? 0 : v >= 40 ? 1 : v >= 30 ? 2 : v >= 20 ? 3 : v >= 10 ? 4 : 5);
    const m = modes[this.state.mode];
    return {
      modes: modes.map((x, i) => ({
        title: x.title.replace('\n', ''),
        cls: i === this.state.mode ? 'on' : '', on: i === this.state.mode ? 'true' : 'false',
        pick: () => this.setState({ mode: i })
      })),
      delta: m.delta, deltaColor: m.good ? '#0E6F84' : '#A63C16', text: m.text, note: m.note,
      bars: m.curve.map((v, i) => ({ h: Math.round(v * 2.3) + 10, bg: colors[lv(v)], cls: i === m.hi ? 'hi' : '' }))
    };
  }
}
</script>
</body>
</html>
