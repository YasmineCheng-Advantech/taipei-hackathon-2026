<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>4 天裡有幾天會塞</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.sim{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE;white-space:nowrap}
.card{background:#FFFFFF;border-radius:26px;box-shadow:0 12px 32px rgba(214,100,40,.13)}
.cell{appearance:none;border:0;background:#FAF5F1;border-radius:10px;height:40px;padding:0;cursor:pointer;display:grid;grid-template-columns:repeat(2,8px);gap:4px;place-content:center}
.cell.sel{box-shadow:0 0 0 2.5px #0E6F84;background:#FFFFFF}
.cell:focus-visible{outline:3px solid #0B3A4A}
.dot{width:8px;height:8px;border-radius:50%;box-sizing:border-box}
.dot.bad{background:#C93A22}
.dot.ok{border:1.5px solid #C9B6A8}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 900px; overflow: hidden; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 220px at 50% 560px, rgba(240,130,60,.22), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF5EE 160px, #FBE4D3 460px, #F8D6BD 720px, #FFF8F3 900px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 12px">
    <a href="Heatmap.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 15px; letter-spacing: 0.1em; color: #8A3A18; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"></path></svg>熱力圖
    </a>
    <span class="sim">含模擬資料</span>
  </div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="margin: 0 0 0 14px; display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.08em; color: #5A2410">平均不準？看看幾天會塞</h1>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #6B4A3A">每格 4 個點＝收集期間的 4 個平日，紅點＝那天車速低於 20 km/h</p>
    </div>
    <section class="card" aria-label="各入口各時段的塞車天數" style="padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px">
      <div aria-hidden="true" style="display: grid; grid-template-columns: 82px repeat(6, minmax(0, 1fr)); gap: 4px; font-size: 11px; color: #6B4A3A; text-align: center; font-variant-numeric: tabular-nums">
        <span></span><span>08:00</span><span>08:15</span><span>08:30</span><span>08:45</span><span>09:00</span><span>09:15</span>
      </div>
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div style="display: grid; grid-template-columns: 82px repeat(6, minmax(0, 1fr)); gap: 4px; align-items: center">
          <span style="font-size: 13px; font-weight: 700; line-height: 1.25">{{r.name}}</span>
          <sc-for list="{{r.cells}}" as="c" hint-placeholder-count="6">
            <button type="button" class="cell {{c.cls}}" aria-label="{{c.aria}}" aria-pressed="{{c.on}}" onClick="{{c.pick}}">
              <sc-for list="{{c.dots}}" as="d" hint-placeholder-count="4"><i class="dot {{d}}"></i></sc-for>
            </button>
          </sc-for>
        </div>
      </sc-for>
      <div style="display: flex; gap: 14px; margin-top: 6px; font-size: 12px; color: #6B4A3A">
        <span style="display: flex; align-items: center; gap: 6px"><i aria-hidden="true" class="dot bad"></i>那天會塞</span>
        <span style="display: flex; align-items: center; gap: 6px"><i aria-hidden="true" class="dot ok"></i>那天還好</span>
      </div>
      <p aria-live="polite" style="margin: 6px 4px 0; padding-top: 10px; border-top: 2px dotted #F1DCCD; font-size: 14px; line-height: 1.65">{{readout}}</p>
    </section>
    <section class="card" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.06em">為什麼要看這張</h2>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.7; color: #5A3A2A">同樣平均 22 km/h，「4 天都 22」和「2 天很順、2 天停住」是兩回事。點越紅越集中，越值得換時段；只有 1–2 個紅點的格子，換了也未必有感。</p>
    </section>
  </div>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #FFFFFF; box-shadow: 0 -1px 0 #F1E4DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="tab" href="Today.dc.html">今日</a>
    <a class="tab" href="City.dc.html">城市</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":900}}'>
class Component extends DCLogic {
  state = { r: 1, c: 3 };
  renderVals() {
    const S = this.state;
    const times = ['08:00', '08:15', '08:30', '08:45', '09:00', '09:15'];
    const R = [
      { name: '內湖路一段', d: [[47,45,50,0],[30,24,37,0],[22,15,31,2],[24,17,32,1],[36,32,42,0],[49,47,51,0]] },
      { name: '堤頂大道', d: [[44,41,48,0],[29,23,36,0],[14,5,25,3],[10,5,22,3],[17,9,27,3],[35,30,41,0]] },
      { name: '民權大橋', d: [[40,36,44,0],[26,20,34,0],[12,5,24,3],[18,10,28,2],[33,28,39,0],[48,46,50,0]] },
      { name: '成美橋', d: [[42,39,46,0],[27,21,35,0],[15,6,26,3],[11,5,23,3],[25,18,33,1],[42,39,46,0]] },
      { name: '環東大道', d: [[38,34,43,0],[20,12,30,2],[16,8,26,3],[25,18,33,1],[40,36,44,0],[52,51,54,0]] },
      { name: '國1（模擬）', d: [[27,21,35,0],[15,6,26,3],[16,8,26,3],[30,24,37,0],[41,38,45,0],[52,51,54,0]] }
    ];
    const cur = R[S.r].d[S.c];
    return {
      rows: R.map((row, ri) => ({
        name: row.name,
        cells: row.d.map((x, ci) => ({
          dots: [0, 1, 2, 3].map((k) => (k < x[3] ? 'bad' : 'ok')),
          cls: ri === S.r && ci === S.c ? 'sel' : '',
          on: ri === S.r && ci === S.c ? 'true' : 'false',
          aria: row.name + ' ' + times[ci] + '：4 天裡 ' + x[3] + ' 天會塞',
          pick: () => this.setState({ r: ri, c: ci })
        }))
      })),
      readout: R[S.r].name + ' ' + times[S.c] + '：4 天裡有 ' + cur[3] + ' 天會塞。平均 ' + cur[0] + ' km/h，每天在 ' + cur[1] + '–' + cur[2] + ' km/h 之間。'
    };
  }
}
</script>
</body>
</html>
