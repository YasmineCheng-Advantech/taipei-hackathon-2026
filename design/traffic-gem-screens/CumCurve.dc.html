<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>排隊從哪裡來</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.sim{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE;white-space:nowrap}
.card{background:#FFFFFF;border-radius:26px;box-shadow:0 12px 32px rgba(214,100,40,.13)}
.seg{appearance:none;border:0;border-radius:14px;min-height:44px;background:#DEDCDA;color:#3F3935;font:500 14px/1.3 'Noto Sans TC',sans-serif;letter-spacing:.04em;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.seg.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;font-weight:700;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 2px rgba(255,214,170,.75)}
.hit{appearance:none;border:0;padding:0;background:transparent;position:absolute;top:0;bottom:0;cursor:pointer}
.hit:focus-visible{outline:2px solid #0B3A4A}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; overflow: hidden; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 220px at 50% 600px, rgba(240,130,60,.22), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF5EE 160px, #FBE4D3 460px, #F8D6BD 760px, #FFF8F3 960px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 12px">
    <a href="Scenario.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 15px; letter-spacing: 0.1em; color: #8A3A18; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"></path></svg>錯峰情境
    </a>
    <span class="sim">程式計算・含模擬資料</span>
  </div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="margin: 0 0 0 14px; display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.08em; color: #5A2410">排隊是怎麼來的</h1>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #6B4A3A">堤頂大道北向・從 07:00 起累計，來了幾輛、過了幾輛</p>
    </div>
    <div role="group" aria-label="情境" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
      <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
        <button type="button" class="seg {{m.cls}}" aria-pressed="{{m.on}}" onClick="{{m.pick}}">{{m.label}}</button>
      </sc-for>
    </div>
    <section class="card" aria-label="累積車輛曲線" style="padding: 16px 14px 12px; display: flex; flex-direction: column; gap: 6px">
      <div style="display: flex; gap: 12px; flex-wrap: wrap; padding: 0 4px; font-size: 12px; color: #6B4A3A">
        <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 16px; height: 3px; border-radius: 2px; background: #C93A22"></i>累計來到入口</span>
        <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 16px; height: 3px; border-radius: 2px; background: #0E6F84"></i>累計通過入口</span>
        <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 14px; height: 10px; border-radius: 3px; background: #F7B48C"></i>兩線之間＝排隊</span>
      </div>
      <div style="position: relative; width: 330px; height: 230px">
        <svg viewBox="0 0 330 230" width="330" height="230" aria-hidden="true" style="position: absolute; inset: 0; overflow: visible">
          <line x1="40" y1="20" x2="322" y2="20" stroke="#F1E6DE"></line>
          <line x1="40" y1="70" x2="322" y2="70" stroke="#F1E6DE"></line>
          <line x1="40" y1="120" x2="322" y2="120" stroke="#F1E6DE"></line>
          <line x1="40" y1="170" x2="322" y2="170" stroke="#F1E6DE"></line>
          <line x1="40" y1="220" x2="322" y2="220" stroke="#D9C8BC"></line>
          <text x="34" y="24" text-anchor="end" font-size="10" fill="#6B4A3A">10,000</text>
          <text x="34" y="74" text-anchor="end" font-size="10" fill="#6B4A3A">8,000</text>
          <text x="34" y="124" text-anchor="end" font-size="10" fill="#6B4A3A">6,000</text>
          <text x="34" y="174" text-anchor="end" font-size="10" fill="#6B4A3A">4,000</text>
          <text x="34" y="224" text-anchor="end" font-size="10" fill="#6B4A3A">2,000</text>
          <path d="{{area}}" fill="#F7B48C"></path>
          <path d="{{dep}}" fill="none" stroke="#0E6F84" stroke-width="2.5" stroke-linejoin="round"></path>
          <path d="{{arr}}" fill="none" stroke="#C93A22" stroke-width="2.5" stroke-linejoin="round"></path>
          <line x1="{{selX}}" y1="14" x2="{{selX}}" y2="220" stroke="#3A2418" stroke-width="1"></line>
        </svg>
        <sc-for list="{{hits}}" as="h" hint-placeholder-count="9">
          <button type="button" class="hit" style="left: {{h.left}}px; width: 34px" aria-label="{{h.aria}}" onClick="{{h.pick}}"></button>
        </sc-for>
      </div>
      <div style="position: relative; height: 16px; font-size: 11px; color: #6B4A3A; font-variant-numeric: tabular-nums">
        <span style="position: absolute; left: 40px; transform: translateX(-50%)">08:00</span>
        <span style="position: absolute; left: 181px; transform: translateX(-50%)">09:00</span>
        <span style="position: absolute; left: 322px; transform: translateX(-50%)">10:00</span>
      </div>
      <p aria-live="polite" style="margin: 4px 4px 0; padding-top: 10px; border-top: 2px dotted #F1DCCD; font-size: 14px; line-height: 1.65">{{readout}}</p>
    </section>
    <section class="card" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.06em">怎麼讀</h2>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.7; color: #5A3A2A">入口每 15 分鐘大約只能過 1,000 輛（假設），所以藍線斜率有上限。紅線比藍線陡的時候，車就開始排隊；把一部分車移走，紅線變平，兩線之間的面積就變小。</p>
    </section>
  </div>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #FFFFFF; box-shadow: 0 -1px 0 #F1E4DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="tab" href="Today.dc.html">今日</a>
    <a class="tab" href="City.dc.html">城市</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  state = { m: 0, c: 4 };
  renderVals() {
    const S = this.state;
    const times = ['08:00','08:15','08:30','08:45','09:00','09:15','09:30','09:45','10:00'];
    const M = [
      { label: '現在', a: [2779,3700,4868,6148,7316,8237,8931,9497,10013], d: [2779,3700,4700,5700,6700,7700,8700,9497,10013] },
      { label: '提早 10%', a: [3233,4154,5205,6357,7408,8237,8931,9497,10013], d: [3233,4154,5154,6154,7154,8154,8931,9497,10013] },
      { label: '提早 20%', a: [3686,4607,5542,6566,7500,8237,8931,9497,10013], d: [3686,4607,5542,6542,7500,8237,8931,9497,10013] }
    ];
    const xs = times.map((t, i) => 40 + i * 35.25);
    const Y = (v) => 220 - ((v - 2000) / 8000) * 200;
    const m = M[S.m];
    const pts = (arr) => arr.map((v, i) => xs[i].toFixed(1) + ' ' + Y(v).toFixed(1));
    const arr = 'M' + pts(m.a).join(' L');
    const dep = 'M' + pts(m.d).join(' L');
    const area = 'M' + pts(m.a).join(' L') + ' L' + pts(m.d).reverse().join(' L') + ' Z';
    const fmt = (n) => n.toLocaleString('en-US');
    const q = m.a[S.c] - m.d[S.c];
    return {
      modes: M.map((x, i) => ({ label: x.label, cls: i === S.m ? 'on' : '', on: i === S.m ? 'true' : 'false', pick: () => this.setState({ m: i }) })),
      arr, dep, area, selX: xs[S.c],
      hits: times.map((t, i) => ({ left: xs[i] - 17, aria: t + '：來了 ' + m.a[i] + ' 輛，過了 ' + m.d[i] + ' 輛', pick: () => this.setState({ c: i }) })),
      readout: times[S.c] + ' 為止：來了 ' + fmt(m.a[S.c]) + ' 輛，過了 ' + fmt(m.d[S.c]) + ' 輛，' + (q > 0 ? '還有 ' + fmt(q) + ' 輛在排隊。' : '沒有排隊。')
    };
  }
}
</script>
</body>
</html>
