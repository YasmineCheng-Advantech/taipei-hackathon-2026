<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>設定</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.row{display:grid;grid-template-columns:96px 1fr 20px;align-items:center;gap:10px;min-height:58px;padding:6px 18px;text-decoration:none;color:#3A2418;border-top:1px solid #F3E6DC}
.row:first-child{border-top:0}
.row:hover{background:#FFF7F1;color:#3A2418}
.danger{appearance:none;border:0;border-radius:999px;height:52px;width:100%;background:#FFFFFF;color:#A12A0E;font:700 16px/1 'Noto Sans TC',sans-serif;letter-spacing:.14em;cursor:pointer;box-shadow:inset 0 0 0 2px #F0C2AE}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
.tab.on{color:#C8481F;font-weight:500}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 920px; overflow: hidden; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 200px at 50% 700px, rgba(240,130,60,.28), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF5EE 160px, #FBE4D3 460px, #F8D6BD 680px, #FFF8F3 920px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 30px">
    <h1 style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.14em; color: #5A2410">我的設定與資料</h1>
    <a href="Menu.dc.html" aria-label="開啟選單" style="width: 48px; height: 48px; display: grid; place-items: center; color: #D2532A">
      <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 2h26M2 12h26M2 22h26"></path></svg>
    </a>
  </div>
  <div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <nav aria-label="修改設定" style="background: #FFFFFF; border-radius: 26px; box-shadow: 0 12px 32px rgba(214,100,40,.13); overflow: hidden; display: flex; flex-direction: column">
      <a class="row" href="Origin.dc.html"><span style="font-size: 14px; color: #6B4A3A">出發地區</span><b style="font-size: 16px; font-weight: 500">中山／大直／士林</b><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#C8481F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"></path></svg></a>
      <a class="row" href="Setup.dc.html"><span style="font-size: 14px; color: #6B4A3A">常經過的入口</span><b style="font-size: 16px; font-weight: 500">堤頂大道</b><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#C8481F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"></path></svg></a>
      <a class="row" href="Setup.dc.html"><span style="font-size: 14px; color: #6B4A3A">最晚到公司</span><b style="font-size: 16px; font-weight: 500">上午 8:30</b><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#C8481F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"></path></svg></a>
      <a class="row" href="Setup.dc.html"><span style="font-size: 14px; color: #6B4A3A">時間彈性</span><b style="font-size: 16px; font-weight: 500">可以提早或延後</b><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#C8481F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"></path></svg></a>
      <a class="row" href="Reasons.dc.html"><span style="font-size: 14px; color: #6B4A3A">沒辦法錯峰的原因</span><b style="font-size: 16px; font-weight: 500">要接送小孩</b><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="#C8481F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4l6 6-6 6"></path></svg></a>
    </nav>
    <section style="background: #FFFFFF; border-radius: 26px; box-shadow: 0 12px 32px rgba(214,100,40,.13); padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
        <label for="share-data" style="display: flex; flex-direction: column; gap: 2px; cursor: pointer">
          <b style="font-size: 16px; letter-spacing: 0.06em">匿名提供通勤資料</b>
          <span style="font-size: 13px; color: #5A3A2A">{{shareText}}</span>
        </label>
        <button id="share-data" type="button" role="switch" aria-checked="{{shareOn}}" onClick="{{toggleShare}}" style="appearance: none; border: 0; flex: none; width: 60px; height: 36px; border-radius: 999px; padding: 3px; cursor: pointer; background: {{trackBg}}; display: flex; justify-content: {{knobSide}}">
          <span aria-hidden="true" style="display: block; width: 30px; height: 30px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 2px 4px rgba(0,0,0,.2)"></span>
        </button>
      </div>
      <p style="margin: 0; padding-top: 10px; border-top: 2px dotted #F1DCCD; font-size: 13px; line-height: 1.7; color: #5A3A2A">不用註冊，我們不知道你是誰。設定存在這支手機；開啟時只送出出發地區、入口、最晚到、彈性、原因與每日回報，和一個隨機的裝置代碼。</p>
    </section>
    <a href="Main.dc.html" style="margin: 4px 14px 0; font-size: 14px; letter-spacing: 0.08em">這個服務怎麼算的、可能錯在哪 →</a>
  </div>
  <div style="position: absolute; top: 726px; left: 40px; right: 40px; display: flex; flex-direction: column; gap: 10px">
    <button type="button" class="danger">刪除我提供過的資料</button>
    <button type="button" class="danger" style="color: #5A3A2A; box-shadow: inset 0 0 0 2px #E2CDBE">清除這支手機上的設定</button>
  </div>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #FFFFFF; box-shadow: 0 -1px 0 #F1E4DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="tab" href="Today.dc.html">今日</a>
    <a class="tab" href="City.dc.html">數據</a>
    <a class="tab on" href="Settings.dc.html" aria-current="page">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":920}}'>
class Component extends DCLogic {
  state = { share: true };
  renderVals() {
    const on = this.state.share;
    return {
      shareOn: on ? 'true' : 'false',
      shareText: on ? '已開啟，彙總後作為協商依據' : '已關閉，只在手機上給你建議',
      trackBg: on ? '#0E6F84' : '#C9C1BB',
      knobSide: on ? 'flex-end' : 'flex-start',
      toggleShare: () => this.setState({ share: !on })
    };
  }
}
</script>
</body>
</html>
