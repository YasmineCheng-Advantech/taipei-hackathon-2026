<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>從哪裡出發</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.chip{appearance:none;border:0;border-radius:16px;background:#DEDCDA;color:#3F3935;font-family:'Noto Sans TC',sans-serif;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.05);text-align:center}
.chip.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 2px rgba(255,214,170,.75)}
.chip .sub{color:#5E5650}.chip.on .sub{color:#FFFFFF}
.cta{display:flex;align-items:center;justify-content:center;height:64px;border-radius:999px;background:linear-gradient(180deg,#6BEBFA 0%,#2AD4F0 42%,#14B8E2 100%);box-shadow:inset 0 7px 0 rgba(255,255,255,.32),0 7px 0 #1C8DB3,0 18px 28px rgba(20,140,180,.25);color:#0B3A4A;font:900 22px/1 'Noto Sans TC',sans-serif;letter-spacing:.16em;text-decoration:none}
.cta:hover{color:#0B3A4A;filter:brightness(1.04)}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
.tab.on{color:#C8481F;font-weight:500}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 220px at 50% 690px, rgba(240,130,60,.34), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF7F1 120px, #FBE6D6 380px, #F7D3B8 620px, #FFF8F3 844px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 22px 18px 0 30px">
    <p style="margin: 0; font-size: 14px; letter-spacing: 0.14em; color: #8A3A18">第 1 步，共 3 步</p>
    <a href="Menu.dc.html" aria-label="開啟選單" style="width: 48px; height: 48px; display: grid; place-items: center; color: #D2532A">
      <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 2h26M2 12h26M2 22h26"></path></svg>
    </a>
  </div>
  <div style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0 0 0 14px; font-size: 20px; font-weight: 500; letter-spacing: 0.14em; color: #3A2A22">你從哪裡出發</h1>
    <p style="margin: 0 0 0 14px; font-size: 14px; line-height: 1.6; letter-spacing: 0.06em; color: #6B4A3A">我們用它找出你會經過哪個內湖入口，不會記下你的地址。</p>
    <div style="background: #FFFFFF; border-radius: 28px; box-shadow: 0 12px 32px rgba(214,100,40,.13); padding: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px">
      <sc-for list="{{origins}}" as="o" hint-placeholder-count="6">
        <button type="button" class="chip {{o.cls}}" aria-pressed="{{o.on}}" onClick="{{o.pick}}" style="min-height: 84px; padding: 10px 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
          <span style="font-size: 17px; font-weight: 500; letter-spacing: 0.1em; line-height: 1.35">{{o.label}}</span>
          <span class="sub" style="font-size: 12px; letter-spacing: 0.06em">{{o.region}}</span>
        </button>
      </sc-for>
    </div>
  </div>
  <a class="cta" href="{{nextHref}}" style="position: absolute; top: 640px; left: 40px; right: 40px">下一步</a>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 78px; background: #FFFFFF; box-shadow: 0 -1px 0 #F1E4DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="tab on" href="Today.dc.html">今日</a>
    <a class="tab" href="City.dc.html">數據</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { pick: 'zhongshan-dazhi' };
  renderVals() {
    const list = [
      { id: 'zhongshan-dazhi', label: '中山／大直／士林', region: '臺北市' },
      { id: 'songshan-nangang', label: '松山／信義／南港', region: '臺北市' },
      { id: 'xindian-wenshan', label: '新店／文山', region: '新北市・臺北市' },
      { id: 'ntpc-west', label: '三重／蘆洲／板橋', region: '新北西側' },
      { id: 'xizhi-keelung', label: '汐止／基隆', region: '新北市・基隆市' },
      { id: 'other', label: '其他', region: '自己選入口' }
    ];
    return {
      origins: list.map((o) => ({
        ...o,
        on: o.id === this.state.pick ? 'true' : 'false',
        cls: o.id === this.state.pick ? 'on' : '',
        pick: () => this.setState({ pick: o.id })
      })),
      nextHref: this.state.pick === 'xizhi-keelung' ? 'NoData.dc.html' : 'Setup.dc.html'
    };
  }
}
</script>
</body>
</html>
