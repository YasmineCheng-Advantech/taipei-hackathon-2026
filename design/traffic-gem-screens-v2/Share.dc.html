<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>邀同事一起錯峰</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.chip{appearance:none;border:0;border-radius:16px;background:#DEDCDA;color:#3F3935;font-family:'Noto Sans TC',sans-serif;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.chip.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 2px rgba(255,214,170,.75)}
.sim{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE;white-space:nowrap}
.cta{display:flex;align-items:center;justify-content:center;gap:10px;height:62px;border-radius:999px;background:linear-gradient(180deg,#6BEBFA 0%,#2AD4F0 42%,#14B8E2 100%);box-shadow:inset 0 7px 0 rgba(255,255,255,.32),0 7px 0 #1C8DB3,0 18px 28px rgba(20,140,180,.25);color:#0B3A4A;font:900 21px/1 'Noto Sans TC',sans-serif;letter-spacing:.14em;text-decoration:none;border:0;cursor:pointer;width:100%}
.ghost{appearance:none;border:0;background:transparent;height:44px;font:500 15px/1 'Noto Sans TC',sans-serif;letter-spacing:.12em;color:#8A3A18;cursor:pointer}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
.tab.on{color:#C8481F;font-weight:500}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 200px at 50% 300px, rgba(240,130,60,.26), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF5EE 160px, #FBE4D3 460px, #F8D6BD 680px, #FFF8F3 844px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 12px">
    <a href="Today.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 15px; letter-spacing: 0.1em; color: #8A3A18; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"></path></svg>今日
    </a>
    <a href="Menu.dc.html" aria-label="開啟選單" style="width: 48px; height: 48px; display: grid; place-items: center; color: #D2532A">
      <svg width="30" height="24" viewBox="0 0 30 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M2 2h26M2 12h26M2 22h26"></path></svg>
    </a>
  </div>
  <div style="padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <h1 style="margin: 0 0 0 14px; font-size: 22px; font-weight: 900; letter-spacing: 0.12em; color: #5A2410">邀同事一起錯峰</h1>
    <div style="aspect-ratio: 1200 / 630; border-radius: 22px; overflow: hidden; position: relative; box-shadow: 0 16px 34px rgba(214,100,40,.22); background: radial-gradient(90% 120% at 100% 100%, #F6B07E 0%, #F7C9A6 45%, #FDF1E8 100%)">
      <div style="position: absolute; inset: 16px 18px; display: flex; flex-direction: column; justify-content: space-between">
        <div style="display: flex; align-items: center; justify-content: space-between">
          <span style="font-family: 'Grandstander', 'Noto Sans TC', sans-serif; font-weight: 800; font-size: 20px; color: #D2532A">Traffic Gem</span>
          <sc-if value="{{usesSim}}" hint-placeholder-val="{{ true }}"><span class="sim">含模擬資料</span></sc-if>
        </div>
        <p style="margin: 0; font-size: 16px; font-weight: 900; line-height: 1.6; letter-spacing: 0.04em; color: #5A2410">{{text}}</p>
        <p style="margin: 0; font-size: 11px; letter-spacing: 0.06em; color: #6B3A20">內科晨峰・挑一個比較不塞的時段 →  [作品網址]</p>
      </div>
    </div>
    <h2 style="margin: 4px 0 0 14px; font-size: 16px; font-weight: 500; letter-spacing: 0.14em; color: #3A2A22">選一張卡片</h2>
    <div style="background: #FFFFFF; border-radius: 26px; box-shadow: 0 12px 32px rgba(214,100,40,.13); padding: 12px; display: flex; flex-direction: column; gap: 8px">
      <sc-for list="{{tpls}}" as="t" hint-placeholder-count="3">
        <button type="button" class="chip {{t.cls}}" aria-pressed="{{t.on}}" onClick="{{t.pick}}" style="min-height: 50px; padding: 6px 18px; text-align: left; font-size: 16px; font-weight: 500; letter-spacing: 0.1em">{{t.title}}</button>
      </sc-for>
    </div>
    <p style="margin: 0 14px; font-size: 12.5px; line-height: 1.6; color: #6B4A3A">卡片上不放任何人數。地點與時間來自你的設定：堤頂大道（北向）、平常 07:45 經過。</p>
  </div>
  <div style="position: absolute; top: 646px; left: 40px; right: 40px; display: flex; flex-direction: column; align-items: center; gap: 6px">
    <button type="button" class="cta">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"></path><path d="M12 3v12"></path><path d="M7 8l5-5 5 5"></path></svg>
      分享出去
    </button>
    <button type="button" class="ghost">存成圖片</button>
  </div>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #FFFFFF; box-shadow: 0 -1px 0 #F1E4DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="tab on" href="Today.dc.html">今日</a>
    <a class="tab" href="City.dc.html">數據</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  state = { t: 0 };
  renderVals() {
    const tpls = [
      { title: '錯峰可以少塞多久', text: '我每天 07:45 卡在堤頂大道（北向）。提早經過，路上可以少 3–4 分鐘。', sim: true },
      { title: '我想錯峰，但是…', text: '我想錯峰，但要先送小孩去幼兒園。內科通勤需要的不只是早點出門。', sim: false },
      { title: '我從哪裡來', text: '我從中山／大直／士林開車到內科，每天卡在堤頂大道（北向）。你卡在哪裡？', sim: false }
    ];
    const cur = tpls[this.state.t];
    return {
      text: cur.text,
      usesSim: cur.sim,
      tpls: tpls.map((t, i) => ({
        title: t.title,
        cls: i === this.state.t ? 'on' : '', on: i === this.state.t ? 'true' : 'false',
        pick: () => this.setState({ t: i })
      }))
    };
  }
}
</script>
</body>
</html>
