<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<title>少塞幾分與早到幾分</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grandstander:wght@800&amp;family=Noto+Sans+TC:wght@400;500;700;900&amp;display=swap">
<style>
body{margin:0}
a{color:#0E6F84}a:hover{color:#0B3A4A}
.sim{padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;color:#7A5200;background-color:#FBF0D9;background-image:repeating-linear-gradient(135deg,rgba(122,82,0,.12) 0 1.5px,transparent 1.5px 5px);box-shadow:inset 0 0 0 1px #EBD9AE;white-space:nowrap}
.card{background:#FFFFFF;border-radius:26px;box-shadow:0 12px 32px rgba(214,100,40,.13)}
.seg{appearance:none;border:0;border-radius:14px;min-height:44px;background:#DEDCDA;color:#3F3935;font:500 15px/1 'Noto Sans TC',sans-serif;letter-spacing:.06em;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.05)}
.seg.on{background:linear-gradient(180deg,#F6AC72 0%,#F08A4F 42%,#E2582A 100%);color:#FFFFFF;font-weight:700;box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 0 0 2px rgba(255,214,170,.75)}
.pt{appearance:none;border:0;position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;padding:0;background:transparent;cursor:pointer;display:grid;place-items:center}
.pt i{display:block;width:14px;height:14px;border-radius:50%;box-sizing:border-box;border:2px solid #FFFFFF;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.pt.sel i{width:20px;height:20px;box-shadow:0 0 0 3px #3A2418}
.pt:focus-visible{outline:3px solid #0B3A4A;border-radius:50%}
.lab{position:absolute;font-size:11px;font-weight:700;color:#3A2418;pointer-events:none;transform:translate(10px,-140%);white-space:nowrap;font-variant-numeric:tabular-nums}
.tab{display:flex;align-items:center;justify-content:center;padding-bottom:8px;font-size:19px;letter-spacing:.12em;color:#4A4440;text-decoration:none}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 960px; overflow: hidden; font-family: 'Noto Sans TC', system-ui, sans-serif; color: #3A2418; background: radial-gradient(70% 220px at 50% 600px, rgba(240,130,60,.22), rgba(240,130,60,0) 70%), linear-gradient(180deg, #FFFFFF 0px, #FFF5EE 160px, #FBE4D3 460px, #F8D6BD 760px, #FFF8F3 960px)">
  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 0 12px">
    <a href="Today.dc.html" style="height: 48px; padding: 0 12px; display: flex; align-items: center; gap: 6px; font-size: 15px; letter-spacing: 0.1em; color: #8A3A18; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 4l-6 6 6 6"></path></svg>今日
    </a>
    <span class="sim">含模擬資料</span>
  </div>
  <div style="padding: 0 16px; display: flex; flex-direction: column; gap: 12px">
    <div style="margin: 0 0 0 14px; display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 900; letter-spacing: 0.08em; color: #5A2410">少塞幾分，要付出什麼？</h1>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.6; color: #6B4A3A">堤頂大道・每個點是一個經過時段，和你平常的時段比</p>
    </div>
    <div role="group" aria-label="最晚幾點到" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <sc-for list="{{dls}}" as="d" hint-placeholder-count="2">
        <button type="button" class="seg {{d.cls}}" aria-pressed="{{d.on}}" onClick="{{d.pick}}">{{d.label}}</button>
      </sc-for>
    </div>
    <section class="card" aria-label="各時段的取捨" style="padding: 14px 14px 12px; display: flex; flex-direction: column; gap: 6px">
      <div style="position: relative; width: 330px; height: 290px">
        <svg viewBox="0 0 330 290" width="330" height="290" aria-hidden="true" style="position: absolute; inset: 0; overflow: visible">
          <rect x="135" y="10" width="185" height="130" rx="10" fill="#EAF8FB"></rect>
          <rect x="20" y="10" width="115" height="130" rx="10" fill="#F4FBFC"></rect>
          <rect x="20" y="140" width="300" height="130" rx="10" fill="#FDF1EA"></rect>
          <line x1="135" y1="10" x2="135" y2="270" stroke="#8C7A6E" stroke-width="1.2"></line>
          <line x1="20" y1="140" x2="320" y2="140" stroke="#8C7A6E" stroke-width="1.2"></line>
          <text x="314" y="28" text-anchor="end" font-size="11" font-weight="700" fill="#0B4F60">少塞，但要早到</text>
          <text x="26" y="28" font-size="11" font-weight="700" fill="#0B4F60">少塞，晚一點到</text>
          <text x="314" y="262" text-anchor="end" font-size="11" font-weight="700" fill="#8A2E0B">反而更塞</text>
          <text x="139" y="282" font-size="10" fill="#6B4A3A">0</text>
          <text x="320" y="282" text-anchor="end" font-size="10" fill="#6B4A3A">早到 →</text>
          <text x="20" y="282" font-size="10" fill="#6B4A3A">← 晚到</text>
        </svg>
        <span style="position: absolute; left: -4px; top: 60px; font-size: 10px; color: #6B4A3A; writing-mode: vertical-rl">路上少幾分 ↑</span>
        <sc-for list="{{pts}}" as="p" hint-placeholder-count="8">
          <button type="button" class="pt {{p.cls}}" style="left: {{p.x}}px; top: {{p.y}}px" aria-label="{{p.aria}}" aria-pressed="{{p.on}}" onClick="{{p.pick}}"><i style="background: {{p.bg}}"></i></button>
          <span class="lab" style="left: {{p.x}}px; top: {{p.y}}px">{{p.key}}</span>
        </sc-for>
      </div>
      <div style="display: flex; gap: 12px; flex-wrap: wrap; padding: 0 4px; font-size: 12px; color: #6B4A3A">
        <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #14B8E2"></i>可以選</span>
        <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #3A2418"></i>平常</span>
        <span style="display: flex; align-items: center; gap: 5px"><i aria-hidden="true" style="width: 12px; height: 12px; border-radius: 50%; background: #C93A22"></i>尖峰或可能遲到</span>
      </div>
      <p aria-live="polite" style="margin: 4px 4px 0; padding-top: 10px; border-top: 2px dotted #F1DCCD; font-size: 14px; line-height: 1.65">{{readout}}</p>
    </section>
    <section class="card" style="padding: 16px 20px; display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 15px; font-weight: 700; letter-spacing: 0.06em">為什麼推薦不是最左上那個點</h2>
      <p style="margin: 0; font-size: 13.5px; line-height: 1.7; color: #5A3A2A">省最多的時段常常要早到很久。我們挑的是「省得到、又不用早到太久」的那一格，而且會把不同的人分散到不同時段。</p>
    </section>
  </div>
  <nav aria-label="主要分頁" style="position: absolute; left: 0; right: 0; bottom: 0; height: 66px; background: #FFFFFF; box-shadow: 0 -1px 0 #F1E4DA; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a class="tab" href="Today.dc.html">今日</a>
    <a class="tab" href="City.dc.html">數據</a>
    <a class="tab" href="Settings.dc.html">設定</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":960}}'>
class Component extends DCLogic {
  state = { d: 0, sel: 2 };
  renderVals() {
    const S = this.state;
    const D = [
      { label: '8:30 前到', rec: 2, base: 3, o: [['07:00',7,52,'open'],['07:15',6,36,'open'],['07:30',4,19,'open'],['07:45',0,0,'open'],['08:00',-5,-20,'peak'],['08:15',-12,-42,'late']] },
      { label: '10:00 前到', rec: 6, base: 5, o: [['08:00',3,78,'open'],['08:15',-4,56,'peak'],['08:30',-8,37,'peak'],['08:45',-9,21,'peak'],['09:00',-5,10,'peak'],['09:15',0,0,'open'],['09:30',6,-9,'open'],['09:45',11,-19,'open']] }
    ];
    const d = D[S.d];
    const sel = Math.min(S.sel, d.o.length - 1);
    const px = (x) => 20 + ((x + 50) / 130) * 300;
    const py = (y) => 10 + ((14 - y) / 28) * 260;
    const color = (st, i) => (i === d.base ? '#3A2418' : st === 'open' ? '#14B8E2' : '#C93A22');
    const stText = { open: '可以選', peak: '尖峰', late: '可能遲到' };
    const o = d.o[sel];
    const early = o[2] > 0 ? '早 ' + o[2] + ' 分到' : o[2] < 0 ? '晚 ' + (-o[2]) + ' 分到' : '一樣時間到';
    const saved = o[1] > 0 ? '路上少 ' + o[1] + ' 分' : o[1] < 0 ? '路上多 ' + (-o[1]) + ' 分' : '路上時間一樣';
    return {
      dls: D.map((x, i) => ({ label: x.label, cls: i === S.d ? 'on' : '', on: i === S.d ? 'true' : 'false', pick: () => this.setState({ d: i, sel: x.rec }) })),
      pts: d.o.map((p, i) => ({
        key: p[0] + (i === d.rec ? ' 建議' : i === d.base ? ' 平常' : ''),
        x: Math.round(px(p[2])), y: Math.round(py(p[1])),
        bg: color(p[3], i),
        cls: i === sel ? 'sel' : '', on: i === sel ? 'true' : 'false',
        aria: p[0] + ' 經過：路上少 ' + p[1] + ' 分，早到 ' + p[2] + ' 分，' + stText[p[3]],
        pick: () => this.setState({ sel: i })
      })),
      readout: o[0] + ' 經過：' + saved + '，比平常' + early + '公司（' + stText[o[3]] + '）。'
    };
  }
}
</script>
</body>
</html>
